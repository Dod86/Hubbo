      const totalCurrent = item.currentCost || item.monthly || 0;
      subs.forEach((s) => {
        const m = monthlyEquivalent(convertAmount(costOn(s, todayISO), s.currency || settings.currency, settings.currency, rates), s.frequency);
        const share = totalCurrent > 0 ? m / totalCurrent : 0;
        map[s.category] = (map[s.category] || 0) + item.saving * share;
      });
    });
    return CATEGORIES.map((c) => ({ ...c, total: map[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);
  }, [savingsHeadline, todayISO, settings.currency, settings.language, settings.categoryColors, rates]);

  const savingsPlanHints = useMemo(() => {
    if (savingsPlansByService.size === 0) return [];
    const out = [];
    activeSubs.forEach((s) => {
      const plan = savingsPlansByService.get(normaliseServiceName(s.name));
      if (!plan) return;
      const monthly = monthlyEquivalent(
        convertAmount(costOn(s, todayISO), s.currency || settings.currency, settings.currency, rates),
        s.frequency
      );
      const hints = [];
      // Proporre l'annuale a chi paga già una volta l'anno o meno spesso
      // sarebbe un consiglio già seguito.
      if (plan.annuale && plan.annuale.disponibile && freqOf(s.frequency).perYear > 1) {
        hints.push({ id: "yearly", icon: "calendarIcon", text: t.savingsYearly, note: plan.annuale.nota || "" });
      }
      if (plan.famiglia && plan.famiglia.disponibile && !s.sharedPeople) {
        hints.push({
          id: "family",
          icon: "users",
          text: plan.famiglia.persone ? t.savingsFamilyN(plan.famiglia.persone) : t.savingsFamily,
          note: plan.famiglia.nota || "",
        });
      }
      let planSaving = 0;
      if (plan.pubblicita && plan.pubblicita.disponibile && plan.pubblicita.prezzo != null) {
        const adPrice = convertAmount(plan.pubblicita.prezzo, savingsFileCurrency, settings.currency, rates);
        // Solo se costa davvero meno di quello che paghi: su un piano già
        // economico il suggerimento sarebbe un invito a spendere di più.
        if (adPrice < monthly - 0.01) {
          planSaving = monthly - adPrice;
          hints.push({
            id: "ads",
            icon: "tag",
            text: t.savingsAds(money(adPrice)),
            note: plan.pubblicita.dettaglio || plan.pubblicita.nome || "",
          });
        }
      }
      if (plan.studenti && plan.studenti.disponibile) {
        hints.push({ id: "student", icon: "sparkles", text: t.savingsStudent, note: plan.studenti.nota || "" });
      }
      if (hints.length === 0) return;
      out.push({
        sub: s,
        monthly,
        // L'annuale, la famiglia, la tariffa studenti non hanno un prezzo nel
        // listino — solo la conferma che esistono — quindi non entrano nel
        // numero. Resta a zero invece di ricevere una stima inventata.
        saving: planSaving,
        hints: hints.slice(0, 3),
        link: plan.link || "",
        checked: plan.verificato || "",
        note: plan.nota || "",
      });
    });
    return out.sort((a, b) => b.monthly - a.monthly);
  }, [activeSubs, savingsPlansByService, savingsFileCurrency, todayISO, settings.currency, settings.language, rates]);

  const savingsOffers = useMemo(() => {
    if (!offersFile || !Array.isArray(offersFile.offerte)) return [];
    const mine = new Map();
    enriched.forEach((s) => {
      const key = normaliseServiceName(s.name);
      const previous = mine.get(key);
      // Fra due abbonamenti allo stesso servizio vince quello attivo: è il
      // caso più severo, ed è quello che decide se l'offerta ti riguarda.
      // "Finito" vale sia per data di fine sia per pausa, stessa cosa dal
      // 10 settembre.
      const prevDone = previous && (previous.isEnded || previous.paused);
      const sDone = s.isEnded || s.paused;
      if (!previous || (prevDone && !sDone)) mine.set(key, s);
    });
    return offersFile.offerte
      .filter((o) => offerIsLive(o, todayISO))
      .map((o) => ({ offer: o, sub: mine.get(normaliseServiceName(o.servizio)) }))
      // Solo offerte che toccano qualcosa che hai davvero. Il resto è un
      // volantino, e un volantino non ha niente a che fare con la tua spesa.
      .filter((x) => !!x.sub && (!x.offer.soloNuoviClienti || x.sub.isEnded || x.sub.paused))
      .sort((a, b) => (a.offer.scade < b.offer.scade ? -1 : 1));
  }, [offersFile, enriched, todayISO]);

  const savingsEmpty =
    savingsPriceIncreases.length === 0 &&
    savingsEndingPromos.length === 0 &&
    savingsOffers.length === 0 &&
    savingsDuplicates.length === 0 &&
    savingsPlanHints.length === 0 &&
    savingsOpportunities.length === 0;

  // Payments are *recorded*, not recalculated. Each billing date that passes
  // gets written once with the amount, currency and converted total frozen as
  // they were that day, so a later price rise or currency switch can never
  // rewrite what you already paid. Existing records are never touched again,
  // which also preserves any paid/not-paid correction made by hand.
  useEffect(() => {
    // `subs` is null until the first load resolves, so nothing is recorded
    // before the real subscriptions are in hand.
    if (!paymentsLoaded || !subs) return;
    const base = settings.currency;
    const byId = new Map(payments.map((p) => [p.id, p]));
    const valid = new Set();
    const currentSubIds = new Set(subs.map((s) => s.id));
    let changed = false;

    subs.forEach((sub) => {
      pastOccurrences(sub, today).forEach((d) => {
        const iso = toLocalISO(d);
        const id = `${sub.id}::${iso}`;
        valid.add(id);
        if (byId.has(id)) return;
        const currency = sub.currency || base;
        byId.set(id, {
          id,
          subId: sub.id,
          name: sub.name,
          category: sub.category,
          // The amount actually charged that day, which during an offer is
          // the offer price and not the ordinary one.
          amount: costOn(sub, iso),
          currency,
          baseCurrency: base,
          baseAmount: convertAmount(costOn(sub, iso), currency, base, rates),
          date: iso,
          status: "paid",
          // Anything older than today was rebuilt from the cycle rather than
          // observed as it happened, and is labelled as such in the UI.
          estimated: iso !== todayISO,
        });
        changed = true;
      });
    });

    // Historical payments are an immutable ledger: once a payment is on
    // record, a later price rise, currency switch, pause or edit must never
    // rewrite it. But a record that was only ever a guess (estimated: true,
    // never actually observed on the day itself) and that the corrected
    // cycle — segmented per cycleSegments — no longer recognises as a real
    // billing date at all, was never a legitimate entry to begin with: it is
    // the exact shape of the duplicate created by the old pause/resume and
    // renewal-date-edit bug. Those, and only those, are dropped here, which
    // is what lets subscriptions affected before this fix heal on their own
    // the next time the app runs. A hand-made "segna come non pagato" is
    // untouched, because it stays on a date the cycle still recognises.
    // Trashed or otherwise no-longer-existing subscriptions are left alone
    // entirely, since they never enter `valid` in the first place.
    const beforeCount = byId.size;
    const next = Array.from(byId.values()).filter((p) => {
      if (!p.estimated) return true;
      if (!currentSubIds.has(p.subId)) return true;
      return valid.has(p.id);
    });
    if (changed || next.length !== beforeCount) persistPayments(next.sort((a, b) => (a.date < b.date ? 1 : -1)));
  }, [subs, payments, paymentsLoaded, todayISO, settings.currency, rates]);

  // Snapshots stay authoritative while the main currency is unchanged; if it
  // was switched, the original amount is reconverted at today's rate.
  const paymentInBase = (p) =>
    p.baseCurrency === settings.currency && typeof p.baseAmount === "number"
      ? p.baseAmount
      : convertAmount(p.amount, p.currency, settings.currency, rates);

  // Un abbonamento nel cestino deve sparire da tutta l'app, non solo dal
  // Calendario. Il Calendario lo perde già da solo perché legge `subs`, che
  // non lo contiene più; lo Storico invece legge `payments`, un elenco a sé
  // che il cestino non toccava. Senza questo filtro le due schede potevano
  // disaccordarsi proprio quando l'utente elimina qualcosa — il momento in cui
  // si fida di più che l'app abbia fatto quello che ha chiesto. I pagamenti
  // stessi non vengono cancellati qui, solo nascosti: al ripristino
  // ricompaiono da soli, perché nel frattempo non sono mai stati toccati.
  const visiblePayments = useMemo(() => {
    if (!trash || trash.length === 0) return payments;
    const hidden = new Set(trash.map((s) => s.id));
    return payments.filter((p) => !hidden.has(p.subId));
  }, [payments, trash]);

  // The filter options are built from the payments themselves, so the pickers
  // only ever offer years, services and categories that actually occur.
  const historyYears = useMemo(() => {
    const years = new Set(visiblePayments.map((p) => p.date.slice(0, 4)));
    years.delete(String(today.getFullYear()));
    return Array.from(years).sort().reverse();
  }, [visiblePayments, todayISO]);

  const historyServices = useMemo(() => {
    const map = new Map();
    visiblePayments.forEach((p) => {
      if (!map.has(p.subId)) map.set(p.subId, { label: p.name, category: p.category });
    });
    return Array.from(map.entries())
      .map(([value, v]) => ({ value, label: v.label, category: v.category }))
      .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: "base" }));
  }, [visiblePayments]);

  const historyCategories = useMemo(() => {
    const present = new Set(visiblePayments.map((p) => p.category));
    return CATEGORIES.filter((c) => present.has(c.id));
  }, [visiblePayments, settings.language, settings.categoryColors]);

  const filteredPayments = useMemo(() => {
    const currentYear = String(today.getFullYear());
    const from12 = new Date(today.getFullYear(), today.getMonth() - 11, 1);
    return visiblePayments.filter((p) => {
      if (historySub !== "all" && p.subId !== historySub) return false;
      if (historyCats.length > 0 && !historyCats.includes(p.category)) return false;
      if (historyPeriod === "custom") {
        if (historyFrom && p.date < historyFrom) return false;
        if (historyTo && p.date > historyTo) return false;
        return true;
      }
      if (historyPeriod === "year") return p.date.startsWith(currentYear);
      if (historyPeriod === "12m") return parseLocalDate(p.date) >= from12;
      if (/^\d{4}$/.test(historyPeriod)) return p.date.startsWith(historyPeriod);
      return true;
    });
  }, [visiblePayments, historyPeriod, historySub, historyCats, historyFrom, historyTo, todayISO]);

  const historyFiltered = historyPeriod !== "all" || historySub !== "all" || historyCats.length > 0;

  const historyPeriodLabel =
    historyPeriod === "year" ? t.historyPeriodYear
    : historyPeriod === "12m" ? t.historyPeriod12m
    : historyPeriod === "custom" ? t.historyPeriodCustom
    : historyPeriod === "all" ? t.historyTotalSpent
    : historyPeriod;

  const historyMonths = useMemo(() => {
    const map = new Map();
    filteredPayments.forEach((p) => {
      const key = p.date.slice(0, 7);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(p);
    });
    return Array.from(map.entries())
      .sort((a, b) => (a[0] < b[0] ? 1 : -1))
      .map(([key, items]) => ({
        key,
        monthDate: parseLocalDate(`${key}-01`),
        items: items.slice().sort((a, b) => (a.date < b.date ? 1 : -1)),
        total: items.reduce((sum, p) => sum + (p.status === "skipped" ? 0 : paymentInBase(p)), 0),
      }));
  }, [filteredPayments, settings.currency, rates]);

  // The history only ever renders one year at a time: after a few years of
  // tracking, drawing every month at once would make the tab heavy to scroll
  // and slow to paint. Older years are revealed on demand, one tap each.
  const historyYearList = useMemo(
    () => Array.from(new Set(historyMonths.map((m) => m.key.slice(0, 4)))).sort().reverse(),
    [historyMonths]
  );

  const visibleHistoryMonths = useMemo(() => {
    const shown = new Set(historyYearList.slice(0, historyShownYears));
    return historyMonths.filter((m) => shown.has(m.key.slice(0, 4)));
  }, [historyMonths, historyYearList, historyShownYears]);

  const nextOlderYear = historyYearList[historyShownYears];

  function pushToast(text) {
    const id = ++toastIdRef.current;
    setToasts((list) => [...list, { id, text }]);
    setTimeout(() => setToasts((list) => list.filter((x) => x.id !== id)), 2600);
  }

  // Revealing the next year can jump over years with nothing in them. Those
  // gaps are called out one notice each, so a two-year jump reads as two
  // distinct skips rather than one vague message.
  function revealOlderYear() {
    const oldestShown = historyYearList[historyShownYears - 1];
    const next = historyYearList[historyShownYears];
    if (!next) return;
    for (let y = Number(oldestShown) - 1; y > Number(next); y--) {
      pushToast(t.historyYearSkipped(String(y)));
    }
    setHistoryShownYears((n) => n + 1);
  }

  const historyTotals = useMemo(() => {
    let total = 0;
    let count = 0;
    filteredPayments.forEach((p) => {
      if (p.status === "skipped") return;
      total += paymentInBase(p);
      count++;
    });
    return { total, count };
  }, [filteredPayments, settings.currency, rates]);

  const historyCategoryTotals = useMemo(() => {
    const map = {};
    filteredPayments.forEach((p) => {
      if (p.status === "skipped") return;
      const value = paymentInBase(p);
      map[p.category] = (map[p.category] || 0) + value;
    });
    return CATEGORIES.map((c) => ({ ...c, total: map[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);
  }, [filteredPayments, settings.currency, rates, settings.language, settings.categoryColors]);

  const missingStartCount = useMemo(
    () => (subs || []).filter((s) => !s.startDate && !s.endDate).length,
    [subs]
  );

  // Which payments a correction applies to. A price almost never changes for a
  // single month: it changes from a date onwards, or it was always wrong before
  // one. Restricted to the same subscription so nothing else is touched.
  function paymentsInScope(target, scope) {
    if (!target) return [];
    return payments.filter((p) => {
      if (p.subId !== target.subId) return false;
      if (scope === "before") return p.date <= target.date;
      if (scope === "after") return p.date >= target.date;
      return p.id === target.id;
    });
  }

  // The sync effect leaves existing rows alone, so a corrected amount is never
  // overwritten later.
  async function savePaymentAmount(target, raw, scope) {
    const value = parseAmount(raw);
    if (!(value > 0)) return;
    const ids = new Set(paymentsInScope(target, scope).map((p) => p.id));
    if (ids.size === 0) return;
    await persistPayments(
      payments.map((p) =>
        ids.has(p.id)
          ? {
              ...p,
              amount: value,
              baseCurrency: settings.currency,
              baseAmount: convertAmount(value, p.currency, settings.currency, rates),
              edited: true,
            }
          : p
      )
    );
  }

  useEffect(() => {
    setHistoryShownYears(1);
  }, [historyPeriod, historySub, historyCats, historyFrom, historyTo]);

  async function togglePaymentStatus(id) {
    await persistPayments(
      payments.map((p) => (p.id === id ? { ...p, status: p.status === "skipped" ? "paid" : "skipped" } : p))
    );
  }

  // Toglie del tutto la riga, invece di lasciarla come "non pagato" senza
  // importo. Rimuove solo quel record: se il servizio ha altri pagamenti,
  // per costruzione qui non ce ne sono — è per questo che si è arrivati a
  // proporlo.
  async function wipeServiceHistory(subId) {
    await persistPayments(payments.filter((p) => p.subId !== subId));
  }

  const calendarMonthDate = useMemo(() => new Date(today.getFullYear(), today.getMonth() + calendarOffset, 1), [calendarOffset]);

  const weekdayLabels = useMemo(() => {
    const base = new Date(2024, 0, 1);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      return d.toLocaleDateString(locale, { weekday: "narrow" });
    });
  }, [locale]);

  function buildMonthView(offset) {
    const monthDate = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const days = [];
    for (let i = 0; i < startOffset; i++) days.push(null);
    for (let d = 1; d <= daysInMonth; d++) days.push(d);

    const monthStartISO = `${year}-${String(month + 1).padStart(2, "0")}-01`;
    const monthEndISO = `${year}-${String(month + 1).padStart(2, "0")}-${String(daysInMonth).padStart(2, "0")}`;

    const byDay = {};
    // Built from every subscription rather than only the active ones: a service
    // cancelled in June was genuinely being billed in March, and a past month
    // should show it.
    //
    // Il passato e oggi arrivano SOLO dai pagamenti già registrati, mai da un
    // ricalcolo delle regole del ciclo: è la stessa identica fonte dello
    // Storico, quindi i due non possono più mostrare risultati diversi — se
    // un pagamento è nello Storico, è anche nel Calendario, punto. Solo i
    // giorni futuri restano una proiezione dal ciclo attuale (pausa inclusa),
    // perché per quelli non esiste ancora nulla da registrare.
    enriched.forEach((s) => {
      const recorded = payments.filter((p) => p.subId === s.id && p.date >= monthStartISO && p.date <= monthEndISO);
      const recordedDates = new Set();
      recorded.forEach((payment) => {
        recordedDates.add(payment.date);
        const occDate = parseLocalDate(payment.date);
        const key = occDate.getDate();
        if (!byDay[key]) byDay[key] = [];
        byDay[key].push({ ...s, _calendarDate: payment.date, _calendarPayment: payment });
      });

      const occs = occurrencesInMonth(s, monthDate);
      occs.forEach((occDate) => {
        // Oggi e il passato sono già stati gestiti sopra dai pagamenti veri;
        // qui restano solo i giorni a venire.
        if (occDate <= today) return;
        const dateISO = toLocalISO(occDate);
        if (recordedDates.has(dateISO)) return;
        if (s.endDate && occDate > parseLocalDate(s.endDate)) return;
        if (wasPausedOn(s, occDate)) return;
        // Subscriptions paused before pause dates were recorded have no periods
        // to check, quindi un abbonamento attualmente in pausa resta nascosto
        // dai mesi futuri comunque.
        if (s.paused) return;
        const key = occDate.getDate();
        if (!byDay[key]) byDay[key] = [];
        byDay[key].push({ ...s, _calendarDate: dateISO, _calendarPayment: null });
      });
    });

    let total = 0;
    let count = 0;
    const catMap = {};
    Object.entries(byDay).forEach(([dayISO, arr]) => {
      arr.forEach((s) => {
        // Priced on the day it falls, not on today: an offer that ends inside
        // the month being shown must change the total from that day onwards.
        const dateISO = `${year}-${String(month + 1).padStart(2, "0")}-${String(dayISO).padStart(2, "0")}`;
        const payment = s._calendarPayment;
        const value = payment
          ? paymentInBase(payment)
          : convertAmount(costOn(s, dateISO), s.currency || settings.currency, settings.currency, rates);
        total += value;
        count++;
        catMap[s.category] = (catMap[s.category] || 0) + value;
      });
    });
    const byCategory = CATEGORIES.map((c) => ({ ...c, total: catMap[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);

    return { monthDate, days, byDay, stats: { total, count, byCategory } };
  }

  const monthViews = useMemo(
    () => ({
      prev: buildMonthView(calendarOffset - 1),
      current: buildMonthView(calendarOffset),
      next: buildMonthView(calendarOffset + 1),
    }),
    [calendarOffset, enriched, payments, rates, settings.currency, todayISO, settings.categoryColors]
  );
  const renewalsByDay = monthViews.current.byDay;
  const calendarMonthStats = monthViews.current.stats;

  function resetCalendarDrag() {
    setCalendarTouchStartX(null);
    setCalendarTouchStartY(null);
    setCalendarAxis(null);
    setCalendarDragOffset(0);
    setIsDraggingCalendar(false);
  }

  useEffect(() => {
    const delta = calendarOffset - previousOffset.current;
    previousOffset.current = calendarOffset;
    if (delta !== 0) setMonthDirection(delta > 0 ? "left" : "right");
  }, [calendarOffset]);

  const monthAnim =
    monthDirection === null ? "" : monthDirection === "left" ? "rb-view-left" : "rb-view-right";

  function handleCalendarTouchStart(e) {
    if (slideDirection !== 0) return;
    setCalendarTouchStartX(e.touches[0].clientX);
    setCalendarTouchStartY(e.touches[0].clientY);
    setCalendarAxis(null);
    setCalendarDragOffset(0);
  }

  function handleCalendarTouchMove(e) {
    if (calendarTouchStartX === null) return;
    const dx = e.touches[0].clientX - calendarTouchStartX;
    const dy = e.touches[0].clientY - calendarTouchStartY;

    // Lock the gesture to one axis after a small movement, so a diagonal or
    // vertical swipe scrolls the page instead of half-dragging the calendar.
    let axis = calendarAxis;
    if (!axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      setCalendarAxis(axis);
      if (axis === "x") setIsDraggingCalendar(true);
    }
    if (axis !== "x") return;
    setCalendarDragOffset(dx);
  }

  function handleCalendarTouchEnd() {
    if (calendarTouchStartX === null) return;
    const threshold = 50;
    const dir = calendarAxis === "x" && calendarDragOffset < -threshold ? 1 : calendarAxis === "x" && calendarDragOffset > threshold ? -1 : 0;
    resetCalendarDrag();
    if (dir !== 0) setSlideDirection(dir);
  }

  useEffect(() => {
    if (slideDirection === 0) return;
    const timer = setTimeout(() => {
      setNoTransition(true);
      setCalendarOffset((prev) => prev + slideDirection);
      setSelectedDay(null);
      setSlideDirection(0);
    }, 300);
    return () => clearTimeout(timer);
  }, [slideDirection]);

  useEffect(() => {
    if (!noTransition) return;
    const raf = requestAnimationFrame(() => setNoTransition(false));
    return () => cancelAnimationFrame(raf);
  }, [noTransition]);

  function jumpToMonth(year, monthIndex) {
    const offset = (year - today.getFullYear()) * 12 + (monthIndex - today.getMonth());
    setNoTransition(true);
    setCalendarOffset(offset);
    setSelectedDay(null);
    setSlideDirection(0);
    setShowMonthPicker(false);
  }

  function goToToday() {
    if (calendarOffset === 0) return;
    setNoTransition(true);
    setCalendarOffset(0);
    setSelectedDay(null);
    setSlideDirection(0);
  }

  function renderMonthDayGrid(monthView, interactive) {
    return (
      <div className="grid grid-cols-7 gap-1">
        {monthView.days.map((day, i) => {
          if (!day) return <div key={i} />;
          const dayRenewals = monthView.byDay[day] || [];
          const cellDate = new Date(monthView.monthDate.getFullYear(), monthView.monthDate.getMonth(), day);
          const isToday = cellDate.toDateString() === today.toDateString();
          const isSelected = interactive && selectedDay === day;
          const hasRenewals = dayRenewals.length > 0;

          // Today is a filled disc behind the number; payments are dots below it.
          // Keeping glyphs out of the cells is what makes the grid readable.
          const numberBg = isSelected ? colors.textPrimary : isToday ? ACCENT.amber : "transparent";
          const numberColor = isSelected ? colors.bg : isToday ? INK : colors.textPrimary;

          return (
            <button
              key={i}
              type="button"
              tabIndex={interactive ? 0 : -1}
              onClick={() => {
                if (!interactive) return;
                const next = isSelected ? null : day;
                setSelectedDay(next);
                if (next && agendaRef.current) {
                  // Let the agenda re-render first, then bring it into view.
                  setTimeout(() => {
                    if (agendaRef.current) {
                      agendaRef.current.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                  }, 60);
                }
              }}
              className="aspect-square rounded-xl flex flex-col items-center justify-center gap-1"
              style={{ background: "transparent" }}
            >
              <span
                style={{
                  background: numberBg,
                  color: numberColor,
                  width: 30,
                  height: 30,
                  fontWeight: isToday || isSelected || hasRenewals ? 600 : 400,
                }}
                className="rounded-full flex items-center justify-center text-sm"
              >
                {day}
              </span>
              <span className="flex items-center justify-center gap-0.5" style={{ height: 5 }}>
                {dayRenewals.slice(0, 3).map((s2) => {
                  const icon2 = serviceIcon(s2.name);
                  const cat2 = CATEGORIES.find((c2) => c2.id === s2.category) || CATEGORIES[CATEGORIES.length - 1];
                  const dotColor = (icon2 && BRAND_COLORS[icon2]) || SERVICE_COLORS[s2.name] || cat2.color;
                  return <span key={s2.id} style={{ width: 5, height: 5, borderRadius: 999, background: dotColor }} />;
                })}
              </span>
            </button>
          );
        })}
      </div>
    );
  }

  // Closing a sheet waits for its exit animation before unmounting it.
  // The duration arrives from the gesture that asked for the dismissal, so the
  // animation, the dimming veil and the moment the sheet is actually removed
  // all run to the same clock. Set on the root because the veil is not inside
  // the sheet and would otherwise keep its own fixed timing.
  function closeSheet(key, apply, ms) {
    const duration = ms || 240;
    document.documentElement.style.setProperty("--rb-out", `${duration}ms`);
    if (closingRef.current === key) return;
    if (closingRef.current) {
      // Another sheet is still animating out: apply immediately rather than
      // dropping this dismissal on the floor.
      apply();
      return;
    }
    closingRef.current = key;
    setClosingSheet(key);
    setTimeout(() => {
      apply();
      closingRef.current = null;
      setClosingSheet(null);
    }, duration);
  }

  async function testNotification() {
    if (typeof Notification === "undefined") {
      setNotifTest(t.notifUnsupported);
      return;
    }
    let permission = Notification.permission;
    if (permission === "default") permission = await Notification.requestPermission();
    if (permission !== "granted") {
      setNotifTest(t.notifDenied);
      return;
    }
    // The test uses a real subscription when there is one, so the buttons do
    // something real instead of being a picture of buttons.
    const sample = activeSubs[0] || null;
    const ok = await showNotification(t.appName, {
      body: sample ? t.notifBody(sample.name, t.inDays(3)) : t.notifTestBody,
      icon: "icons/icon-192.png",
      badge: "icons/icon-192.png",
      tag: "hubbo-test",
      data: sample
        ? { id: sample.id, cancelUrl: cancelSearchUrl(sample.name, settings.language) }
        : {},
      actions: sample ? [{ action: "cancel", title: t.notifActionCancel }] : [],
    });
    setNotifTest(ok ? t.notifTestSent : t.notifTestFailed);
  }

  function advanceLabel(d) {
    if (d === 0) return t.advSameDay;
    if (d === 1) return t.advOneDay;
    if (d === 7) return t.advWeek;
    if (d === 14) return t.advTwoWeeks;
    return t.advDays(d);
  }

  function switchView(next) {
    if (next === view) return;
    // Each tab keeps its own scroll position, like separate screens.
    viewScrollRef.current[view] = window.scrollY || window.pageYOffset || 0;
    // The slide follows the tab order, so moving right always slides left.
    setViewDirection(VIEW_ORDER.indexOf(next) > VIEW_ORDER.indexOf(view) ? "left" : "right");
    setView(next);
    const target = viewScrollRef.current[next] || 0;
    requestAnimationFrame(() => window.scrollTo(0, target));
  }

  // The page-level Back shim asks this which layer is on top. Returning true
  // means "handled, stay in the app"; false lets the system close it.
  function dismissTopLayer() {
    const busy = closingRef.current;
    const layers = [
      ["option", optionPicker, () => setOptionPicker(null)],
      ["payment", paymentAction, () => setPaymentAction(null)],
      ["cpurge", confirmPurge, () => setConfirmPurge(null)],
      ["wipehist", wipeHistoryPrompt, () => setWipeHistoryPrompt(null)],
      ["cdelall", confirmDeleteAll, () => setConfirmDeleteAll(false)],
      ["cdel", confirmDelete, () => setConfirmDelete(null)],
      ["import", pendingImport, () => { setPendingImport(null); setImportSelection(null); }],
      ["picker", pickerOpen, () => setPickerOpen(false), true],
      ["form", showForm, () => { setShowForm(false); setEditingId(null); }],
      ["month", showMonthPicker, () => setShowMonthPicker(false)],
      ["detail", detailSub, () => setDetailSub(null)],
      ["trash", showTrash, () => setShowTrash(false)],
      ["cswap", colorSwap, () => setColorSwap(null)],
      ["colors", showColors, () => { setShowColors(false); setColorEditing(null); }],
      ["paywall", showPaywall, () => setShowPaywall(false)],
      ["settings", showSettings, () => setShowSettings(false)],
    ];

    for (const [key, open, apply, immediate] of layers) {
      if (!open || busy === key) continue;
      if (immediate) apply();
      else closeSheet(key, apply);
      return true;
    }
    if (selectedDay) {
      setSelectedDay(null);
      return true;
    }
    if (view !== "list") {
      switchView("list");
      return true;
    }
    return false;
  }

  useEffect(() => {
    if (typeof window === "undefined" || !window.__hubboBack) return;
    window.__hubboBack.handler = dismissTopLayer;
    return () => {
      if (window.__hubboBack) window.__hubboBack.handler = null;
    };
  });

  if (subs === null) {
    return (
      <div style={{ background: THEMES.dark.bg, minHeight: "100vh" }} className="flex items-center justify-center">
        <style>{FONT_IMPORT + ANIMATIONS}</style>
        <Icon name="loader2" className="animate-spin" color={THEMES.dark.textSecondary} size={28} />
      </div>
    );
  }

  return (
    <div
      style={{
        background: `linear-gradient(180deg, ${colors.bgGradTop} 0%, ${colors.bg} 320px)`,
        minHeight: "100vh",
        fontFamily: "'Inter', sans-serif",
        color: colors.textPrimary,
      }}
      className="w-full pb-24"
    >
      <style>{FONT_IMPORT + ANIMATIONS}</style>

      {/* Header */}
      <div
        className="px-5 pt-4 pb-2.5 sticky top-0 z-30"
        style={{
          // Matches the top of the page gradient: a flat fill would show as a
          // rectangle against it once the header is pinned.
          background: colors.bgGradTop,
          borderBottom: `1px solid ${colors.border}`,
        }}
      >
        <div className="flex items-center justify-between mb-1">
          <Wordmark colors={colors} size={25} />
          <button data-tour="settings" onClick={() => setShowSettings(true)} style={{ color: colors.textSecondary }} aria-label={t.settings} className="p-1">
            <Icon name="settings" size={18} />
          </button>
        </div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontWeight: 500 }} className="text-2xl">
          {view === "calendar" ? t.subtitleCalendar : view === "history" ? t.subtitleHistory : view === "savings" ? t.subtitleSavings : t.subtitle}
        </h1>
      </div>

      {/* View switch (list / calendar) */}
      {view === "list" && (
      <div key="view-list" className={viewDirection === null ? "" : viewDirection === "right" ? "rb-view-right" : "rb-view-left"}>
      <div className="px-5 pt-4">
        {/* Total card */}
        <div
          data-tour="totalCard"
          {...totalSwipe.handlers}
          style={{ background: colors.surface, border: `1px solid ${colors.border}`, boxShadow: colors.cardShadow }}
          // Clipped, because the figure sits ten pixels outside its own column
          // and the entry animation starts it twenty-four further out again:
          // without this it pokes past the edge of the card on the way in.
          className="rounded-2xl p-5 mb-3 overflow-hidden"
        >
          <div className="flex items-center justify-between mb-1">
            <div key={totalPeriod} style={{ color: colors.textSecondary }} className={`text-xs ${periodAnim}`}>
              {showYear ? t.yearlySpend : t.monthlySpend}
            </div>
            {/* The card can also be flicked sideways. The switch stays because
                a gesture nothing announces is a gesture most people never find,
                and because it lets you go straight to the span you want. */}
            <div style={{ background: colors.surface2 }} className="flex rounded-full p-0.5 flex-shrink-0">
              {[
                { id: "month", label: t.periodMonth },
                { id: "year", label: t.periodYear },
              ].map((option) => {
                const active = totalPeriod === option.id;
                return (
                  <button

                  const selectedSeg = ringSelectedList ? legendSegments.find((s) => s.id === ringSelectedList) : null;
                  return selectedSeg ? (

                  ) : (

                    })

                  aria-label={t.historyCategoryLabel}
                  style={{
                    background: historyCats.length > 0 ? ACCENT.terracotta : colors.surface2,

            <div data-tour="formWhen">

                    // nuovo abbonamento — in modifica la data di inizio
                    // storica resta quella vera, cambiare il rinnovo non

                    // "Abbonato dal" non può però essere nel futuro (non si
                    // può iniziare a pagare qualcosa domani): quando il
                    // rinnovo scelto è futuro — il caso normale,
                    // aggiungendo un abbonamento — la sincronizzazione
                    // copiava comunque quella data futura anche qui,
                    // rendendo il modulo silenziosamente non salvabile
                    // finché non si accorgeva di correggerla a mano. Un
                    // vicolo cieco vero nella guida, segnalata da Erny il 12
                    // settembre: il salvataggio non andava mai a buon fine

            {/* Abbonato dal e Data di fine affiancati, non più il primo

                quasi nessuno la usa, non merita spazio finché non serve
                davvero. Abbonato dal invece non è più facoltativa: dall'11
                settembre segue il rinnovo in automatico (vedi il suo

            <div className="flex items-start gap-2">

            {form.hasPromo && (

                {/* "Costo" sopra è sempre il prezzo pieno, qui sotto è

              <textarea

                  a line sliced in half. */}
              <div
                aria-hidden="true"
                style={{
                  position: "absolute",
                  left: 0,

                  pointerEvents: "none",
                }}
              />
              <button
                type="button"
                onClick={handleAdd}
                disabled={saving}
                style={{ background: ACCENT.amber, color: INK }}

              >

                {editingId ? t.saveChanges : t.addSub}
              </button>
            </div>
            </>
            )}
          </div>
        </div>
      )}

      {/* Settings modal */}
      {showSettings && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex justify-end z-50 ${closingSheet === "settings" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("settings", () => setShowSettings(false))}>
          <div
            onClick={(e) => e.stopPropagation()}
            {...settingsSwipe.handlers}
            ref={settingsSwipe.ref}
            style={{ background: colors.bg, borderLeft: `1px solid ${colors.border}`, overscrollBehavior: "contain", width: "min(78%, 340px)", ...settingsSwipe.style }}
            className={`h-full overflow-y-auto ${closingSheet === "settings" ? "rb-panel-right-out" : "rb-panel-right"}`}
          >
            <div

              <button type="button" onClick={() => closeSheet("settings", () => setShowSettings(false))} style={{ color: colors.textSecondary }} className="p-1">
                <Icon name="x" size={20} />
              </button>
            </div>

            <div className="px-5 py-4 flex flex-col gap-6">
              {/* Preferences group: compact rows that open the shared option picker */}
              <div>
                <div style={{ color: colors.textFaint }} className="text-xs uppercase tracking-wide mb-2 px-1">
                  {t.groupGeneral}
                </div>
                <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, boxShadow: colors.cardShadow }} className="rounded-2xl overflow-hidden">
                  <button
                    type="button"
                    onClick={() =>
                      setOptionPicker({
                        title: t.language,
                        value: settings.language,

                    className="w-full px-4 py-3.5 flex items-center justify-between text-sm"
                  >
                    <span>{t.language}</span>
                    <span style={{ color: colors.textSecondary }} className="flex items-center gap-1.5">

                  </button>

                    type="button"
                    onClick={() =>
                      setOptionPicker({

                  >

                    </span>
                  </button>

                      setOptionPicker({

                  <button

                  >

              <div>
                <div style={{ color: colors.textFaint }} className="text-xs uppercase tracking-wide mb-2 px-1">

                <div style={{ background: colors.surface, border: `1px solid ${colors.border}`, boxShadow: colors.cardShadow }} className="rounded-2xl overflow-hidden">
                  <button
