// Perceived lightness, the same measure used to decide text contrast.
function luminance(hex) {
  const value = String(hex).replace("#", "");
  if (value.length !== 6) return 0.5;
  const channels = [0, 2, 4].map((i) => {
    const x = parseInt(value.slice(i, i + 2), 16) / 255;
    return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2];
}

function contrastRatio(a, b) {
  const la = luminance(a);
  const lb = luminance(b);
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

function mixToward(hex, target, amount) {
  const value = String(hex).replace("#", "");
  if (value.length !== 6) return hex;
  const pair = (i) => {
    const from = parseInt(value.slice(i, i + 2), 16);
    return Math.round(from + (target - from) * amount)
      .toString(16)
      .padStart(2, "0");
  };
  return `#${pair(0)}${pair(2)}${pair(4)}`;
}

// A brand colour nudged just far enough to stay visible on the surface it is
// drawn on. A black mark on the dark theme and a near-white one on the light
// theme are both invisible rings, and there are several of each among the real
// brand colours. The nudge is the smallest one that works, so the colour still
// reads as the brand's own.
function legibleOn(hex, surface) {
  if (!hex || contrastRatio(hex, surface) >= 1.7) return hex;
  const towards = luminance(surface) > 0.4 ? 0 : 255;
  for (let amount = 0.1; amount <= 0.85; amount += 0.05) {
    const candidate = mixToward(hex, towards, amount);
    if (contrastRatio(candidate, surface) >= 1.7) return candidate;
  }
  return mixToward(hex, towards, 0.85);
}

function RingIcon({ progress, ringColor, ended, colors, size = 52 }) {
  const r = 21;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - progress);
  const color = ended ? colors.textFaint : legibleOn(ringColor, colors.surface);
  return (
    <svg width={size} height={size} viewBox="0 0 48 48">
      <circle cx="24" cy="24" r={r} fill="none" stroke={colors.border} strokeWidth="3" />
      <circle
        cx="24" cy="24" r={r} fill="none"
        stroke={color} strokeWidth="3" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={ended ? 0 : offset}
        transform="rotate(-90 24 24)"
        style={{ transition: "stroke-dashoffset 0.6s ease" }}
      />
    </svg>
  );
}

// La forma del prezzo nel tempo, non i numeri sugli assi: basta far vedere che
// sale. I punti non sono spaziati per data reale — sarebbe illeggibile con
// pochi rilevamenti lontani nel tempo — solo nell'ordine in cui sono successi.
function PriceSparkline({ points, color, id, width = 60, height = 26 }) {
  if (!points || points.length < 2) return null;
  const min = Math.min(...points);
  const max = Math.max(...points);
  const span = max - min || 1;
  const step = width / (points.length - 1);
  const coords = points.map((v, i) => [i * step, height - ((v - min) / span) * (height - 4) - 2]);
  const line = coords.map(([x, y], i) => `${i === 0 ? "M" : "L"} ${x.toFixed(1)} ${y.toFixed(1)}`).join(" ");
  const fill = `${line} L ${width} ${height} L 0 ${height} Z`;
  const gradId = `pspark-${id}`;
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} aria-hidden="true">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.35" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={fill} fill={`url(#${gradId})`} stroke="none" />
      <path d={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// Brand colours for services whose logo is fetched rather than bundled, so they
// have no icon name to look a colour up by. Keyed by service name because four
// Adobe programs share one domain and would otherwise all come out red.
//
// Only names whose colour is actually known belong here. Everything missing
// falls back to the category colour, which is the right answer anyway for the
// generic entries — "Palestra", "Abbonamento treno" — that have no brand at all.
//
// A near-black brand would disappear against the dark theme's ring track, so

const SERVICE_COLORS = {

  "Adobe Illustrator": "#FF9A00",
  "Canva Pro": "#00C4CC",
  Vimeo: "#1AB7EA",
  "Envato Elements": "#81B441",
  // L'aubergine ufficiale sparisce sul fondo scuro: azzurro della stessa

  Slack: "#36C5F0",

// Brands without a bundled vector (Disney+, Canva, Adobe...) get their real
// logo fetched by domain; failures are remembered so we don't retry endlessly,
// and the bundled icon or category glyph covers offline use.
// Which logo source each domain ended up on, remembered for the session so a
// domain is probed once rather than on every render.
const remoteLogoStage = {};

// Brands whose mark is white or near-white: on a light chip they'd disappear,
// so they get a dark chip instead.
const LIGHT_LOGO_DOMAINS = new Set([
  "dazn.com",
  "x.com",
  "tidal.com",
  "notion.so",
  "obsidian.md",
  "medium.com",
  "substack.com",
  "ghost.org",
  "vercel.com",
  "framer.com",
  "apple.com",
  "tv.apple.com",
  "music.apple.com",
  "openai.com",
  "midjourney.com",
  "elevenlabs.io",
  "linear.app",
  "mullvad.net",
  "prestashop.com",
  "nowtv.it",
]);

const LIGHT_LOGO_ICONS = new Set([
  "dazn", "x", "tidal", "notion", "obsidian", "medium", "substack", "juventus",
  "ghost", "vercel", "framer", "appletv", "applemusic", "threads",
  "tiktok", "elevenlabs", "linear", "now",
]);

// These brand marks are bright yellow, which barely reads against the usual
// pale brand-tinted chip. They get a near-black chip instead, but keep their
// own colour (unlike LIGHT_LOGO_ICONS, whose marks turn off-white) since
// yellow already contrasts well on dark.
const YELLOW_LOGO_ICONS = new Set(["norton", "sketch", "mailchimp", "snapchat"]);

// Logos are tried against several sources in turn, because neither covers
// everything: the first returns a genuine 404 when it has nothing (which is
// what lets the initial-letter fallback work at all), while the second has
// broader coverage but answers with a generic globe instead of failing. That
// globe is caught by the size check below, so an unknown domain still ends up
// as a clean initial rather than a meaningless placeholder.
const LOGO_SOURCES = [
  (d) => `https://icons.duckduckgo.com/ip3/${d}.ico`,
  (d) => `https://www.google.com/s2/favicons?domain=${d}&sz=128`,
];

// Domains that should skip the remote lookup entirely.
const NO_REMOTE_LOGO_DOMAINS = new Set([
  "norton.com", "ea.com", "stock.adobe.com", "fantagazzetta.com", "wired.it", "framer.com",
  "dazn.com", "enjoy.eni.com", "ft.com", "juventus.com", "kenamobile.it", "postemobile.it",
  "substack.com", "atac.roma.it", "anm.it",
  // C'è già un vettore disegnato apposta per Ubisoft (BRAND_ICONS.ubisoft):
  // la favicon vera scaricata da ubisoft.com era piccola e usciva sgranata
  // ingrandita, segnalato da Erny il 10 settembre.
  "ubisoft.com",
]);

const LOCAL_SERVICE_ICONS = {
  Palestra: "dumbbell",
  Piscina: "pool",
  Padel: "padel",
  Tennis: "tennis",
  Yoga: "yoga",
  "Abbonamento stadio": "stadium",
  "Abbonamento autobus": "bus",
  "Abbonamento treno": "train",
  "Abbonamento metro": "metro",
};

function ServiceLogo({ icon, category, domain, letter, serviceName, color, size = 22, plain = false }) {
  const path = icon && BRAND_ICONS[icon];
  // Stessi tre livelli usati ovunque nell'app per il colore "di marchio":
  // l'icona propria se c'è, altrimenti il colore noto del servizio anche
  // senza un'icona dedicata (SERVICE_COLORS — Disney+, Amazon Prime,
  // Microsoft 365 e gli altri), altrimenti il colore passato da chi
  // chiama (di norma quello della categoria). Prima mancava il livello
  // di mezzo qui dentro: un servizio come Disney+ mostrava l'anello
  // attorno al logo nel proprio blu (calcolato altrove con tutti e tre i
  // livelli) ma la lettera dentro il logo nel colore generico della
  // categoria — due colori diversi sullo stesso elemento. Segnalato da
  // Erny il 12 settembre, partendo dai pallini del calendario che
  // avevano lo stesso problema (vedi più sotto, nella scheda Calendario).
  const brandColor = (icon && BRAND_COLORS[icon]) || SERVICE_COLORS[serviceName] || color;
  const fallbackIconName = CATEGORY_FALLBACK_ICON[category] || "package";

  const [stage, setStage] = useState(() =>
    domain ? remoteLogoStage[domain] || 0 : LOGO_SOURCES.length
  );
  // The real logo first, the bundled vector as the safety net — not the other
  // way round. The bundled marks are the official shapes, but they are single
  // paths in a single colour: Netflix comes out as a flat red silhouette
  // rather than the mark people recognise, and multi-coloured brands lose
  // their colours entirely.
  //
  // Nothing is lost by trying: a source that answers with a 16-pixel generic
  // placeholder is already rejected below, and when every source fails — or
  // there is no network at all — the vector underneath is still drawn.
  const localSpecial = serviceName ? LOCAL_SERVICE_ICONS[serviceName] : null;
  const useRemote = !!domain && stage < LOGO_SOURCES.length && !NO_REMOTE_LOGO_DOMAINS.has(domain);

  const advanceSource = () => {
    const next = stage + 1;
    remoteLogoStage[domain] = next;
    setStage(next);
  };

  const isYellowLogo = icon && YELLOW_LOGO_ICONS.has(icon);
  const needsDarkChip =
    (domain && LIGHT_LOGO_DOMAINS.has(domain)) || (icon && LIGHT_LOGO_ICONS.has(icon)) || isYellowLogo;

  // The chip picks up a whisper of the brand colour instead of being a hard
  // white disc: it separates from the page in both themes and gives each
  // service a little identity of its own.
  const chip = isYellowLogo
    ? { background: "#1C1814", border: "1px solid rgba(255,255,255,0.08)" }
    : needsDarkChip
    ? { background: "#25211B", border: "1px solid rgba(255,255,255,0.10)" }
    : plain
    ? { background: "transparent", border: "none" }
    : { background: `${brandColor}1F`, border: `1px solid ${brandColor}2E` };

  if (useRemote) {
    return (
      <div
        style={{ width: size, height: size, borderRadius: 999, ...chip }}
        className="flex items-center justify-center flex-shrink-0 overflow-hidden"
      >
        <img
          key={stage}
          src={LOGO_SOURCES[stage](domain)}
          alt=""
          loading="lazy"
          onError={advanceSource}
          onLoad={(e) => {
            // Rifiutata anche una favicon "vera" ma piccola, non solo il
            // segnaposto generico: l'app disegna queste icone fino a 40px, e
            // sotto i 32 si vede la sgranatura — il caso di Ubisoft, prima
            // che avesse un dominio da saltare del tutto (vedi
            // NO_REMOTE_LOGO_DOMAINS), capita anche a chi non ha un vettore
            // di riserva disegnato a mano.
            if (e.currentTarget.naturalWidth && e.currentTarget.naturalWidth < 32) advanceSource();
          }}
          style={{ width: "100%", height: "100%", objectFit: "cover" }}
        />
      </div>
    );
  }

  // Yellow marks keep their own colour even on the dark chip; every other
  // mark that needs a dark chip switches to an off-white tint instead.
  const glyphColor = needsDarkChip ? (isYellowLogo ? brandColor : "#F2F1ED") : brandColor;

  return (
    <div
      style={{ width: size, height: size, borderRadius: 999, ...chip }}
      className="flex items-center justify-center flex-shrink-0"
    >
      {path ? (
        <svg viewBox="0 0 24 24" width={size * 0.55} height={size * 0.55} fill={glyphColor}>
          <path d={path} />
        </svg>
      ) : localSpecial ? (
        <Icon name={localSpecial} size={size * 0.56} color={glyphColor} strokeWidth={2} />
      ) : letter ? (
        // No vector mark and no working remote favicon: an initial reads far
        // better than a generic category icon that every other unmatched
        // service would show as well.
        <span style={{ fontSize: size * 0.44, fontWeight: 600, color: glyphColor, lineHeight: 1 }}>
          {letter}
        </span>
      ) : (
        <Icon name={fallbackIconName} size={size * 0.55} color={glyphColor} strokeWidth={2.2} />
      )}
    </div>
  );
}

function useSystemPrefersDark() {
  const [prefersDark, setPrefersDark] = useState(
    () => typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
  );
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = (e) => setPrefersDark(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);
  return prefersDark;
}

// Un "paracadute" per errori imprevisti durante il render: senza,
// qualunque eccezione non gestita fa sparire l'intera app, schermo nero
// totale, senza un messaggio visibile — è già successo due volte con
// l'importazione di un backup (v162), prima di essere trovato e
// corretto. Un errore in un punto che non abbiamo ancora trovato
// farebbe esattamente la stessa cosa. Questo non impedisce l'errore —
// non può, non sa in anticipo dove potrebbe nascondersi — ma dà a chi
// lo vede qualcosa da leggere e da mandarmi, invece del nulla. Colori
// scritti a mano, non presi dal tema dell'app: se l'errore ha già
// coinvolto lo stato dei colori (poco probabile ma non impossibile),
// il paracadute deve restare leggibile comunque. Richiesto da Erny il
// 12 settembre, come primo passo verso un collaudo più ampio.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  render() {
    if (this.state.error) {
      const message = this.state.error && this.state.error.message ? this.state.error.message : String(this.state.error);
      return (
        <div
          style={{
            minHeight: "100vh",
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            padding: 24,
            background: "#12100D",
            color: "#F2EEE7",
            fontFamily: "-apple-system, BlinkMacSystemFont, sans-serif",
            textAlign: "center",
          }}
        >
          <div style={{ fontSize: 40, marginBottom: 12 }}>⚠️</div>
          <h1 style={{ fontSize: 18, fontWeight: 600, marginBottom: 8 }}>Qualcosa è andato storto</h1>
          <p style={{ fontSize: 14, color: "#948C7F", marginBottom: 20, maxWidth: 320, lineHeight: 1.5 }}>
            I tuoi abbonamenti sono al sicuro — sono salvati sul telefono, non in questa schermata. Prova a ricaricare; se il problema continua, manda uno screenshot di questa pagina.
          </p>
          <button
            onClick={() => window.location.reload()}
            style={{ background: "#E3A857", color: "#12100D", border: "none", borderRadius: 12, padding: "12px 24px", fontSize: 14, fontWeight: 600, marginBottom: 16, cursor: "pointer" }}
          >
            Ricarica l'app
          </button>
          <details style={{ fontSize: 11, color: "#635B4F", maxWidth: 320, wordBreak: "break-word" }}>
            <summary style={{ cursor: "pointer" }}>Dettagli tecnici</summary>
            <pre style={{ whiteSpace: "pre-wrap", textAlign: "left", marginTop: 8 }}>{message}</pre>
          </details>
        </div>
      );
    }
    return this.props.children;
  }
}

          if (perEur) toEur[code] = 1 / perEur;
        });
        setRates(toEur);
        setRatesDate(data.date || null);
        await window.storage.set(
          "abbly:rates",
          JSON.stringify({ rates: toEur, date: data.date, fetchedAt: Date.now() }),
          false
        );
      } catch {
        // offline or blocked: the built-in reference rates stay in use
      } finally {
        if (!cancelled) setRatesSettled(true);
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  // Il listino delle offerte, preso dalla rete a ogni avvio e conservato per
  // l'uso offline. Se il file non c'è ancora — o non lo si vuole pubblicare —
  // la scheda continua a funzionare con le sole cose che sa dai tuoi dati.
  const [offersFile, setOffersFile] = useState(null);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const cachedRaw = await window.storage.get("abbly:offers", false);
        if (cachedRaw && !cancelled) {
          const cached = JSON.parse(cachedRaw.value);
          // La copia locale serve solo a far comparire subito qualcosa e a
          // reggere l'uso offline. Non ferma la lettura dal server: una
          // finestra di freschezza qui significava che una correzione al
          // listino non arrivava per mezza giornata, e che il file vecchio e
          // quello nuovo erano indistinguibili a schermo. Stessa trappola dei
          // tassi, terzo travestimento.
          if (cached && cached.file) setOffersFile(cached.file);
        }
      } catch {
        // nessuna copia ancora
      }

      try {
        const res = await fetch(OFFERS_URL, { cache: "no-store" });
        if (!res.ok) return;
        const file = await res.json();
        if (!file || !Array.isArray(file.piani) || cancelled) return;
        setOffersFile(file);
        await window.storage.set("abbly:offers", JSON.stringify({ file, fetchedAt: Date.now() }), false);
      } catch {
        // offline, oppure il file non è pubblicato: si tiene quello che c'è
      }
    })();

    return () => {
      cancelled = true;
    };
  }, []);

  // I piani noti per il servizio scelto nel modulo di inserimento, se ce ne
  // sono più di uno — altrimenti non c'è scelta da offrire. Stessa fonte
  // delle offerte (`offerte.json`, aggiornabile senza rilascio), stesso modo
  // di far corrispondere il nome anche se scritto a mano invece che scelto
  // dall'elenco (`normaliseServiceName`, la stessa usata per le offerte).
  const servicePlans = useMemo(() => {
    if (!offersFile || !Array.isArray(offersFile.piani)) return null;
    const typedName = form.name === "__custom__" ? form.customName : form.name;
    if (!typedName) return null;
    const key = normaliseServiceName(typedName);
    const entry = offersFile.piani.find((p) => p.servizio && normaliseServiceName(p.servizio) === key);
    return entry && Array.isArray(entry.opzioni) && entry.opzioni.length > 1 ? entry.opzioni : null;
  }, [offersFile, form.name, form.customName]);

  // "Abbonamento già terminato" non è più un interruttore da toccare a
  // parte: si deduce da sé se la data di fine scritta è già passata. Un
  // dato che si può dedurre non merita un secondo posto dove ripeterlo —
  // richiesto da Erny il 10 settembre.
  const isPastDerived = form.hasEndDate && !!form.endDate && form.endDate < todayISO;

  const settingsRef = useRef(settings);
  useEffect(() => {
    settingsRef.current = settings;
  }, [settings]);

  // Colours are written straight from the current settings rather than through
  // the deferred ref, so two quick taps can't overwrite each other and the
  // change shows the instant it is saved. A null value clears the override.
  async function applyCategoryColor(changes) {
    const next = { ...(settings.categoryColors || {}) };
    Object.entries(changes).forEach(([id, hex]) => {
      if (hex) next[id] = hex;
      else delete next[id];
    });
    await persistSettings({ ...settings, categoryColors: next });
  }

  // The tour follows the app instead of driving it: the steps that ask for a
  // real action wait for that action to happen, so what the user is told and
  // what is on screen can never disagree.
  const tourActive = tourStep >= 0;
  // Il limite gratuito può bloccare esattamente il passo "aggiungi", se la
  // guida viene rifatta da chi ha già toccato il tetto: senza questo, la
  // maschera della guida resta sopra all'avviso e lo nasconde, mentre la
  // guida aspetta per sempre un modulo che non si aprirà mai — un vicolo
  // cieco vero, non solo un fastidio estetico. Stessa cosa per l'avviso di
  // doppione (`duplicateConfirm`): se durante la guida si prova a salvare
  // un abbonamento con lo stesso nome di uno già presente, il salvataggio
  // si ferma e compare l'avviso — ma restava sotto alla maschera della
  // guida, invisibile e non toccabile, mentre la guida aspettava per sempre
  // un salvataggio che non sarebbe mai arrivato. Segnalato da Erny il 12
  // settembre.
  const tourVisible = tourActive && !pickerOpen && !optionPicker && !showPaywall && !duplicateConfirm;

  // A step is allowed to hold the tour until something is actually filled in.
  // Without it the cost step could be walked past empty and the saving step
  // would then wait forever for a save the form kept refusing — a dead end
  // whose only exit was abandoning the tour. Same test the form itself uses.
  const tourBlocked =
    tourActive &&
    TOUR_STEPS[tourStep].requires === "cost" &&
    (!form.cost || !(parseAmount(form.cost) > 0));

  function endTour() {
    setTourStep(-1);
    if (!settings.tourSeen) persistSettings({ ...settings, tourSeen: true });
  }

  function startTour() {
    if (view !== "list") switchView("list");
    setShowSettings(false);
    setTourStep(0);
  }

  // Starts on an empty app that has never been shown the tour. Someone who
  // already has subscriptions is simply left alone rather than marked as done:
  // marking them spent the one chance, so emptying the app later never brought
  // the tour back. The flag is now set only by actually seeing it through.
  useEffect(() => {
    if (!subs || settings.tourSeen || tourStep >= 0) return;
    if (subs.length > 0) return;
    setTourStep(0);
  }, [subs, settings.tourSeen]);

  useEffect(() => {
    if (tourStep < 0) return;
    if (TOUR_STEPS[tourStep].waitFor === "form" && showForm) setTourStep(tourStep + 1);
  }, [showForm, tourStep]);

  // Stesso caso limite del punto sopra: se il tetto gratuito impedisce di
  // aprire il modulo, il passo "aggiungi" non si sbloccherebbe mai da solo.
  // Meglio chiudere la guida — l'avviso resta comunque visibile e spiega da
  // sé la situazione — che lasciarla a puntare per sempre lo stesso pulsante.
  useEffect(() => {
    if (tourStep < 0 || !showPaywall) return;
    endTour();
  }, [showPaywall, tourStep]);

  useEffect(() => {
    if (tourStep < 0) return;
    if (TOUR_STEPS[tourStep].waitFor === "service" && !pickerOpen && form.name) setTourStep(tourStep + 1);
  }, [pickerOpen, form.name, tourStep]);

  // Backing out of the form drops the tour back to the step that opens it,
  // rather than leaving it pointing at fields that are no longer on screen.
  // Saving also closes the form, hence the check on what was actually saved.
  useEffect(() => {
    if (tourStep < 0 || showForm || !subs || subs.length > 0) return;
    if (String(TOUR_STEPS[tourStep].target || "").startsWith("form")) setTourStep(TOUR_FIRST_FORM_STEP);
  }, [showForm, subs, tourStep]);

  // Saved at last: the ring finally has something in it, which is why that is
  // the closing step and not the opening one.
  useEffect(() => {
    if (tourStep < 0 || !subs) return;
    // Saved is not enough on its own: the subscription lands in memory a beat
    // before the sheet closes, and starting the closing step in that gap put
    // an explanation of the ring on top of the form that was still covering it.
    if (TOUR_STEPS[tourStep].waitFor === "saved" && subs.length > 0 && !showForm) setTourStep(tourStep + 1);
  }, [subs, showForm, tourStep]);

  async function persistSettings(next) {
    setSettings(next);
    try {
      await window.storage.set("abbly:settings", JSON.stringify(next), false);
    } catch {
      // best effort
    }
  }

  function openAdd() {
    // Il limite conta TUTTI gli abbonamenti non cestinati — attivi, in pausa
    // o terminati — non solo quelli attivi. Contare solo `activeSubs`
    // permetteva di aggirare il limite mettendo in pausa un abbonamento per
    // liberare un posto, aggiungerne un altro, poi riprendere quello messo
    // in pausa: bastava ripetere per superare il limite senza fine.
    // Niente interruttore Premium da controllare qui: la distinzione fra
    // gratis e a pagamento è pensata per vivere fuori da questo file — due
    // app diverse sul Play Store, non un valore modificabile nei dati
    // dell'app stessa. Hubbo Plus, quando esisterà, sarà semplicemente una
    // build con FREE_LIMIT più alto o assente, non questa stessa app con un
    // interruttore acceso. Vedi §4 del documento di stato.
    if (subs.length >= FREE_LIMIT) {
      setShowPaywall(true);
      return;
    }
    setEditingId(null);
    // startDate parte uguale a renewalDate, non vuota: un abbonamento non
    // può esistere senza data di inizio — richiesto da Erny l'11
    // settembre. Resta comunque modificabile a mano.
    setForm({ ...emptyForm, currency: settings.currency, renewalDate: todayISO, startDate: todayISO });
    setFormError("");
    setDateAutoFixNote(null);
    setPickerOpen(false);
    setServiceSearch("");
    setShowForm(true);
  }

  function openEdit(sub) {
    setEditingId(sub.id);
    const isCommon = COMMON_SERVICES.some((s) => s.name === sub.name);
    setForm({
      name: isCommon ? sub.name : "__custom__",
      customName: isCommon ? "" : sub.name,
      // "Costo" è sempre il prezzo pieno — sub.cost, o sub.sharedTotalCost
      // se condiviso — non più diverso a seconda che l'offerta sia ancora
      // attiva o già finita. Corretto il 12 settembre insieme al resto
      // del modulo dell'offerta: vedi commitSubscription più sotto per la
      // spiegazione completa del problema che questo risolve.
      cost: String(sub.sharedTotalCost != null ? sub.sharedTotalCost : sub.cost),
      hasPromo: !!sub.promoUntil,
      // Sempre lo sconto (sub.promoCost), scalato per persona se
      // condiviso — mai più "il prezzo pieno futuro": quel significato
      // non esiste più, "Costo" sopra è sempre il prezzo pieno, qui c'è
      // sempre e solo lo sconto.
      promoDiscount: sub.promoUntil ? String(sub.sharedTotalCost != null ? sub.promoCost * (sub.sharedPeople || 1) : sub.promoCost) : "",
      promoUntil: sub.promoUntil || "",
      currency: sub.currency || settings.currency,
      frequency: sub.frequency,
      category: sub.category,
      renewalDate: sub.renewalDate,
      hasStartDate: !!sub.startDate,
      startDate: sub.startDate || "",
      hasEndDate: !!sub.endDate,
      endDate: sub.endDate || "",
      isShared: sub.sharedTotalCost != null,
      peopleCount: sub.sharedPeople ? String(sub.sharedPeople) : "2",
      note: sub.note || "",
    });
    setFormError("");
    setDateAutoFixNote(null);
    setPickerOpen(false);
    setServiceSearch("");
    setShowForm(true);
  }

  // La parte di handleAdd che scrive davvero l'abbonamento, isolata perché va
  // richiamata da due punti: subito, quando tutto è a posto, oppure dopo che
  // l'utente ha risposto all'avviso di doppione — con lo stesso nome digitato
  // o con quello suggerito ("Netflix 2"). Legge il resto dei campi dal form
  // così com'è, perché il doppione è l'unica cosa che può cambiare fra i due
  // percorsi.
  async function commitSubscription(finalName) {
    const people = form.isShared ? parseInt(form.peopleCount, 10) : null;
    const rawCost = parseAmount(form.cost);
    const effectiveCost = form.isShared ? Math.round((rawCost / people) * 100) / 100 : rawCost;
    const prevSub = editingId ? subs.find((s) => s.id === editingId) : null;

    // "Costo" è sempre il prezzo pieno, qui e ovunque nel modulo — non più
    // "quello che pago adesso" quando l'offerta è ancora attiva e "quello
    // che pagherò dopo" quando è già finita, come prima del 12 settembre.
    // Quel doppio significato, mai segnalato a schermo, era la causa vera
    // del problema di Erny: aggiungendo un abbonamento con un'offerta già
    // terminata, scrivere il prezzo pagato con l'offerta nel campo
    // "Costo" (la cosa naturale da fare, essendo il primo campo del
    // modulo) veniva letto come "questo è il prezzo pieno attuale" — sia
    // i rinnovi passati sia quelli futuri finivano salvati al prezzo
    // dell'offerta, mai a quello pieno. Ora "Costo" non cambia mai
    // significato: promoDiscount (sotto, dentro il pannello dell'offerta)
    // è sempre e solo lo sconto, calcolato per persona se condiviso.
    // costOn() già sapeva risolvere correttamente quale dei due prezzi
    // vale per una data qualunque, passata o futura — bastava smettere di
    // scambiarli qui.
    const rawPromoDiscount = form.hasPromo ? parseAmount(form.promoDiscount) : null;
    const effectivePromoDiscount = form.hasPromo
      ? form.isShared
        ? Math.round((rawPromoDiscount / people) * 100) / 100
        : rawPromoDiscount
      : null;

    // What it costs today, before and after the edit. Comparing the stored
    // prices instead would call it a rise every time someone declares an
    // introductory offer on a subscription they had entered at the discounted
    // price — which is the ordinary way of arriving at this screen.
    const promoNow = { cost: effectiveCost, promoCost: effectivePromoDiscount, promoUntil: form.hasPromo ? form.promoUntil : null };
    const paidBefore = prevSub ? costOn(prevSub, todayISO) : null;
    const paidAfter = costOn(promoNow, todayISO);

    let lastIncrease = prevSub ? prevSub.lastIncrease || null : null;
    if (prevSub && paidAfter !== paidBefore) {
      lastIncrease = paidAfter > paidBefore ? { from: paidBefore, to: paidAfter, date: todayISO } : null;
    }

    // Every price the subscription has ever had, oldest first. Subscriptions
    // created before this existed get seeded with their current price so the
    // series always has a starting point to measure against.
    const priceHistory = (() => {
      if (!prevSub) {
        return [{ cost: paidAfter, currency: form.currency || settings.currency, date: form.startDate || todayISO }];
      }
      const base = Array.isArray(prevSub.priceHistory) && prevSub.priceHistory.length > 0
        ? prevSub.priceHistory
        : [{ cost: prevSub.cost, currency: prevSub.currency || settings.currency, date: prevSub.startDate || todayISO }];
      // Same test as the badge above: no new point in the history either,
      // when what is actually paid today has not moved.
      if (paidAfter === paidBefore) return base;
      // A second change on the same day replaces the first rather than
      // stacking two entries with an identical date.
      const trimmed = base.length > 1 && base[base.length - 1].date === todayISO ? base.slice(0, -1) : base;
      return [...trimmed, { cost: paidAfter, currency: form.currency || settings.currency, date: todayISO }];
    })();

    // Stesso principio della ripresa da pausa: cambiare la data di rinnovo o
    // la cadenza di un abbonamento già attivo sposta la fase del ciclo da
    // oggi in poi, non nei mesi già passati. Senza registrare il cambiamento
    // come nuovo segmento, lo storico e il calendario di quei mesi
    // verrebbero ricalcolati sulla nuova fase — stesso bug, causa diversa
    // (vedi cycleSegments, pastOccurrences).
    const cycleChanged = !!prevSub && (prevSub.renewalDate !== form.renewalDate || prevSub.frequency !== form.frequency);
    const cycleHistory = !prevSub
      ? [{ from: null, renewalDate: form.renewalDate, frequency: form.frequency }]
      : (() => {
          const base =
            Array.isArray(prevSub.cycleHistory) && prevSub.cycleHistory.length > 0
              ? prevSub.cycleHistory
              : [{ from: null, renewalDate: prevSub.renewalDate, frequency: prevSub.frequency }];
          return cycleChanged ? [...base, { from: todayISO, renewalDate: form.renewalDate, frequency: form.frequency }] : base;
        })();
    const subData = {
      name: finalName,
      cost: effectiveCost,
      currency: form.currency || settings.currency,
      sharedTotalCost: form.isShared ? rawCost : null,
      promoCost: form.hasPromo ? effectivePromoDiscount : null,
      promoUntil: form.hasPromo ? form.promoUntil : null,
      sharedPeople: form.isShared ? people : null,
      frequency: form.frequency,
      category: form.category,
      renewalDate: form.renewalDate,
      startDate: form.startDate || null,
      endDate: form.hasEndDate ? form.endDate : null,
      note: form.note.trim() || null,
      lastIncrease,
      priceHistory,
      cycleHistory,
    };
    const next = editingId
      ? subs.map((s) => (s.id === editingId ? { ...s, ...subData } : s))
      : [...subs, { id: uid(), ...subData }];
    await persist(next);
    setSaving(false);
    setShowForm(false);
    setEditingId(null);
  }

  // La prima variante di un nome ancora libera fra gli abbonamenti tuttora
  // attivi: "Netflix 2", oppure "Netflix 3" se anche quella esiste già, e così
  // via. Serve solo a suggerire qualcosa di sensato nell'avviso di doppione —
  // l'utente resta comunque libero di tenere il nome originale.
  function nextAvailableName(base) {
    const taken = new Set(
      subs.filter((s) => !s.endDate || s.endDate >= todayISO).map((s) => s.name.trim().toLowerCase())
    );
    let n = 2;
    while (taken.has(`${base} ${n}`.trim().toLowerCase())) n++;
    return `${base} ${n}`;
  }

  async function handleAdd(e) {
    if (e && e.preventDefault) e.preventDefault();
    try {
      const finalName = form.name === "__custom__" ? form.customName.trim() : form.name;
      if (!finalName) {
        setFormError(t.errNoService);
        return;
      }
      if (!form.cost || !(parseAmount(form.cost) > 0)) {
        setFormError(t.errNoCost);
        return;
      }
      if (form.hasPromo && !form.promoUntil) {
        setFormError(t.errNoPromoUntil);
        return;
      }
      // Il prezzo dell'offerta serve sempre quando c'è un'offerta — non più
      // solo se ancora attiva: "Costo" è sempre il prezzo pieno, quindi lo
      // sconto va sempre chiesto qui, sia che l'offerta sia già finita sia
      // che sia ancora in corso. Corretto il 12 settembre.
      if (form.hasPromo && (!form.promoDiscount || !(parseAmount(form.promoDiscount) > 0))) {
        setFormError(t.errNoPromoDiscount);
        return;
      }
      // Un'offerta che costa quanto o più del prezzo pieno non è uno sconto:
      // il controllo era invertito prima del 12 settembre (chiedeva che il
      // prezzo pieno futuro fosse più alto del prezzo pagato ora) perché
      // "Costo" cambiava significato a seconda di quando finiva l'offerta —
      // ora "Costo" è sempre il prezzo pieno, quindi lo sconto deve sempre
      // essere più basso di lui, non il contrario.
      if (form.hasPromo && parseAmount(form.promoDiscount) >= parseAmount(form.cost)) {
        setFormError(t.errPromoNotLower);
        return;
      }
      if (!form.renewalDate) {
        setFormError(t.errNoRenewal);
        return;
      }
      if (form.hasEndDate && !form.endDate) {
        setFormError(t.errNoEndDate);
        return;
      }
      // A next renewal in the past only makes sense for a closed subscription.
      // On edit the check applies only if the date was actually touched, so an
      // old subscription whose stored anchor has long passed stays editable.
      // "Chiuso" non è più scelto con un interruttore a parte: si deduce da
      // qui, dalla stessa data di fine che l'utente ha già scritto — non
      // c'era bisogno di un secondo posto dove dirlo, richiesto da Erny il
      // 10 settembre.
      const isPastDerived = form.hasEndDate && form.endDate && form.endDate < todayISO;
      const previous = editingId ? subs.find((x) => x.id === editingId) : null;
      const renewalTouched = !previous || previous.renewalDate !== form.renewalDate;
      if (!isPastDerived && renewalTouched && form.renewalDate < todayISO) {
        setFormError(t.errRenewalPast);
        return;
      }
      if (form.startDate && form.startDate > todayISO) {
        setFormError(t.errStartFuture);
        return;
      }
      if (form.startDate && form.hasEndDate && form.endDate && form.startDate > form.endDate) {
        setFormError(t.errStartAfterEnd);
        return;
      }
      const people = form.isShared ? parseInt(form.peopleCount, 10) : null;
      if (form.isShared && (!people || people < 2)) {
        setFormError(t.errNoPeople);
        return;
      }

      // Vale sia per un abbonamento nuovo sia per una modifica che rinomina
      // un abbonamento esistente facendogli assumere il nome di un altro:
      // due abbonamenti attivi con lo stesso nome non sono solo confusi da
      // vedere, creano un vero buco nella Scheda Risparmio, che riconosce i
      // servizi dal nome — un'offerta o un consiglio su quel servizio si
      // agganceria solo al primo trovato, lasciando l'altro invisibile.
      // Per questo qui non si avvisa soltanto: si obbliga a un nome diverso.
      {
        const nameKey = finalName.trim().toLowerCase();
        const clash = subs.find(
          (s) => s.id !== editingId && s.name.trim().toLowerCase() === nameKey && (!s.endDate || s.endDate >= todayISO)
        );
        if (clash) {
          setFormError("");
          setDuplicateConfirm({ name: finalName, suggested: nextAvailableName(finalName) });
          return;
        }
      }

      setFormError("");
      setSaving(true);
      await commitSubscription(finalName);
    } catch (err) {
      setSaving(false);
      setFormError(t.errUnexpected + (err && err.message ? err.message : String(err)));
    }
  }

  // Richiamata dai due bottoni dell'avviso di doppione: `nameToUse` è il nome
  // originale se si è scelto di tenerlo comunque, o quello suggerito se si è
  // accettato il rinominato.
  async function confirmDuplicateAdd(nameToUse) {
    if (!duplicateConfirm) return;
    setDuplicateConfirm(null);
    try {
      setSaving(true);
      await commitSubscription(nameToUse);
    } catch (err) {
      setSaving(false);
      setFormError(t.errUnexpected + (err && err.message ? err.message : String(err)));
    }
  }

  async function handleDelete(id) {
    const sub = subs.find((s) => s.id === id);
    if (!sub) return;
    await persist(subs.filter((s) => s.id !== id));
    await persistTrash([{ ...sub, deletedAt: todayISO }, ...trash]);
    setConfirmDelete(null);
  }

  async function handleExport() {
    const payload = {
      app: "hubbo",
      version: 1,
      // La versione del formato del file (sopra) e quella dell'app che l'ha
      // scritto sono due cose diverse: la prima descrive la forma dei dati,
      // la seconda serve solo a capire, guardando un vecchio backup, con
      // quale versione di Hubbo è stato creato.
      appVersion: APP_VERSION,
      exportedAt: new Date().toISOString(),
      settings,
      subscriptions: subs,
      trash,
      payments,
    };
    const json = JSON.stringify(payload, null, 2);
    const filename = `hubbo-backup-${todayISO}.json`;

    // Prefer the system "save as" dialog so the user picks the destination;
    // fall back to a plain download where the API is unavailable.
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(json);
        await writable.close();
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
        // otherwise fall through to the download path
      }
    }

    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Esporta esattamente quello che lo Storico sta mostrando in quel momento
  // (`filteredPayments` rispetta già periodo/servizio/categoria), non tutti i
  // pagamenti mai registrati: se l'utente ha filtrato per un anno o un
  // servizio, si aspetta di scaricare quello, non tutto lo storico.
  async function handleExportCSV() {
    // Virgola come separatore, punto come decimale: è il CSV più universale,
    // Excel/Numbers/Sheets lo leggono bene a prescindere dalla lingua
    // dell'app. Le virgolette proteggono nomi di servizio con virgole o
    // virgolette al loro interno.
    const escape = (v) => {
      const str = String(v ?? "");
      return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
    };
    const header = [t.csvColDate, t.csvColService, t.csvColCategory, t.csvColAmount, t.csvColCurrency, t.csvColStatus];
    const rows = filteredPayments
      .slice()
      .sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))
      .map((p) => {
        const cat = CATEGORIES.find((c) => c.id === p.category) || CATEGORIES[CATEGORIES.length - 1];
        return [
          p.date,
          p.name,
          cat.label,
          p.amount,
          p.currency,
          p.status === "skipped" ? t.csvStatusSkipped : t.csvStatusPaid,
        ]
          .map(escape)
          .join(",");
      });
    // BOM iniziale: senza, Excel apre l'UTF-8 come Latin-1 e mostra le
    // lettere accentate rotte — lo stesso problema pagato una volta con le
    // favicon, qui sulla codifica invece che sulle dimensioni.
    const csv = "\uFEFF" + [header.map(escape).join(","), ...rows].join("\r\n");
    const filename = `hubbo-storico-${todayISO}.csv`;

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "CSV", accept: { "text/csv": [".csv"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(csv);
        await writable.close();
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Un file di backup che sembra a posto in superficie ("app": "hubbo", un
  // array chiamato giusto) può comunque contenere righe senza le informazioni
  // che l'app dà per scontate altrove: un `frequency` che FREQUENCIES non
  // conosce manderebbe in NaN ogni calcolo di rinnovo per quella riga. Si
  // controlla qui, una volta sola, invece che lasciare che l'errore emerga più
  // tardi come un abbonamento che non torna.
  function validateBackupFile(data) {
    if (!data || typeof data !== "object" || data.app !== "hubbo") return { ok: false, reason: "format" };
    if (!Array.isArray(data.subscriptions)) return { ok: false, reason: "format" };

    const knownFrequencies = new Set(FREQUENCIES.map((f) => f.id));
    const isoDate = /^\d{4}-\d{2}-\d{2}$/;
    const subsOk = data.subscriptions.every(
      (s) =>
        s &&
        typeof s === "object" &&
        s.id != null &&
        typeof s.name === "string" &&
        s.name.trim() !== "" &&
        Number.isFinite(Number(s.cost)) &&
        Number(s.cost) >= 0 &&
        knownFrequencies.has(s.frequency) &&
        typeof s.renewalDate === "string" &&
        isoDate.test(s.renewalDate)
    );
    if (!subsOk) return { ok: false, reason: "subscriptions" };

    if (data.payments != null) {
      if (!Array.isArray(data.payments)) return { ok: false, reason: "payments" };
      const paymentsOk = data.payments.every(
        (p) => p && typeof p === "object" && p.id != null && p.subId != null && Number.isFinite(Number(p.amount)) && typeof p.date === "string" && isoDate.test(p.date)
      );
      if (!paymentsOk) return { ok: false, reason: "payments" };
    }

    if (data.trash != null) {
      if (!Array.isArray(data.trash)) return { ok: false, reason: "trash" };
      const trashOk = data.trash.every((s) => s && typeof s === "object" && s.id != null && typeof s.name === "string");
      if (!trashOk) return { ok: false, reason: "trash" };
    }

    if (data.settings != null && (typeof data.settings !== "object" || Array.isArray(data.settings))) {
      return { ok: false, reason: "settings" };
    }

    return { ok: true };
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const check = validateBackupFile(data);
        if (!check.ok) {
          setImportMessage(t.importErrorReason(check.reason));
          return;
        }
        setPendingImport(data);
        // Il valore di partenza segue quello che il file porta davvero: senza
        // impostazioni non c'è niente da proporre di includere.
        setImportIncludeSettings(!!data.settings);
        // Il backup sostituisce, non si somma: niente più "quanti posti
        // liberi restano rispetto a quello che ho già", perché quello che ho
        // già sta per essere sostituito. Il tetto è quindi il limite pieno
        // di questa build, sempre lo stesso: non c'è più un interruttore
        // Premium da controllare, perché la distinzione sta in quale app hai
        // scaricato, non in un dato dentro questa. Serve una scelta solo se
        // il file stesso, da solo, supera il limite: il caso tipico è un
        // backup esportato da Hubbo Plus (senza limite) importato in Hubbo.
        const tutti = data.subscriptions;
        const posti = FREE_LIMIT;
        if (tutti.length > posti) {
          // Preselezionati i primi che entrano nel limite, nell'ordine in
          // cui compaiono nel file: una scelta di partenza sensata che
          // l'utente può comunque cambiare prima di confermare.
          setImportSelection(new Set(tutti.slice(0, Math.max(0, posti)).map((s) => s.id)));
        } else {
          setImportSelection(null);
        }
        setImportMessage("");
      } catch {
        setImportMessage(t.importError);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  async function confirmImport() {
    if (!pendingImport) return;
    // Con la selezione attiva si tiene solo ciò che l'utente ha scelto;
    // senza, si importa tutto il file. In entrambi i casi il risultato
    // SOSTITUISCE gli abbonamenti attuali, non si somma: `persist` riceve
    // l'elenco intero, non `[...subs, ...nuovi]` come nel vecchio modello
    // additivo. Chi vuole conservare quello che ha, deve esportarlo prima —
    // l'avviso nel foglio lo dice chiaramente.
    const toImport = importSelection ? pendingImport.subscriptions.filter((s) => importSelection.has(s.id)) : pendingImport.subscriptions;
    await persist(toImport);

    // Stessa logica per i pagamenti: sostituiscono, non si sommano. Un
    // pagamento il cui abbonamento non è stato importato (perché escluso
    // dalla selezione) resterebbe orfano — visibile nello Storico per un
    // servizio che nell'Elenco non esiste — quindi si accettano solo i
    // pagamenti degli abbonamenti che sono davvero entrati in `toImport`.
    const acceptedSubIds = new Set(toImport.map((s) => s.id));
    const importedPayments = Array.isArray(pendingImport.payments)
      ? pendingImport.payments.filter((p) => p && p.id && acceptedSubIds.has(p.subId))
      : [];
    await persistPayments(importedPayments);

    // Il cestino non partecipa al limite (non è fra gli abbonamenti attivi),
    // quindi non ha bisogno di seguire la selezione: si sostituisce e basta,
    // per intero, se il file lo porta. Un file senza la chiave `trash`
    // (formato più vecchio) lascia il cestino attuale intatto invece di
    // svuotarlo per un'assenza che potrebbe non voler dire nulla.
    if (Array.isArray(pendingImport.trash)) {
      await persistTrash(pendingImport.trash);
    }

    // Le impostazioni restano un'eccezione dichiarata: si sostituiscono solo
    // se l'utente lo sceglie esplicitamente, perché lingua, valuta e tema
    // sono preferenze di questo dispositivo tanto quanto dati dell'utente,
    // e forzarle sempre sarebbe una sorpresa sgradita su un telefono nuovo.
    // Niente più campo isPremium da escludere qui: quel diritto non vive nei
    // dati dell'app, quindi un file importato non ha più nulla del genere da
    // poter falsificare.
    if (importIncludeSettings && pendingImport.settings && typeof pendingImport.settings === "object") {
      const nextSettings = { ...defaultSettings, ...settings, ...pendingImport.settings };
      setSettings(nextSettings);
      try {
        await window.storage.set("abbly:settings", JSON.stringify(nextSettings), false);
      } catch {}
    }
    setImportMessage(t.importDone(toImport.length));
    setPendingImport(null);
    setImportSelection(null);
  }

  async function handleRestore(id) {
    // Stesso limite dell'aggiunta, per lo stesso motivo: ripristinare
    // dal cestino è, a tutti gli effetti, aggiungere un abbonamento in più.
    // Senza questo controllo, cestinare e ripristinare a raffica avrebbe
    // aggirato il limite tanto quanto la pausa.
    if (subs.length >= FREE_LIMIT) {
      setShowPaywall(true);
      return;
    }
    const sub = trash.find((s) => s.id === id);
    if (!sub) return;
    const { deletedAt, ...restored } = sub;
    await persistTrash(trash.filter((s) => s.id !== id));
    await persist([...subs, restored]);
  }

  async function handlePurge(id) {
    // "Per sempre" vale anche per i pagamenti: lasciarli in giro, orfani di
    // un abbonamento che non esiste più nemmeno nel cestino, li renderebbe
    // invisibili ovunque nell'app ma non davvero cancellati — l'opposto di
    // quello che promette il pulsante.
    await persistPayments(payments.filter((p) => p.subId !== id));
    await persistTrash(trash.filter((s) => s.id !== id));
    setConfirmPurge(null);
  }

  async function handlePurgeAll() {
    const ids = new Set(trash.map((s) => s.id));
    await persistPayments(payments.filter((p) => !ids.has(p.subId)));
    await persistTrash([]);
    setConfirmPurge(null);
  }

  // Pausing now leaves a dated trace instead of a bare on/off flag, so the
  // history can tell a genuinely unpaid month from a paid one. Only pauses made
  // from this version onwards are known; anything earlier reads as active.
  //
  // Da qui in giù il bottone si chiama "Termina" e "Riattiva", ma sotto
  // resta lo stesso identico meccanismo di sempre (`paused`,
  // `pausePeriods`): Erny ha deciso il 10 settembre che un abbonamento
  // terminato con una data e uno messo in pausa sono la stessa cosa — non
  // deve più esserci differenza, e qualunque terminato deve poter tornare
  // attivo, non solo quelli fermati con la pausa. Per questo il controllo
  // qui sotto guarda `target.paused || target.isEnded`, non solo il primo:
  // un abbonamento con una vera data di fine, riaperto, prende la stessa
  // strada — stessa domanda della data, stessa scrittura di cycleHistory —
  // di uno che era stato messo in pausa.
  async function handleTogglePause(id) {
    // enriched, non subs: serve isEnded già calcolato, che sui dati grezzi
    // non esiste.
    const target = enriched.find((s) => s.id === id);
    if (!target) return;
    const isTerminated = target.paused || target.isEnded;

    // Stesso limite di aggiunta e ripristino, per lo stesso motivo di
    // sempre: terminare non svuota uno dei dieci posti, quindi riattivare
    // non deve poterne aprire uno in più di quanti il piano gratuito ne
    // preveda.
    if (isTerminated && subs.length >= FREE_LIMIT) {
      setShowPaywall(true);
      return;
    }

    if (isTerminated) {
      setResumePrompt({
        id,
        name: target.name,
        date: toLocalISO(addPeriods(parseLocalDate(todayISO), target.frequency, 1)),
      });
      return;
    }

    await persist(
      subs.map((s) => {
        if (s.id !== id) return s;
        const periods = Array.isArray(s.pausePeriods) ? s.pausePeriods.slice() : [];
        periods.push({ from: todayISO, to: null });
        return { ...s, paused: true, pausePeriods: periods };
      })
    );
  }

  async function handleResume() {
    if (!resumePrompt || !resumePrompt.date) return;
    const id = resumePrompt.id;
    const date = resumePrompt.date;
    await persist(
      subs.map((s) => {
        if (s.id !== id) return s;
        const periods = Array.isArray(s.pausePeriods) ? s.pausePeriods.slice() : [];
        // Si chiude l'ultima pausa rimasta aperta, non tutte: le precedenti
        // hanno già la loro data di fine e riscriverle cancellerebbe lo storico.
        for (let i = periods.length - 1; i >= 0; i--) {
          if (!periods[i].to) {
            periods[i] = { ...periods[i], to: todayISO };
            break;
          }
        }
        // La ripresa dà all'abbonamento una nuova ancora da oggi in poi: i
        // mesi precedenti devono continuare a leggersi con l'ancora che era
        // davvero in vigore allora, quindi il cambiamento si registra come un
        // nuovo segmento invece di sovrascrivere l'unico che c'era (vedi
        // cycleSegments, pastOccurrences). Se per caso la nuova data coincide
        // con quella vecchia non c'è davvero nulla di nuovo da segmentare.
        const baseHistory =
          Array.isArray(s.cycleHistory) && s.cycleHistory.length > 0
            ? s.cycleHistory
            : [{ from: null, renewalDate: s.renewalDate, frequency: s.frequency }];
        const cycleHistory =
          date !== s.renewalDate ? [...baseHistory, { from: todayISO, renewalDate: date, frequency: s.frequency }] : baseHistory;
        // endDate azzerata sempre, non solo per chi arrivava dalla pausa:
        // un abbonamento riattivato che aveva una vera data di fine non è
        // più "finito lì", quella data non descrive più nulla di vero.
        return { ...s, paused: false, endDate: null, renewalDate: date, pausePeriods: periods, cycleHistory };
      })
    );
    setResumePrompt(null);
  }

  const enriched = useMemo(() => {
    if (!subs) return [];
    return subs.map((s) => ({ ...s, ...nextRenewalInfo(s, todayISO) }));
  }, [subs, todayISO]);

  const activeSubs = useMemo(() => enriched.filter((s) => !s.isEnded && !s.paused), [enriched]);

  // A tapped notification reaches the app two different ways: as a message,
  // when a window was already open and the worker could talk to it, or as an
  // address, when the tap started the app from cold and there was nobody to
  // talk to. Both end up in the same place.
  const [pendingSubId, setPendingSubId] = useState(null);
  const [pendingCancelId, setPendingCancelId] = useState(null);
  // What the last tapped notification actually delivered, shown in Settings.
  // Guessing at this from the outside cost two versions.
  const [lastNotification, setLastNotification] = useState(null);
  const [cancelPrompt, setCancelPrompt] = useState(null);
  const [resumePrompt, setResumePrompt] = useState(null);
  // The notification log is for chasing faults, not for the people using the
  // app. It stays behind a long press on the version line, where whoever needs
  // it can find it and nobody else trips over it.
  const [showDiagnostics, setShowDiagnostics] = useState(false);
  const diagnosticsTimer = useRef(null);

  const holdVersion = () => {
    clearTimeout(diagnosticsTimer.current);
    diagnosticsTimer.current = setTimeout(() => setShowDiagnostics((on) => !on), 700);
  };
  const releaseVersion = () => clearTimeout(diagnosticsTimer.current);

  // Kept on the device, because it used to vanish on any reload and made the
  // record of the previous tap disappear exactly when it was being looked for.
  function rememberNotification(entry) {
    setLastNotification(entry);
    try {
      window.storage.set("abbly:lastNotif", JSON.stringify(entry), false);
    } catch {
      // A diagnostic that fails to save is not worth an error.
    }
  }
  // How many action buttons this device is willing to show. If it is one, the
  // second button on a notification is silently dropped and whatever is left
  // gets pressed for both.
  const notifMaxActions =
    typeof Notification !== "undefined" && "maxActions" in Notification ? Notification.maxActions : -1;
  // "" while still asking, "none" once the worker has had its chances and said
  // nothing. The distinction matters: a worker too old to know the question is
  // exactly the worker worth warning about, and silence must not read as
  // agreement.
  const [workerVersion, setWorkerVersion] = useState("");
  const [workerWaiting, setWorkerWaiting] = useState(false);

  useEffect(() => {
    const clearAddress = () =>
      // Replacing rather than pushing: the back button in this app is fragile
      // enough without extra history entries.
      window.history.replaceState(null, "", window.location.pathname + window.location.search);

    const fromAddress = () => {
      const hash = window.location.hash;
      const notif = hash.match(/[#&]notif=([^&]*)/);
      const sub = hash.match(/[#&]sub=([^&]*)/);
      if (!notif && !sub) return;
      const action = notif ? decodeURIComponent(notif[1]) : "body";
      const id = sub ? decodeURIComponent(sub[1]) : "";
      clearAddress();
      handleNotification(action, id, null, "", false);
    };
    // One place decides what a notification means, whichever road it arrived by.
    const handleNotification = (action, id, cancelUrl, buttons, opened) => {
      rememberNotification({ action, id: id || "", buttons: buttons || "" });
      if (action === "cancel") {
        // Nothing is opened from here. A page reached by a message has no tap
        // behind it, so any window it asks for is discarded without a word —
        // which looked exactly like the button doing nothing.
        if (!opened) setPendingCancelId(id || "");
        return;
      }
      if (id) setPendingSubId(id);
    };

    const onMessage = (event) => {
      const message = event.data;
      if (!message || !message.type) return;
      if (message.type === "hubbo-notification") {
        handleNotification(message.action || "body", message.id, message.cancelUrl, message.buttons, message.opened);
      }
      if (message.type === "hubbo-sw-version") setWorkerVersion(message.version || "");
    };
    fromAddress();
    window.addEventListener("hashchange", fromAddress);
    if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", onMessage);
    return () => {
      window.removeEventListener("hashchange", fromAddress);
      if ("serviceWorker" in navigator) navigator.serviceWorker.removeEventListener("message", onMessage);
    };
  }, []);

  // Re-read on every return to the app, because the interesting taps are the
  // ones that happened while the app was not running.
  useEffect(() => {
    let gone = false;
    const read = async () => {
      try {
        const hit = await caches.match("./__hubbo_log");
        if (hit && !gone) {
          setLastNotification(await hit.json());
          return;
        }
      } catch {
        // Falls through to whatever the app itself managed to record.
      }
      // No fallback to what the app itself once recorded. That record had no
      // time on it and never refreshed, so it sat there looking like the
      // outcome of the last tap when it was the outcome of a much older one.
      if (!gone) setLastNotification(null);
    };
    read();
    const onVisible = () => {
      if (document.visibilityState === "visible") read();
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      gone = true;
      document.removeEventListener("visibilitychange", onVisible);
    };
  }, []);

  // The controller can still be null in the first instants after a load, so the
  // question is asked more than once before giving up on an answer.
  useEffect(() => {
    if (!("serviceWorker" in navigator)) {
      setWorkerVersion("none");
      return;
    }
    let tries = 0;
    const ask = () => {
      const controller = navigator.serviceWorker.controller;
      if (controller) controller.postMessage("version");
      tries += 1;
      if (tries >= 4) {
        clearInterval(timer);
        setWorkerVersion((current) => current || "none");
      }
    };
    ask();
    const timer = setInterval(ask, 700);

    // A worker that has installed but never taken over is its own kind of
    // stuck, and it does not show up as a version mismatch.
    navigator.serviceWorker
      .getRegistration()
      .then((reg) => setWorkerWaiting(!!(reg && reg.waiting)))
      .catch(() => {});

    return () => clearInterval(timer);
  }, []);

  async function forceWorkerUpdate() {
    // Unregisters the worker and empties its caches, then reloads: the page
    // registers a fresh one on the way back up. Subscriptions, payments and
    // settings live in the device storage and are not touched by any of this.
    try {
      if ("serviceWorker" in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map((reg) => reg.unregister()));
      }
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map((key) => caches.delete(key)));
      }
    } catch {
      // Nothing useful to do about it; the reload is still worth attempting.
    }
    window.location.reload();
  }

  // Held until the subscriptions have loaded: a cold start has nothing to open
  // yet, and dropping the request there would lose the tap.
  useEffect(() => {
    if (!pendingSubId || !subs) return;
    const target = enriched.find((x) => x.id === pendingSubId);
    setPendingSubId(null);
    if (target) setDetailSub(target);
  }, [pendingSubId, subs, enriched]);

  // The fallback that arrives by address carries only the id, so the address
  // to open has to be rebuilt here once the subscription is known.
  useEffect(() => {
    if (!pendingCancelId || !subs) return;
    const target = enriched.find((x) => x.id === pendingCancelId);
    setPendingCancelId(null);
    if (target) setCancelPrompt({ name: target.name, url: cancelSearchUrl(target.name, settings.language) });
  }, [pendingCancelId, subs, enriched, settings.language]);

  const anyModalOpen =
    showForm || showSettings || showPaywall || showTrash || showColors || showMonthPicker ||
    !!confirmDelete || !!confirmPurge || !!pendingImport || !!detailSub || !!optionPicker || !!paymentAction || !!colorSwap || !!wipeHistoryPrompt || confirmDeleteAll;

  useEffect(() => {
    if (!anyModalOpen) return;
    // Freezing the page with `overflow: hidden` alone makes the browser forget
    // where the user was, so the scroll position is parked and restored by hand.
    const scrollY = window.scrollY || window.pageYOffset || 0;
    const body = document.body;
    const previous = {
      position: body.style.position,
      top: body.style.top,
      left: body.style.left,
      right: body.style.right,
      width: body.style.width,
      overflow: body.style.overflow,
    };

    body.style.position = "fixed";
    body.style.top = `-${scrollY}px`;
    body.style.left = "0";
    body.style.right = "0";
    body.style.width = "100%";
    body.style.overflow = "hidden";

    return () => {
      body.style.position = previous.position;
      body.style.top = previous.top;
      body.style.left = previous.left;
      body.style.right = previous.right;
      body.style.width = previous.width;
      body.style.overflow = previous.overflow;
      window.scrollTo(0, scrollY);
    };
  }, [anyModalOpen]);

  useEffect(() => {
    if (!settings.notifEnabled || typeof Notification === "undefined") return;

    let cancelled = false;

    async function fire() {
      try {
        let permission = Notification.permission;
        if (permission === "default") permission = await Notification.requestPermission();
        if (permission !== "granted" || cancelled) return;

        // Hold the reminders until the hour the user picked; before that, do nothing.
        const now = new Date();
        if (now.getHours() < settings.notifHour) return;

        activeSubs
          .filter((s) => s.daysLeft <= settings.notifDays && s.daysLeft >= 0)
          .forEach((s) => {
            const key = todayISO + ":" + s.id;
            if (notifiedToday.has(key)) return;
            notifiedToday.add(key);
            const when =
              s.daysLeft === 0 ? t.todayWord : s.daysLeft === 1 ? t.tomorrowWord : t.inDays(s.daysLeft);
            showNotification(t.appName, {
              body: t.notifBody(s.name, when),
              icon: "icons/icon-192.png",
              badge: "icons/icon-192.png",
              tag: "hubbo-" + s.id,
              // Everything the buttons need, since the worker that handles
              // them cannot read the app's data.
              data: { id: s.id, cancelUrl: cancelSearchUrl(s.name, settings.language) },
              // One button, deliberately. With two, which one had been pressed
              // was read from the name the phone reports, and that name proved
              // unreliable on a real device. With one there is nothing to read:
              // a button is a button, and an empty action is the body.
              actions: [{ action: "cancel", title: t.notifActionCancel }],
            });
          });
      } catch {
        // Notification API unavailable or blocked (e.g. inside a sandboxed preview)
      }
    }

    fire();
    // Re-check periodically so a session left open still fires at the chosen hour.
    const timer = setInterval(fire, 5 * 60 * 1000);
    return () => {
      cancelled = true;
      clearInterval(timer);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings.notifEnabled, settings.notifDays, settings.notifHour, activeSubs.length]);

  const usedCategories = useMemo(() => {
    const set = new Set(enriched.map((s) => s.category));
    return CATEGORIES.filter((c) => set.has(c.id));
  }, [enriched, settings.language, settings.categoryColors]);

  const visibleSubs = useMemo(() => {
    let list = enriched;
    if (filterCategories.length > 0) list = list.filter((s) => filterCategories.includes(s.category));
    // Un abbonamento in pausa è, dal 10 settembre, terminato a tutti gli
    // effetti nell'interfaccia: lo stesso bottone "Visualizza terminati"
    // che nasconde uno con data di fine nasconde anche uno in pausa.
    if (hideEnded) list = list.filter((s) => !s.isEnded && !s.paused);
    if (listSearch.trim()) {
      const q = listSearch.trim().toLowerCase();
      list = list.filter((s) => s.name.toLowerCase().includes(q));
    }
    return [...list].sort((a, b) => {
      const aDone = a.isEnded || a.paused;
      const bDone = b.isEnded || b.paused;
      if (aDone !== bDone) return aDone ? 1 : -1;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      // Costs are compared as monthly amounts in the main currency, so a yearly
      // plan doesn't get ranked as if it were a monthly one.
      const monthlyOf = (s) => {
        const v = convertAmount(costOn(s, todayISO), s.currency || settings.currency, settings.currency, rates);
        return monthlyEquivalent(v, s.frequency);
      };
      if (sortBy === "costDesc") return monthlyOf(b) - monthlyOf(a);
      if (sortBy === "costAsc") return monthlyOf(a) - monthlyOf(b);
      return a.daysLeft - b.daysLeft;
    });
  }, [enriched, filterCategories, hideEnded, sortBy, listSearch, rates, settings.currency]);

  // Quanti terminati ci sarebbero da mostrare (data di fine o pausa, stessa
  // cosa ormai), agli stessi filtri di categoria e ricerca attivi —
  // indipendente da hideEnded stesso, così il numero sul bottone resta
  // giusto sia nascosti sia già mostrati.
  const endedCount = useMemo(() => {
    let list = enriched.filter((s) => s.isEnded || s.paused);
    if (filterCategories.length > 0) list = list.filter((s) => filterCategories.includes(s.category));
    if (listSearch.trim()) {
      const q = listSearch.trim().toLowerCase();
      list = list.filter((s) => s.name.toLowerCase().includes(q));
    }
    return list.length;
  }, [enriched, filterCategories, listSearch]);

  // Totals reflect the currently selected category filter (always excluding ended subs)
  const totalsBase = useMemo(
    () => (filterCategories.length === 0 ? activeSubs : activeSubs.filter((s) => filterCategories.includes(s.category))),
    [activeSubs, filterCategories]
  );

  const monthlyTotal = useMemo(
    () => totalsBase.reduce((sum, s) => sum + monthlyEquivalent(inMainCurrency(s), s.frequency), 0),
    [totalsBase, rates, settings.currency]
  );
  const annualTotal = monthlyTotal * 12;
  const dailyTotal = annualTotal / 365;
  const showYear = totalPeriod === "year";

  function changePeriod(next) {
    if (next === totalPeriod) return;
    setPeriodDirection(next === "year" ? "left" : "right");
    setTotalPeriod(next);
  }

  // The class replays only because the key changes with it: without the key
  // React keeps the same element and an animation that has already run does
  // not run again.
  const periodAnim = periodDirection === null ? "" : periodDirection === "left" ? "rb-view-left" : "rb-view-right";
  const totalSwipe = useCardSwipe((direction) => changePeriod(direction === "left" ? "year" : "month"));
  const headlineTotal = showYear ? annualTotal : monthlyTotal;
  const dailyEquivalence = dailyEquivalent(dailyTotal, settings.currency, settings.language);

  const categoryTotals = useMemo(() => {
    const map = {};
    totalsBase.forEach((s) => {
      const m = monthlyEquivalent(inMainCurrency(s), s.frequency);
      map[s.category] = (map[s.category] || 0) + m;
    });
    return CATEGORIES.map((c) => ({ ...c, total: map[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);
  }, [totalsBase, settings.language, rates, settings.currency, settings.categoryColors]);

  // ---------------------------------------------------------------------
  // Scheda Risparmio. Le tre fonti non hanno lo stesso grado di verità e per
  // questo restano separate a schermo: la tua offerta in scadenza è esatta e
  // viene dai tuoi dati; una sovrapposizione è esatta ma non è un consiglio;
  // un piano alternativo arriva da un file pubblicato e può solo rimandare al
  // sito del servizio, perché i prezzi invecchiano in poche settimane.
  // ---------------------------------------------------------------------

  const savingsPlansByService = useMemo(() => {
    const map = new Map();
    if (offersFile && Array.isArray(offersFile.piani)) {
      offersFile.piani.forEach((p) => {
        if (p && p.servizio) map.set(normaliseServiceName(p.servizio), p);
      });
    }
    return map;
  }, [offersFile]);

  // Il listino è quotato in una valuta sola per tutto il file, dichiarata in
  // testa: passa dalla stessa conversione di ogni altro importo.
  const savingsFileCurrency = (offersFile && offersFile.valuta) || "EUR";

  // La tua offerta iniziale che sta per finire. Il costo pieno è già in `cost`
  // e quello scontato in `promoCost`, quindi la differenza non va stimata.
  const savingsEndingPromos = useMemo(() => {
    return enriched
      .filter((s) => !s.isEnded && !s.paused && s.promoUntil && s.promoCost != null && s.promoUntil > todayISO)
      .map((s) => {
        const currency = s.currency || settings.currency;
        const promo = convertAmount(s.promoCost, currency, settings.currency, rates);
        const full = convertAmount(s.cost, currency, settings.currency, rates);
        return {
          sub: s,
          promo,
          full,
          // Date fresche a ogni chiamata: daysBetween azzera l'orario sugli
          // oggetti che riceve, quindi riusarli li corromperebbe.
          daysLeft: daysBetween(parseLocalDate(todayISO), parseLocalDate(s.promoUntil)),
          extraPerYear: monthlyEquivalent(full - promo, s.frequency) * 12,
        };
      })
      .filter((p) => p.full > p.promo)
      .sort((a, b) => a.daysLeft - b.daysLeft);
  }, [enriched, todayISO, settings.currency, rates]);

  const savingsDuplicates = useMemo(() => {
    const byGroup = new Map();
    activeSubs.forEach((s) => {
      const group = savingsOverlapGroup(s);
      if (!group) return;
      const list = byGroup.get(group) || [];
      list.push(s);
      byGroup.set(group, list);
    });
    return Array.from(byGroup.entries())
      .filter((entry) => entry[1].length >= 2)
      .map((entry) => {
        const group = entry[0];
        const label =
          group === "video" ? t.savingsGroupVideo :
          group === "music" ? t.savingsGroupMusic :
          group === "antivirus" ? t.savingsGroupAntivirus :
          group === "vpn" ? t.savingsGroupVpn :
          (CATEGORIES.find((c) => c.id === group) || CATEGORIES[CATEGORIES.length - 1]).label;
        const items = entry[1]
          .map((s) => ({
            sub: s,
            monthly: monthlyEquivalent(
              convertAmount(costOn(s, todayISO), s.currency || settings.currency, settings.currency, rates),
              s.frequency
            ),
          }))
          .sort((a, b) => b.monthly - a.monthly);
        const monthly = items.reduce((sum, x) => sum + x.monthly, 0);
        const keepOne = SAVINGS_KEEP_ONE.has(group);
        // Il numero deve raccontare la stessa storia della frase che gli sta
        // sotto, non una in disaccordo con l'altra. Per antivirus e VPN
        // ("ne serve uno solo") ha senso tenere il più caro e lasciare gli
        // altri: sono la stessa cosa, uno vale l'altro, si tiene il migliore.
        // Per streaming, musica, gaming e AI la frase dice "a rotazione" — un
        // servizio alla volta, a turno — e "tenere solo il più caro per
        // sempre" non è quello: è smettere di ruotare. La stima coerente con
        // la rotazione è il costo medio di un servizio alla volta, non quello
        // del più caro fra tutti.
        const saving = keepOne
          ? Math.max(0, monthly - items[0].monthly)
          : Math.max(0, monthly - monthly / items.length);
        return { id: group, label, items, monthly, saving, keepOne, potential: true };
      })
      .sort((a, b) => b.saving - a.saving);
  }, [activeSubs, todayISO, settings.currency, settings.language, settings.categoryColors, rates]);

  // Quanto un abbonamento è cambiato da quando è iniziato: nasce interamente
  // dallo storico prezzi che l'app registra già da sola (lo stesso usato nel
  // dettaglio dell'abbonamento), non da un file da mantenere. Vero al cento
  // per cento perché è quello che l'utente ha davvero pagato, e non
  // invecchia mai: non serve nessuna ricerca, cresce da solo con ogni nuovo
  // abbonamento tracciato abbastanza a lungo. Mostra sia gli aumenti sia i
  // cali: un calo è raro quanto un aumento, ma è un'informazione vera tanto
  // quanto — la sezione racconta cosa è successo, non solo mette in guardia.
  const savingsPriceIncreases = useMemo(() => {
    return activeSubs
      .map((s) => {
        const hist = buildPriceSeries(s, payments, todayISO);
        if (hist.length === 0) return null;
        // Il prezzo durante un'offerta non è il punto di partenza giusto:
        // confrontare con quello farebbe sembrare un aumento normalissimo la
        // fine di uno sconto iniziale, che è tutt'altra cosa (già coperta da
        // "Da decidere adesso").
        const settled = hist.filter((p) => !p.promo);
        if (settled.length < 2) return null;
        const first = settled[0];
        const last = settled[settled.length - 1];
        const firstAmount = convertAmount(first.cost, first.currency || s.currency, settings.currency, rates);
        const lastAmount = convertAmount(last.cost, last.currency || s.currency, settings.currency, rates);
        if (!(Math.abs(lastAmount - firstAmount) > 0.01)) return null;
        const pct = firstAmount > 0 ? Math.round(((lastAmount - firstAmount) / firstAmount) * 100) : 0;
        // Traccia per lo sparkline: solo i prezzi "a regime", nello stesso
        // ordine in cui sono stati pagati davvero.
        const points = settled.map((p) => convertAmount(p.cost, p.currency || s.currency, settings.currency, rates));
        return {
          sub: s,
          from: firstAmount,
          to: lastAmount,
          diff: lastAmount - firstAmount,
          up: lastAmount > firstAmount,
          pct,
          since: first.date,
          points,
        };
      })
      .filter(Boolean)
      .sort((a, b) => b.diff - a.diff);
  }, [activeSubs, payments, todayISO, settings.currency, rates]);

  const savingsOpportunities = useMemo(() => {
    const raw = offersFile && (offersFile.opportunita || offersFile.risparmi);
    if (!Array.isArray(raw)) return [];
    const byName = new Map(activeSubs.map((s) => [normaliseServiceName(s.name), s]));
    return raw.map((o, index) => {
      const names = o.sostituisce || o.replaces || [];
      if (!Array.isArray(names) || names.length === 0) return null;
      const subs = names.map((name) => byName.get(normaliseServiceName(name))).filter(Boolean);
      if (subs.length !== names.length) return null;
      const currentCost = subs.reduce((sum, sub) => sum + monthlyEquivalent(convertAmount(costOn(sub, todayISO), sub.currency || settings.currency, settings.currency, rates), sub.frequency), 0);
      const altRaw = o.costoAlternativa ?? o.alternativeCost ?? o.costo ?? o.prezzo;
      if (altRaw == null || !Number.isFinite(Number(altRaw))) return null;
      const alternativeCost = monthlyEquivalent(convertAmount(Number(altRaw), o.valuta || savingsFileCurrency, settings.currency, rates), o.frequenzaAlternativa || "monthly");
      const saving = currentCost - alternativeCost;
      if (!(saving > 0.01)) return null;
      return { id: o.id || `opportunity-${index}`, ...o, subs, currentCost, alternativeCost, saving };
    }).filter(Boolean).sort((a, b) => b.saving - a.saving);
  }, [offersFile, activeSubs, todayISO, settings.currency, settings.language, rates, savingsFileCurrency]);

  const savingsHeadline = useMemo(() => {
    const candidates = [
      ...savingsOpportunities.map((o) => ({ ...o, services: new Set(o.subs.map((s) => s.id)) })),
      ...savingsDuplicates.map((g) => ({ ...g, services: new Set(g.items.map((x) => x.sub.id)) })),
    ].sort((a, b) => b.saving - a.saving);
    const used = new Set();
    const selected = [];
    candidates.forEach((c) => {
      const overlap = Array.from(c.services).some((id) => used.has(id));
      if (overlap) return;
      c.services.forEach((id) => used.add(id));
      selected.push(c);
    });
    return { amount: selected.reduce((sum, c) => sum + c.saving, 0), selected };
  }, [savingsOpportunities, savingsDuplicates]);

  const savingsCategoryTotals = useMemo(() => {
    const map = {};
    savingsHeadline.selected.forEach((item) => {
      const subs = item.subs || (item.items || []).map((x) => x.sub);
