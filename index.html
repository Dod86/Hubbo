<script>
// Back-button plumbing lives outside React so it is attached before the app
// mounts and can never be torn down by a re-render. React only supplies the
// handler that decides what the current top layer is.
window.__hubboBack = { handler: null, count: 0, lastEvent: "-", depth: 0 };
(function () {
  var GUARD = "#v";
  var TARGET = 4;      // spare history entries kept in reserve
  var depth = 0;       // how many we believe are still on the stack
  var lastAt = 0;

  function pushGuard() {
    try {
      window.history.pushState({ rb: Date.now() }, "", GUARD);
      depth++;
      window.__hubboBack.depth = depth;
    } catch (e) {
      /* history unavailable */
    }
  }

  function topUp() {
    // A single hardware Back can consume more than one entry on some Android
    // builds, so a small buffer is kept rather than a single guard.
    var tries = 0;
    while (depth < TARGET && tries < TARGET + 2) {
      pushGuard();
      tries++;
    }
  }

  function onBack(evt) {
    // One physical Back fires both popstate and hashchange; treat them as one.
    var now = Date.now();
    if (now - lastAt < 350) return;
    lastAt = now;

    depth = Math.max(0, depth - 1);
    window.__hubboBack.count++;
    window.__hubboBack.lastEvent = evt && evt.type ? evt.type : "?";
    window.__hubboBack.depth = depth;

    try {
      if (window.__hubboBack.handler) window.__hubboBack.handler();
    } catch (e) {
      /* ignore */
    }

    // Refill once the browser has finished the navigation.
    setTimeout(topUp, 0);
  }

  topUp();
  window.addEventListener("popstate", onBack);
  window.addEventListener("hashchange", onBack);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") setTimeout(topUp, 0);
  });
})();
</script>

<script>
if (!window.storage) {
  const PREFIX = "hubbo_store_";
  window.storage = {
    async get(key) { const raw = localStorage.getItem(PREFIX + key); if (raw === null) throw new Error("Key not found: " + key); return { key, value: raw, shared: false }; },
    async set(key, value) { localStorage.setItem(PREFIX + key, value); return { key, value, shared: false }; },
    async delete(key) { localStorage.removeItem(PREFIX + key); return { key, deleted: true, shared: false }; },
    async list(prefix) { const p = PREFIX + (prefix || ""); return { keys: Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice(PREFIX.length)) }; },
  };
}
</script>

// Indicative fixed rates relative to EUR. In the shipped app these would be
// refreshed from a rates API; offline they keep totals roughly meaningful.
const RATES_TO_EUR = {
  EUR: 1,
  USD: 0.92,
  GBP: 1.17,
  CHF: 1.06,
};

function convertAmount(amount, from, to, liveRates) {
  const table = liveRates || RATES_TO_EUR;
  const f = table[from] || RATES_TO_EUR[from] || 1;
  const tRate = table[to] || RATES_TO_EUR[to] || 1;
  return (amount * f) / tRate;
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function parseLocalDate(value) {
  if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value));
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(value);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

async function showNotification(title, options) {
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) {
        await reg.showNotification(title, options);
        return true;
      }
    }
  } catch {
    // fall through to the direct constructor
  }
  try {
    new Notification(title, options);
    return true;
  } catch {
    return false;
  }
}

// Prices are typed on a locale keyboard, where Italian, Spanish, French and
// German users all get a comma as the decimal key. A native number input
// silently rejects it and hands back an empty value, so the amount is kept as
// text and normalised here instead.
function parseAmount(value) {
  if (value === null || value === undefined) return NaN;
  return parseFloat(String(value).replace(",", "."));
}

// The price series shown in the detail sheet.
//
// Explicit price changes are only recorded from v39 onwards, so on their own
// they would leave every existing subscription with an empty section. The
// recorded payments already carry the amount charged on each date, which is a
// better source anyway: it reflects reality, including any manual correction
// made in the history. Both are merged and runs of the same price collapse
// into a single point.
function buildPriceSeries(sub, payments) {
  const points = [];
  if (Array.isArray(sub.priceHistory)) {
    sub.priceHistory.forEach((p) => {
      if (p && typeof p.cost === "number" && p.date) {
        points.push({ cost: p.cost, currency: p.currency || sub.currency, date: p.date });
      }
    });
  }
  (payments || []).forEach((p) => {
    if (p.subId === sub.id && p.status !== "skipped") {
      points.push({ cost: p.amount, currency: p.currency || sub.currency, date: p.date });
    }
  });
  if (points.length === 0) {
    // Nothing recorded yet: the section still shows today's price, so it is
    // never an empty box. The date is omitted when it isn't known.
    return [{ cost: sub.cost, currency: sub.currency, date: sub.startDate || "" }];
  }

  points.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const out = [];
  points.forEach((pt) => {
    const last = out[out.length - 1];
    if (last && last.cost === pt.cost) return;
    if (last && last.date === pt.date) {
      // Same day, different price: the later reading wins.
      out[out.length - 1] = pt;
      return;
    }
    out.push(pt);
  });
  return out;
}

function toLocalISO(d) {
  // toISOString() reports UTC, so late evening in UTC+2 would already read as
  // tomorrow. The app always works with the device's own calendar day.
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function daysBetween(a, b) {
  return Math.round((b.setHours(0, 0, 0, 0) - a.setHours(0, 0, 0, 0)) / 86400000);
}

// Renewals follow the calendar, not a fixed number of days: a subscription
// billed on the 31st falls on the 30th in April and on the 28th/29th in
// February, then goes back to the 31st — exactly how real billing works.
function addPeriods(anchorDate, frequency, count) {
  const anchorDay = anchorDate.getDate();
  const d = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
  if (frequency === "annual") {
    d.setFullYear(d.getFullYear() + count);
  } else {
    d.setMonth(d.getMonth() + count);
  }
  const daysInTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(anchorDay, daysInTarget));
  return d;
}

function periodsBetween(anchorDate, target, frequency) {
  if (frequency === "annual") return target.getFullYear() - anchorDate.getFullYear();
  return (target.getFullYear() - anchorDate.getFullYear()) * 12 + (target.getMonth() - anchorDate.getMonth());
}

function nextRenewalInfo(sub, today) {
  const isEnded = sub.endDate ? daysBetween(parseLocalDate(sub.endDate), parseLocalDate(today)) > 0 : false;
  const anchor = parseLocalDate(sub.renewalDate);
  const todayDate = parseLocalDate(today);

  let steps = Math.max(0, periodsBetween(anchor, todayDate, sub.frequency));
  let renewal = addPeriods(anchor, sub.frequency, steps);
  let safety = 0;
  while (daysBetween(parseLocalDate(today), parseLocalDate(renewal)) < 0 && safety < 500) {
    steps += 1;
    renewal = addPeriods(anchor, sub.frequency, steps);
    safety++;
  }

  // One period before the upcoming renewal — may sit before the anchor date,
  // which is what makes the ring fill correctly on the very first cycle.
  const previous = addPeriods(anchor, sub.frequency, steps - 1);
  const daysLeft = daysBetween(parseLocalDate(today), parseLocalDate(renewal));
  const cycleDays = Math.max(1, daysBetween(parseLocalDate(previous), parseLocalDate(renewal)));
  const progress = 1 - daysLeft / cycleDays;
  return { renewal, daysLeft, progress: Math.min(Math.max(progress, 0), 1), cycleDays, isEnded };
}

function formatMoney(n, symbol, locale) {
  const num = n.toLocaleString(locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return symbol.length > 1 ? `${num} ${symbol}` : `${symbol} ${num}`;
}

function symbolFor(code) {
  const c = CURRENCIES.find((x) => x.code === code);
  return c ? c.symbol : code;
}

const CANCEL_QUERY = {
  it: (name) => `come disdire ${name}`,
  en: (name) => `how to cancel ${name} subscription`,
  es: (name) => `cómo cancelar ${name}`,
  fr: (name) => `comment résilier ${name}`,
  de: (name) => `${name} kündigen`,
};

function cancelSearchUrl(name, language) {
  const build = CANCEL_QUERY[language] || CANCEL_QUERY.en;
  return `https://www.google.com/search?q=${encodeURIComponent(build(name))}`;
}

// True when the subscription was paused across that date. Pause periods are
// recorded as the user toggles the pause switch, so only pauses made from this
// version onwards are known — older history simply reads as active.
function wasPausedOn(sub, date) {
  const periods = sub.pausePeriods;
  if (!Array.isArray(periods) || periods.length === 0) return false;
  return periods.some((p) => {
    if (!p || !p.from) return false;
    const from = parseLocalDate(p.from);
    if (date < from) return false;
    if (!p.to) return true;
    return date <= parseLocalDate(p.to);
  });
}

// Every billing date that has already happened, newest last.
//
// The cycle's phase comes from renewalDate (which is the *next* renewal, so it
// is normally in the future) while how far back the history reaches comes from
// startDate. Without a startDate there is nothing honest to reconstruct, so the
// subscription contributes no history at all rather than an invented one.
function pastOccurrences(sub, today, maxYears = 15) {
  if (!sub || !sub.startDate || !sub.renewalDate) return [];
  const anchor = parseLocalDate(sub.renewalDate);
  const start = parseLocalDate(sub.startDate);
  const floor = new Date(today.getFullYear() - maxYears, today.getMonth(), today.getDate());
  const lowerBound = start > floor ? start : floor;
  const end = sub.endDate ? parseLocalDate(sub.endDate) : null;

  const out = [];
  for (let k = 0; k > -100000; k--) {
    const d = addPeriods(anchor, sub.frequency, k);
    if (d < lowerBound) break;
    if (d > today) continue;
    if (end && d > end) continue;
    if (wasPausedOn(sub, d)) continue;
    out.push(d);
    if (out.length > 800) break;
  }
  return out.reverse();
}

// Occurrences falling inside one calendar month.
//
// The anchor (renewalDate) sets the cycle's phase but is normally in the
// future, so on its own it can only describe months from today onwards. When a
// start date is known the same cycle is walked backwards to it, which is what
// lets the calendar show past months instead of drawing them empty.
function occurrencesInMonth(renewalDateStr, frequency, monthDate, startDateStr) {
  const anchor = parseLocalDate(renewalDateStr);
  const monthStart = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const monthEnd = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
  const lowerBound = startDateStr ? parseLocalDate(startDateStr) : anchor;
  if (lowerBound > monthEnd) return [];

  const steps = periodsBetween(anchor, monthStart, frequency);
  const results = [];
  // A calendar month holds at most one monthly (or yearly) occurrence, but the
  // neighbouring steps are checked so month-length clamping can't drop one.
  for (let k = steps - 1; k <= steps + 1; k++) {
    const d = addPeriods(anchor, frequency, k);
    if (d >= monthStart && d <= monthEnd && d >= lowerBound) {
      if (!results.some((r) => r.getTime() === d.getTime())) results.push(d);
    }
  }
  return results.sort((a, b) => a - b);
}

// Checks whether a start date actually falls on the renewal cycle.
//
// A subscription renewing on the 15th cannot have been billed on the 17th, so a
// start date that misses the cycle silently pushes the first recorded payment
// to the next one. Rather than guess, the form points this out and offers the
// nearest date that does line up.
function cycleAlignment(startDateStr, renewalDateStr, frequency) {
  if (!startDateStr || !renewalDateStr) return null;
  const start = parseLocalDate(startDateStr);
  const anchor = parseLocalDate(renewalDateStr);
  if (isNaN(start) || isNaN(anchor)) return null;

  const steps = periodsBetween(anchor, start, frequency);
  let before = null;
  let after = null;
  for (let k = steps - 2; k <= steps + 2; k++) {
    const d = addPeriods(anchor, frequency, k);
    if (d.getTime() === start.getTime()) return null;
    if (d < start && (!before || d > before)) before = d;
    if (d > start && (!after || d < after)) after = d;
  }
  if (!before && !after) return null;
  const suggested =
    !before ? after : !after ? before : start - before <= after - start ? before : after;
  return { first: after, suggested };
}

function formatDate(dateStr, locale) {
  if (!dateStr) return "";
  const d = parseLocalDate(dateStr);
  return d.toLocaleDateString(locale, { day: "numeric", month: "short", year: "numeric" });
}

// Bottom sheets can be flicked down to close: the hardware Back button is not
// reliably delivered to installed PWAs on every Android build, so the gesture
// gives a dependable way out that doesn't depend on the system.
function useSheetDrag(onClose) {
  const [dragY, setDragY] = useState(0);
  const startRef = useRef(null);
  const elRef = useRef(null);

  const onTouchStart = (e) => {
    const el = e.currentTarget;
    // Only start a dismiss drag when the sheet is scrolled to the top.
    if (el.scrollTop > 0) return;
    startRef.current = e.touches[0].clientY;
  };

  const onTouchMove = (e) => {
    if (startRef.current === null) return;
    const dy = e.touches[0].clientY - startRef.current;
    setDragY(dy > 0 ? dy : 0);
  };

  const onTouchEnd = () => {
    if (startRef.current === null) return;
    const shouldClose = dragY > 90;
    startRef.current = null;
    if (shouldClose && elRef.current) {
      // Hand off to the CSS close animation from the exact spot the drag
      // left the sheet, so it continues the motion instead of snapping
      // back to fully open for a frame before sliding away.
      elRef.current.style.setProperty("--rb-drag-y", `${dragY}px`);
    }
    setDragY(0);
    if (shouldClose) onClose();
  };

  return {
    ref: elRef,
    handlers: { onTouchStart, onTouchMove, onTouchEnd, onTouchCancel: onTouchEnd },
    style: dragY
      ? { transform: `translateY(${dragY}px)`, transition: "none" }
      : undefined,
    dragging: dragY > 0,
  };
}

// A label that slides gently back and forth when it is too wide for its slot,
// so long translations stay fully readable instead of being cut with an
// ellipsis. It measures first and only animates when the text really overflows.
function ScrollingLabel({ children, className = "", style }) {
  const wrapRef = useRef(null);
  const textRef = useRef(null);
  const [distance, setDistance] = useState(0);

  useEffect(() => {
    const wrap = wrapRef.current;
    const text = textRef.current;
    if (!wrap || !text) return;
    const overflow = text.scrollWidth - wrap.clientWidth;
    setDistance(overflow > 1 ? overflow : 0);
  }, [children]);

  return (
    <div ref={wrapRef} className={`rb-marquee ${className}`} style={style}>
      <span
        ref={textRef}
        className={distance ? "rb-marquee-run" : ""}
        style={
          distance
            ? {
                "--rb-marquee-dx": `-${distance + 4}px`,
                // Longer overhangs get proportionally longer to stay readable.
                animationDuration: `${Math.max(5, (distance + 4) / 14)}s`,
              }
            : undefined
        }
      >
        {children}
      </span>
    </div>
  );
}

// The renewal ring is the app's signature, so the spend totals wear it too:
// one arc per category, sized by its share. The ring is deliberately open in
// the top-left quarter, which is where the amount sits and breaks out of it.
// Picks whichever of ink or paper reads better on a given fill, so the amount
// stays legible whatever colour the capsule takes — including the neutral one
// it falls back to when there is nothing to show yet.
function readableOn(hex) {
  const h = String(hex).replace("#", "");
  if (h.length !== 6) return "#15130E";
  const channel = (i) => {
    const v = parseInt(h.substr(i, 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  const luminance = 0.2126 * channel(0) + 0.7152 * channel(2) + 0.0722 * channel(4);
  const contrast = (other) => {
    const hi = Math.max(luminance, other);
    const lo = Math.min(luminance, other);
    return (hi + 0.05) / (lo + 0.05);
  };
  return contrast(0.0064) >= contrast(1) ? "#15130E" : "#FFFFFF";
}

function CategoryRing({ segments, total, colors, size = 128, stroke = 11 }) {
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const SWEEP = 0.75;
  const arc = circumference * SWEEP;
  const gap = segments.length > 1 ? 4 : 0;
  let offset = 0;
  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }} aria-hidden="true">
      <circle
        cx={size / 2}
        cy={size / 2}
        r={r}
        fill="none"
        stroke={colors.surface2}
        strokeWidth={stroke}
        strokeLinecap="round"
        strokeDasharray={`${arc} ${circumference - arc}`}
      />
      {total > 0 &&
        segments.map((seg) => {
          const len = (seg.total / total) * arc;
          const drawn = Math.max(0, len - gap);
          const el = (
            <circle
              key={seg.id}
              cx={size / 2}
              cy={size / 2}
              r={r}
              fill="none"
              stroke={seg.color}
              strokeWidth={stroke}
              strokeDasharray={`${drawn} ${circumference - drawn}`}
              strokeDashoffset={-offset}
            />
          );
          offset += len;
          return el;
        })}
    </svg>
  );
}

// Reads the ring for you: without it the colours mean nothing. Every category
// making up the total is listed — hiding any of them would leave an unexplained
// arc in the ring, which is exactly what the legend exists to prevent.
function CategoryLegend({ segments, total, colors }) {
  if (!segments || segments.length === 0 || total <= 0) return null;
  return (
    <div className="flex-1 min-w-0 flex flex-col gap-1">
      {segments.map((seg) => (
        <div key={seg.id} className="flex items-center gap-2 min-w-0">
          <span style={{ background: seg.color, width: 9, height: 9, borderRadius: 999 }} className="flex-shrink-0" />
          <span style={{ color: colors.textSecondary }} className="text-xs truncate flex-1">{seg.label}</span>
          <span style={{ color: colors.textPrimary, fontFamily: "'JetBrains Mono', monospace" }} className="text-xs font-semibold flex-shrink-0">
            {Math.round((seg.total / total) * 100)}%
          </span>
        </div>
      ))}
    </div>
  );
}

// Brands without a bundled vector (Disney+, Canva, Adobe...) get their real
// logo fetched by domain; failures are remembered so we don't retry endlessly,
// and the bundled icon or category glyph covers offline use.
// Which logo source each domain ended up on, remembered for the session so a
// domain is probed once rather than on every render.
const remoteLogoStage = {};

// Brands whose mark is white or near-white: on a light chip they'd disappear,
// so they get a dark chip instead.
const LIGHT_LOGO_DOMAINS = new Set([
  "dazn.com",
  "x.com",
  "tidal.com",
  "notion.so",
  "obsidian.md",
  "medium.com",
  "substack.com",
  "ghost.org",
  "vercel.com",
  "framer.com",
  "apple.com",
  "tv.apple.com",
  "music.apple.com",
  "openai.com",
  "midjourney.com",
  "elevenlabs.io",
  "linear.app",
  "mullvad.net",
  "prestashop.com",
  "nowtv.it",
]);

const LIGHT_LOGO_ICONS = new Set([
  "dazn", "x", "tidal", "notion", "obsidian", "medium", "substack",
  "ghost", "vercel", "framer", "appletv", "applemusic", "threads",
  "tiktok", "elevenlabs", "linear", "now",
]);

// These brand marks are bright yellow, which barely reads against the usual
// pale brand-tinted chip. They get a near-black chip instead, but keep their
// own colour (unlike LIGHT_LOGO_ICONS, whose marks turn off-white) since
// yellow already contrasts well on dark.
const YELLOW_LOGO_ICONS = new Set(["norton", "sketch", "mailchimp", "snapchat"]);

// Logos are tried against several sources in turn, because neither covers
// everything: the first returns a genuine 404 when it has nothing (which is
// what lets the initial-letter fallback work at all), while the second has
// broader coverage but answers with a generic globe instead of failing. That
// globe is caught by the size check below, so an unknown domain still ends up
// as a clean initial rather than a meaningless placeholder.
const LOGO_SOURCES = [
  (d) => `https://icons.duckduckgo.com/ip3/${d}.ico`,
  (d) => `https://www.google.com/s2/favicons?domain=${d}&sz=128`,
];

// Domains that should skip the remote lookup entirely.
const NO_REMOTE_LOGO_DOMAINS = new Set([]);

function ServiceLogo({ icon, category, domain, letter, color, size = 22, plain = false }) {
  const path = icon && BRAND_ICONS[icon];
  const brandColor = (icon && BRAND_COLORS[icon]) || color;
  const fallbackIconName = CATEGORY_FALLBACK_ICON[category] || "package";

  const [stage, setStage] = useState(() =>
    domain ? remoteLogoStage[domain] || 0 : LOGO_SOURCES.length
  );
  const useRemote =
    !path && !!domain && stage < LOGO_SOURCES.length && !NO_REMOTE_LOGO_DOMAINS.has(domain);

  const advanceSource = () => {
    const next = stage + 1;
    remoteLogoStage[domain] = next;
    setStage(next);
  };

  const isYellowLogo = icon && YELLOW_LOGO_ICONS.has(icon);
  const needsDarkChip =
    (domain && LIGHT_LOGO_DOMAINS.has(domain)) || (icon && LIGHT_LOGO_ICONS.has(icon)) || isYellowLogo;

  // The chip picks up a whisper of the brand colour instead of being a hard
  // white disc: it separates from the page in both themes and gives each
  // service a little identity of its own.
  const chip = isYellowLogo
    ? { background: "#1C1C1E", border: "1px solid rgba(255,255,255,0.08)" }
    : needsDarkChip
    ? { background: "#1B1E29", border: "1px solid rgba(255,255,255,0.10)" }
    : plain
    ? { background: "transparent", border: "none" }
    : { background: `${brandColor}1F`, border: `1px solid ${brandColor}2E` };

  if (useRemote) {
    return (
      <div
        style={{ width: size, height: size, borderRadius: 999, ...chip }}
        className="flex items-center justify-center flex-shrink-0 overflow-hidden"
      >
        <img
          key={stage}
          src={LOGO_SOURCES[stage](domain)}
          alt=""
          loading="lazy"
          onError={advanceSource}
          onLoad={(e) => {
            // A 16px answer from a source asked for 128px is the generic
            // placeholder, not a real logo — and even a genuine 16px icon
            // would look mushy at this size, so the initial reads better.
            if (e.currentTarget.naturalWidth && e.currentTarget.naturalWidth <= 16) advanceSource();
          }}
          style={{ width: "100%", height: "100%", objectFit: "cover" }}
        />
      </div>
    );
  }

  // Yellow marks keep their own colour even on the dark chip; every other
  // mark that needs a dark chip switches to an off-white tint instead.
  const glyphColor = needsDarkChip ? (isYellowLogo ? brandColor : "#F2F1ED") : brandColor;

  return (
    <div
      style={{ width: size, height: size, borderRadius: 999, ...chip }}
      className="flex items-center justify-center flex-shrink-0"
    >
      {path ? (
        <svg viewBox="0 0 24 24" width={size * 0.55} height={size * 0.55} fill={glyphColor}>
          <path d={path} />
        </svg>
      ) : letter ? (
        // No vector mark and no working remote favicon: an initial reads far
        // better than a generic category icon that every other unmatched
        // service would show as well.
        <span style={{ fontSize: size * 0.44, fontWeight: 600, color: glyphColor, lineHeight: 1 }}>
          {letter}
        </span>
      ) : (
        <Icon name={fallbackIconName} size={size * 0.55} color={glyphColor} strokeWidth={2.2} />
      )}
    </div>
  );
}

function useSystemPrefersDark() {
  const [prefersDark, setPrefersDark] = useState(
    () => typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
  );
  useEffect(() => {
    if (typeof window === "undefined" || !window.matchMedia) return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = (e) => setPrefersDark(e.matches);
    if (mq.addEventListener) mq.addEventListener("change", handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", handler);
      else mq.removeListener(handler);
    };
  }, []);
  return prefersDark;
}

        return;
      }
      if (form.startDate && form.startDate > todayISO) {
        setFormError(t.errStartFuture);
        return;
      }
      if (form.startDate && form.hasEndDate && form.endDate && form.startDate > form.endDate) {
        setFormError(t.errStartAfterEnd);
        return;
      }
      const people = form.isShared ? parseInt(form.peopleCount, 10) : null;
      if (form.isShared && (!people || people < 2)) {
        setFormError(t.errNoPeople);
        return;
      }
      setFormError("");
      setSaving(true);
      const rawCost = parseAmount(form.cost);
      const effectiveCost = form.isShared ? Math.round((rawCost / people) * 100) / 100 : rawCost;
      const prevSub = editingId ? subs.find((s) => s.id === editingId) : null;
      let lastIncrease = prevSub ? prevSub.lastIncrease || null : null;
      if (prevSub && effectiveCost !== prevSub.cost) {
        lastIncrease = effectiveCost > prevSub.cost ? { from: prevSub.cost, to: effectiveCost, date: todayISO } : null;
      }

      // Every price the subscription has ever had, oldest first. Subscriptions
      // created before this existed get seeded with their current price so the
      // series always has a starting point to measure against.
      const priceHistory = (() => {
        if (!prevSub) {
          return [{ cost: effectiveCost, currency: form.currency || settings.currency, date: form.startDate || todayISO }];
        }
        const base = Array.isArray(prevSub.priceHistory) && prevSub.priceHistory.length > 0
          ? prevSub.priceHistory
          : [{ cost: prevSub.cost, currency: prevSub.currency || settings.currency, date: prevSub.startDate || todayISO }];
        if (effectiveCost === prevSub.cost) return base;
        // A second change on the same day replaces the first rather than
        // stacking two entries with an identical date.
        const trimmed = base.length > 1 && base[base.length - 1].date === todayISO ? base.slice(0, -1) : base;
        return [...trimmed, { cost: effectiveCost, currency: form.currency || settings.currency, date: todayISO }];
      })();
      const subData = {
        name: finalName,
        cost: effectiveCost,
        currency: form.currency || settings.currency,
        sharedTotalCost: form.isShared ? rawCost : null,
        sharedPeople: form.isShared ? people : null,
        frequency: form.frequency,
        category: form.category,
        renewalDate: form.renewalDate,
        startDate: form.startDate || null,
        endDate: form.hasEndDate ? form.endDate : null,
        note: form.note.trim() || null,
        lastIncrease,
        priceHistory,
      };
      const next = editingId
        ? subs.map((s) => (s.id === editingId ? { ...s, ...subData } : s))
        : [...subs, { id: uid(), ...subData }];
      await persist(next);
      setSaving(false);
      setShowForm(false);
      setEditingId(null);
    } catch (err) {
      setSaving(false);
      setFormError(t.errUnexpected + (err && err.message ? err.message : String(err)));
    }
  }

  async function handleDelete(id) {
    const sub = subs.find((s) => s.id === id);
    if (!sub) return;
    await persist(subs.filter((s) => s.id !== id));
    await persistTrash([{ ...sub, deletedAt: todayISO }, ...trash]);
    setConfirmDelete(null);
  }

  async function handleExport() {
    const payload = {
      app: "hubbo",
      version: 1,
      exportedAt: new Date().toISOString(),
      settings,
      subscriptions: subs,
      trash,
      payments,
    };
    const json = JSON.stringify(payload, null, 2);
    const filename = `hubbo-backup-${todayISO}.json`;

    // Prefer the system "save as" dialog so the user picks the destination;
    // fall back to a plain download where the API is unavailable.
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(json);
        await writable.close();
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
        // otherwise fall through to the download path
      }
    }

    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.app !== "hubbo" || !Array.isArray(data.subscriptions)) {
          setImportMessage(t.importError);
          return;
        }
        setPendingImport(data);
        setImportMessage("");
      } catch {
        setImportMessage(t.importError);
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  async function confirmImport() {
    if (!pendingImport) return;
    const existingIds = new Set(subs.map((s) => s.id));
    const existingKeys = new Set(subs.map((s) => `${s.name}|${s.cost}|${s.renewalDate}`));
    const incoming = pendingImport.subscriptions.filter(
      (s) => !existingIds.has(s.id) && !existingKeys.has(`${s.name}|${s.cost}|${s.renewalDate}`)
    );
    if (incoming.length > 0) await persist([...subs, ...incoming]);
    // Payment records carry their own stable ids, so a re-import simply skips
    // anything already on file instead of doubling up the history.
    if (Array.isArray(pendingImport.payments) && pendingImport.payments.length > 0) {
      const known = new Set(payments.map((p) => p.id));
      const extra = pendingImport.payments.filter((p) => p && p.id && !known.has(p.id));
      if (extra.length > 0) {
        await persistPayments([...payments, ...extra].sort((a, b) => (a.date < b.date ? 1 : -1)));
      }
    }
    setImportMessage(incoming.length > 0 ? t.importDone(incoming.length) : t.importNothing);
    setPendingImport(null);
  }

  async function handleRestore(id) {
    const sub = trash.find((s) => s.id === id);
    if (!sub) return;
    const { deletedAt, ...restored } = sub;
    await persistTrash(trash.filter((s) => s.id !== id));
    await persist([...subs, restored]);
  }

  async function handlePurge(id) {
    await persistTrash(trash.filter((s) => s.id !== id));
    setConfirmPurge(null);
  }

  async function handlePurgeAll() {
    await persistTrash([]);
    setConfirmPurge(null);
  }

  // Pausing now leaves a dated trace instead of a bare on/off flag, so the
  // history can tell a genuinely unpaid month from a paid one. Only pauses made
  // from this version onwards are known; anything earlier reads as active.
  async function handleTogglePause(id) {
    await persist(
      subs.map((s) => {
        if (s.id !== id) return s;
        const periods = Array.isArray(s.pausePeriods) ? s.pausePeriods.slice() : [];
        if (!s.paused) {
          periods.push({ from: todayISO, to: null });
        } else {
          for (let i = periods.length - 1; i >= 0; i--) {
            if (!periods[i].to) {
              periods[i] = { ...periods[i], to: todayISO };
              break;
            }
          }
        }
        return { ...s, paused: !s.paused, pausePeriods: periods };
      })
    );
  }

  const enriched = useMemo(() => {
    if (!subs) return [];
    return subs.map((s) => ({ ...s, ...nextRenewalInfo(s, todayISO) }));
  }, [subs, todayISO]);

  const activeSubs = useMemo(() => enriched.filter((s) => !s.isEnded && !s.paused), [enriched]);
  const pausedCount = useMemo(() => enriched.filter((s) => s.paused && !s.isEnded).length, [enriched]);

  const anyModalOpen =
    showForm || showSettings || showPaywall || showTrash || showMonthPicker ||
    !!confirmDelete || !!confirmPurge || !!pendingImport || !!detailSub || !!optionPicker || !!paymentAction;

  useEffect(() => {
    if (!anyModalOpen) return;
    // Freezing the page with `overflow: hidden` alone makes the browser forget
    // where the user was, so the scroll position is parked and restored by hand.
    const scrollY = window.scrollY || window.pageYOffset || 0;
    const body = document.body;
    const previous = {
      position: body.style.position,
      top: body.style.top,
      left: body.style.left,
      right: body.style.right,
      width: body.style.width,
      overflow: body.style.overflow,
    };

    body.style.position = "fixed";
    body.style.top = `-${scrollY}px`;
    body.style.left = "0";
    body.style.right = "0";
    body.style.width = "100%";
    body.style.overflow = "hidden";

    return () => {
      body.style.position = previous.position;
      body.style.top = previous.top;
      body.style.left = previous.left;
      body.style.right = previous.right;
      body.style.width = previous.width;
      body.style.overflow = previous.overflow;
      window.scrollTo(0, scrollY);
    };
  }, [anyModalOpen]);

  useEffect(() => {
    if (!settings.notifEnabled || typeof Notification === "undefined") return;

    let cancelled = false;

    async function fire() {
      try {
        let permission = Notification.permission;
        if (permission === "default") permission = await Notification.requestPermission();
        if (permission !== "granted" || cancelled) return;

        // Hold the reminders until the hour the user picked; before that, do nothing.
        const now = new Date();
        if (now.getHours() < settings.notifHour) return;

        activeSubs
          .filter((s) => s.daysLeft <= settings.notifDays && s.daysLeft >= 0)
          .forEach((s) => {
            const key = todayISO + ":" + s.id;
            if (notifiedToday.has(key)) return;
            notifiedToday.add(key);
            const when =
              s.daysLeft === 0 ? t.todayWord : s.daysLeft === 1 ? t.tomorrowWord : t.inDays(s.daysLeft);
            showNotification(t.appName, {
              body: t.notifBody(s.name, when),
              icon: "icons/icon-192.png",
              badge: "icons/icon-192.png",
              tag: "hubbo-" + s.id,
            });
          });
      } catch {
        // Notification API unavailable or blocked (e.g. inside a sandboxed preview)
      }
    }

    fire();
    // Re-check periodically so a session left open still fires at the chosen hour.
    const timer = setInterval(fire, 5 * 60 * 1000);
    return () => {
      cancelled = true;
      clearInterval(timer);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [settings.notifEnabled, settings.notifDays, settings.notifHour, activeSubs.length]);

  const usedCategories = useMemo(() => {
    const set = new Set(enriched.map((s) => s.category));
    return CATEGORIES.filter((c) => set.has(c.id));
  }, [enriched, settings.language]);

  const visibleSubs = useMemo(() => {
    let list = enriched;
    if (filterCategory !== "all") list = list.filter((s) => s.category === filterCategory);
    if (hideEnded) list = list.filter((s) => !s.isEnded);
    if (listSearch.trim()) {
      const q = listSearch.trim().toLowerCase();
      list = list.filter((s) => s.name.toLowerCase().includes(q));
    }
    return [...list].sort((a, b) => {
      if (a.isEnded !== b.isEnded) return a.isEnded ? 1 : -1;
      if (!!a.paused !== !!b.paused) return a.paused ? 1 : -1;
      if (sortBy === "name") return a.name.localeCompare(b.name);
      // Costs are compared as monthly amounts in the main currency, so a yearly
      // plan doesn't get ranked as if it were a monthly one.
      const monthlyOf = (s) => {
        const v = convertAmount(s.cost, s.currency || settings.currency, settings.currency, rates);
        return s.frequency === "annual" ? v / 12 : v;
      };
      if (sortBy === "costDesc") return monthlyOf(b) - monthlyOf(a);
      if (sortBy === "costAsc") return monthlyOf(a) - monthlyOf(b);
      return a.daysLeft - b.daysLeft;
    });
  }, [enriched, filterCategory, hideEnded, sortBy, listSearch, rates, settings.currency]);

  // Totals reflect the currently selected category filter (always excluding ended subs)
  const totalsBase = useMemo(
    () => (filterCategory === "all" ? activeSubs : activeSubs.filter((s) => s.category === filterCategory)),
    [activeSubs, filterCategory]
  );

  const monthlyTotal = useMemo(
    () => totalsBase.reduce((sum, s) => sum + (s.frequency === "annual" ? inMainCurrency(s) / 12 : inMainCurrency(s)), 0),
    [totalsBase, rates, settings.currency]
  );
  const annualTotal = monthlyTotal * 12;

  const categoryTotals = useMemo(() => {
    const map = {};
    totalsBase.forEach((s) => {
      const m = s.frequency === "annual" ? inMainCurrency(s) / 12 : inMainCurrency(s);
      map[s.category] = (map[s.category] || 0) + m;
    });
    return CATEGORIES.map((c) => ({ ...c, total: map[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);
  }, [totalsBase, settings.language, rates, settings.currency]);

  // Payments are *recorded*, not recalculated. Each billing date that passes
  // gets written once with the amount, currency and converted total frozen as
  // they were that day, so a later price rise or currency switch can never
  // rewrite what you already paid. Existing records are never touched again,
  // which also preserves any paid/not-paid correction made by hand.
  useEffect(() => {
    // `subs` is null until the first load resolves, so nothing is recorded
    // before the real subscriptions are in hand.
    if (!paymentsLoaded || !subs) return;
    const base = settings.currency;
    const byId = new Map(payments.map((p) => [p.id, p]));
    const valid = new Set();
    let changed = false;

    subs.forEach((sub) => {
      pastOccurrences(sub, today).forEach((d) => {
        const iso = toLocalISO(d);
        const id = `${sub.id}::${iso}`;
        valid.add(id);
        if (byId.has(id)) return;
        const currency = sub.currency || base;
        byId.set(id, {
          id,
          subId: sub.id,
          name: sub.name,
          category: sub.category,
          amount: sub.cost,
          currency,
          baseCurrency: base,
          baseAmount: convertAmount(sub.cost, currency, base, rates),
          date: iso,
          status: "paid",
          // Anything older than today was rebuilt from the cycle rather than
          // observed as it happened, and is labelled as such in the UI.
          estimated: iso !== todayISO,
        });
        changed = true;
      });
    });

    // A correction to a start or end date should drop the records it
    // invalidates — but only for subscriptions that still exist, so history
    // from deleted services stays in the totals.
    const liveIds = new Set(subs.map((s) => s.id));
    const next = [];
    byId.forEach((p) => {
      if (liveIds.has(p.subId) && !valid.has(p.id)) {
        changed = true;
        return;
      }
      next.push(p);
    });

    if (changed) persistPayments(next.sort((a, b) => (a.date < b.date ? 1 : -1)));
  }, [subs, payments, paymentsLoaded, todayISO, settings.currency, rates]);

  // Snapshots stay authoritative while the main currency is unchanged; if it
  // was switched, the original amount is reconverted at today's rate.
  const paymentInBase = (p) =>
    p.baseCurrency === settings.currency && typeof p.baseAmount === "number"
      ? p.baseAmount
      : convertAmount(p.amount, p.currency, settings.currency, rates);

  // The filter options are built from the payments themselves, so the pickers
  // only ever offer years, services and categories that actually occur.
  const historyYears = useMemo(() => {
    const years = new Set(payments.map((p) => p.date.slice(0, 4)));
    years.delete(String(today.getFullYear()));
    return Array.from(years).sort().reverse();
  }, [payments, todayISO]);

  const historyServices = useMemo(() => {
    const map = new Map();
    payments.forEach((p) => {
      if (!map.has(p.subId)) map.set(p.subId, { label: p.name, category: p.category });
    });
    return Array.from(map.entries())
      .map(([value, v]) => ({ value, label: v.label, category: v.category }))
      .sort((a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: "base" }));
  }, [payments]);

  const historyCategories = useMemo(() => {
    const present = new Set(payments.map((p) => p.category));
    return CATEGORIES.filter((c) => present.has(c.id));
  }, [payments, settings.language]);

  const filteredPayments = useMemo(() => {
    const currentYear = String(today.getFullYear());
    const from12 = new Date(today.getFullYear(), today.getMonth() - 11, 1);
    return payments.filter((p) => {
      if (historySub !== "all" && p.subId !== historySub) return false;
      if (historyCat !== "all" && p.category !== historyCat) return false;
      if (historyPeriod === "custom") {
        if (historyFrom && p.date < historyFrom) return false;
        if (historyTo && p.date > historyTo) return false;
        return true;
      }
      if (historyPeriod === "year") return p.date.startsWith(currentYear);
      if (historyPeriod === "12m") return parseLocalDate(p.date) >= from12;
      if (/^\d{4}$/.test(historyPeriod)) return p.date.startsWith(historyPeriod);
      return true;
    });
  }, [payments, historyPeriod, historySub, historyCat, historyFrom, historyTo, todayISO]);

  const historyFiltered = historyPeriod !== "all" || historySub !== "all" || historyCat !== "all";

  const historyPeriodLabel =
    historyPeriod === "year" ? t.historyPeriodYear
    : historyPeriod === "12m" ? t.historyPeriod12m
    : historyPeriod === "custom" ? t.historyPeriodCustom
    : historyPeriod === "all" ? t.historyTotalSpent
    : historyPeriod;

  const historyMonths = useMemo(() => {
    const map = new Map();
    filteredPayments.forEach((p) => {
      const key = p.date.slice(0, 7);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(p);
    });
    return Array.from(map.entries())
      .sort((a, b) => (a[0] < b[0] ? 1 : -1))
      .map(([key, items]) => ({
        key,
        monthDate: parseLocalDate(`${key}-01`),
        items: items.slice().sort((a, b) => (a.date < b.date ? 1 : -1)),
        total: items.reduce((sum, p) => sum + (p.status === "skipped" ? 0 : paymentInBase(p)), 0),
      }));
  }, [filteredPayments, settings.currency, rates]);

  // The history only ever renders one year at a time: after a few years of
  // tracking, drawing every month at once would make the tab heavy to scroll
  // and slow to paint. Older years are revealed on demand, one tap each.
  const historyYearList = useMemo(
    () => Array.from(new Set(historyMonths.map((m) => m.key.slice(0, 4)))).sort().reverse(),
    [historyMonths]
  );

  const visibleHistoryMonths = useMemo(() => {
    const shown = new Set(historyYearList.slice(0, historyShownYears));
    return historyMonths.filter((m) => shown.has(m.key.slice(0, 4)));
  }, [historyMonths, historyYearList, historyShownYears]);

  const nextOlderYear = historyYearList[historyShownYears];

  function pushToast(text) {
    const id = ++toastIdRef.current;
    setToasts((list) => [...list, { id, text }]);
    setTimeout(() => setToasts((list) => list.filter((x) => x.id !== id)), 2600);
  }

  // Revealing the next year can jump over years with nothing in them. Those
  // gaps are called out one notice each, so a two-year jump reads as two
  // distinct skips rather than one vague message.
  function revealOlderYear() {
    const oldestShown = historyYearList[historyShownYears - 1];
    const next = historyYearList[historyShownYears];
    if (!next) return;
    for (let y = Number(oldestShown) - 1; y > Number(next); y--) {
      pushToast(t.historyYearSkipped(String(y)));
    }
    setHistoryShownYears((n) => n + 1);
  }

  const historyTotals = useMemo(() => {
    let total = 0;
    let count = 0;
    filteredPayments.forEach((p) => {
      if (p.status === "skipped") return;
      total += paymentInBase(p);
      count++;
    });
    return { total, count };
  }, [filteredPayments, settings.currency, rates]);

  const missingStartCount = useMemo(
    () => (subs || []).filter((s) => !s.startDate && !s.endDate).length,
    [subs]
  );

  // Which payments a correction applies to. A price almost never changes for a
  // single month: it changes from a date onwards, or it was always wrong before
  // one. Restricted to the same subscription so nothing else is touched.
  function paymentsInScope(target, scope) {
    if (!target) return [];
    return payments.filter((p) => {
      if (p.subId !== target.subId) return false;
      if (scope === "before") return p.date <= target.date;
      if (scope === "after") return p.date >= target.date;
      return p.id === target.id;
    });
  }

  // The sync effect leaves existing rows alone, so a corrected amount is never
  // overwritten later.
  async function savePaymentAmount(target, raw, scope) {
    const value = parseAmount(raw);
    if (!(value > 0)) return;
    const ids = new Set(paymentsInScope(target, scope).map((p) => p.id));
    if (ids.size === 0) return;
    await persistPayments(
      payments.map((p) =>
        ids.has(p.id)
          ? {
              ...p,
              amount: value,
              baseCurrency: settings.currency,
              baseAmount: convertAmount(value, p.currency, settings.currency, rates),
              edited: true,
            }
          : p
      )
    );
  }

  useEffect(() => {
    setHistoryShownYears(1);
  }, [historyPeriod, historySub, historyCat, historyFrom, historyTo]);

  async function togglePaymentStatus(id) {
    await persistPayments(
      payments.map((p) => (p.id === id ? { ...p, status: p.status === "skipped" ? "paid" : "skipped" } : p))
    );
  }

  const calendarMonthDate = useMemo(() => new Date(today.getFullYear(), today.getMonth() + calendarOffset, 1), [calendarOffset]);

  const weekdayLabels = useMemo(() => {
    const base = new Date(2024, 0, 1);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(base);
      d.setDate(base.getDate() + i);
      return d.toLocaleDateString(locale, { weekday: "narrow" });
    });
  }, [locale]);

  function buildMonthView(offset) {
    const monthDate = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const days = [];
    for (let i = 0; i < startOffset; i++) days.push(null);
    for (let d = 1; d <= daysInMonth; d++) days.push(d);

    const byDay = {};
    // Built from every subscription rather than only the active ones: a service
    // cancelled in June was genuinely being billed in March, and a past month
    // should show it. Each occurrence is then filtered on its own date.
    enriched.forEach((s) => {
      const occs = occurrencesInMonth(s.renewalDate, s.frequency, monthDate, s.startDate);
      occs.forEach((occDate) => {
        if (s.endDate && occDate > parseLocalDate(s.endDate)) return;
        if (wasPausedOn(s, occDate)) return;
        // Subscriptions paused before pause dates were recorded have no periods
        // to check, so they are simply hidden from today onwards.
        if (s.paused && occDate >= today) return;
        const key = occDate.getDate();
        if (!byDay[key]) byDay[key] = [];
        byDay[key].push(s);
      });
    });

    let total = 0;
    let count = 0;
    const catMap = {};
    Object.values(byDay).forEach((arr) => {
      arr.forEach((s) => {
        const value = convertAmount(s.cost, s.currency || settings.currency, settings.currency, rates);
        total += value;
        count++;
        catMap[s.category] = (catMap[s.category] || 0) + value;
      });
    });
    const byCategory = CATEGORIES.map((c) => ({ ...c, total: catMap[c.id] || 0 }))
      .filter((c) => c.total > 0)
      .sort((a, b) => b.total - a.total);

    return { monthDate, days, byDay, stats: { total, count, byCategory } };
  }

  const monthViews = useMemo(
    () => ({
      prev: buildMonthView(calendarOffset - 1),
      current: buildMonthView(calendarOffset),
      next: buildMonthView(calendarOffset + 1),
    }),
    [calendarOffset, enriched, rates, settings.currency, todayISO]
  );
  const renewalsByDay = monthViews.current.byDay;
  const calendarMonthStats = monthViews.current.stats;

  function resetCalendarDrag() {
    setCalendarTouchStartX(null);
    setCalendarTouchStartY(null);
    setCalendarAxis(null);
    setCalendarDragOffset(0);
    setIsDraggingCalendar(false);
  }

  function handleCalendarTouchStart(e) {
    if (slideDirection !== 0) return;
    setCalendarTouchStartX(e.touches[0].clientX);
    setCalendarTouchStartY(e.touches[0].clientY);
    setCalendarAxis(null);
    setCalendarDragOffset(0);
  }

  function handleCalendarTouchMove(e) {
    if (calendarTouchStartX === null) return;
    const dx = e.touches[0].clientX - calendarTouchStartX;
    const dy = e.touches[0].clientY - calendarTouchStartY;

    // Lock the gesture to one axis after a small movement, so a diagonal or
    // vertical swipe scrolls the page instead of half-dragging the calendar.
    let axis = calendarAxis;
    if (!axis) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      setCalendarAxis(axis);
      if (axis === "x") setIsDraggingCalendar(true);
    }
    if (axis !== "x") return;
    setCalendarDragOffset(dx);
  }

  function handleCalendarTouchEnd() {
    if (calendarTouchStartX === null) return;
    const threshold = 50;
    const dir = calendarAxis === "x" && calendarDragOffset < -threshold ? 1 : calendarAxis === "x" && calendarDragOffset > threshold ? -1 : 0;
    resetCalendarDrag();
    if (dir !== 0) setSlideDirection(dir);
  }

  useEffect(() => {
    if (slideDirection === 0) return;
    const timer = setTimeout(() => {
      setNoTransition(true);
      setCalendarOffset((prev) => prev + slideDirection);
      setSelectedDay(null);
      setSlideDirection(0);
    }, 300);
    return () => clearTimeout(timer);
  }, [slideDirection]);

  useEffect(() => {
    if (!noTransition) return;
    const raf = requestAnimationFrame(() => setNoTransition(false));
    return () => cancelAnimationFrame(raf);

  function jumpToMonth(year, monthIndex) {

  // Closing a sheet waits for its exit animation before unmounting it.
  function closeSheet(key, apply) {
    if (closingRef.current === key) return;
    if (closingRef.current) {
      // Another sheet is still animating out: apply immediately rather than
      // dropping this dismissal on the floor.
      apply();
      return;
    }
    closingRef.current = key;
    setClosingSheet(key);
    setTimeout(() => {
      apply();
      closingRef.current = null;
      setClosingSheet(null);
    }, 240);

      setNotifTest(t.notifUnsupported);

    let permission = Notification.permission;
    if (permission === "default") permission = await Notification.requestPermission();
    if (permission !== "granted") {
      setNotifTest(t.notifDenied);
      return;
    }
    const ok = await showNotification(t.appName, {
      body: t.notifTestBody,
      icon: "icons/icon-192.png",
      tag: "hubbo-test",

    setNotifTest(ok ? t.notifTestSent : t.notifTestFailed);

    if (next === view) return;

    viewScrollRef.current[view] = window.scrollY || window.pageYOffset || 0;
    // The slide follows the tab order, so moving right always slides left.
    setViewDirection(VIEW_ORDER.indexOf(next) > VIEW_ORDER.indexOf(view) ? "left" : "right");

      ["trash", showTrash, () => setShowTrash(false)],
      ["paywall", showPaywall, () => setShowPaywall(false)],
      ["settings", showSettings, () => setShowSettings(false)],
    ];

    for (const [key, open, apply, immediate] of layers) {
      if (!open || busy === key) continue;
      if (immediate) apply();
      else closeSheet(key, apply);
      return true;
