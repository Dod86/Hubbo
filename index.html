        const cancelImport = () => closeSheet("import", () => { setPendingImport(null); setImportSelection(null); });
        return (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[60] ${closingSheet === "import" ? "rb-overlay-out" : "rb-overlay"}`} onClick={cancelImport}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 max-h-[80vh] overflow-y-auto ${closingSheet === "import" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.importConfirmTitle}</h2>

            {/* L'avviso più importante del foglio: prima ancora di dire cosa
                contiene il file, dice cosa sparisce. Un'importazione non era
                mai stata un'azione distruttiva finché non lo è diventata con
                questo cambio di modello, e il colore deve dirlo a colpo
                d'occhio, non solo il testo. */}
            {hasSomethingToLose && (
              <div style={{ background: `${ACCENT.danger}14`, border: `1px solid ${ACCENT.danger}55`, color: legibleOn(ACCENT.danger, colors.surface) }} className="rounded-xl px-3.5 py-3 mb-3 text-xs leading-relaxed">
                {t.importOverwriteWarning}
              </div>
            )}

            {needsSelection ? (
              <>
                <p style={{ color: colors.textSecondary }} className="text-sm mb-3">
                  {t.importSelectBody(tutti.length, posti)}
                </p>
                <div style={{ color: colors.textFaint }} className="text-xs mb-2">
                  {t.importSelectCounter(selectedCount, posti)}
                </div>
                <div className="flex flex-col gap-1.5 mb-4">
                  {tutti.map((s) => {
                    const active = importSelection.has(s.id);
                    const atCap = !active && selectedCount >= posti;
                    const cat = CATEGORIES.find((c) => c.id === s.category) || CATEGORIES[CATEGORIES.length - 1];
                    return (
                      <button
                        key={s.id}
                        type="button"
                        disabled={atCap}
                        onClick={() =>
                          setImportSelection((prev) => {
                            const next = new Set(prev);
                            if (next.has(s.id)) next.delete(s.id);
                            else if (next.size < posti) next.add(s.id);
                            return next;
                          })
                        }
                        style={{ background: colors.surface2, border: `1px solid ${colors.border}`, opacity: atCap ? 0.45 : 1 }}
                        className="rounded-xl px-3 py-2.5 flex items-center gap-2.5 text-left"
                      >
                        <span
                          style={{
                            background: active ? ACCENT.amber : "transparent",
                            border: `1.5px solid ${active ? ACCENT.amber : colors.textFaint}`,
                          }}
                          className="w-4 h-4 rounded-md flex-shrink-0 flex items-center justify-center"
                        >
                          {active && <Icon name="check" size={11} color={INK} strokeWidth={3} />}
                        </span>
                        <ServiceLogo icon={serviceIcon(s.name)} domain={serviceDomain(s.name)} category={s.category} letter={s.name.charAt(0).toUpperCase()} serviceName={s.name} color={cat.color} size={26} />
                        <span className="flex-1 min-w-0 truncate text-sm">{s.name}</span>
                        <span style={{ fontFamily: "'JetBrains Mono', monospace", color: colors.textSecondary }} className="text-xs flex-shrink-0">
                          {money(s.cost, s.currency)}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </>
            ) : (
              <p style={{ color: colors.textSecondary }} className="text-sm mb-2">
                {t.importConfirmBody(pendingImport.subscriptions.length)}
              </p>
            )}

            {pendingImport.appVersion && (
              <p style={{ color: colors.textFaint }} className="text-xs mb-3">{t.importFromVersion(pendingImport.appVersion)}</p>
            )}
            {pendingImport.settings && (
              <button
                type="button"
                onClick={() => setImportIncludeSettings((v) => !v)}
                style={{ background: colors.surface2, border: `1px solid ${colors.border}` }}
                className="w-full rounded-xl px-3.5 py-3 mb-4 flex items-center gap-3 text-left"
              >
                <span
                  style={{
                    background: importIncludeSettings ? ACCENT.amber : "transparent",
                    border: `1.5px solid ${importIncludeSettings ? ACCENT.amber : colors.textFaint}`,
                  }}
                  className="w-4 h-4 rounded-md flex-shrink-0 flex items-center justify-center"
                >
                  {importIncludeSettings && <Icon name="check" size={11} color={INK} strokeWidth={3} />}
                </span>
                <span className="min-w-0">
                  <span className="text-sm font-medium block">{t.importIncludeSettings}</span>
                  <span style={{ color: colors.textFaint }} className="text-xs block mt-0.5">{t.importIncludeSettingsHint}</span>
                </span>
              </button>
            )}
            <button
              type="button"
              disabled={!canConfirm}
              onClick={confirmImport}
              style={{ background: ACCENT.danger, color: "#1A0F0B", opacity: canConfirm ? 1 : 0.4 }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.importConfirmYes}
            </button>
            <button
              type="button"
              onClick={cancelImport}
              style={{ color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm"
            >
              {t.confirmDeleteNo}
            </button>
          </div>
        </div>
        );
      })()}

      {/* Trash modal */}
      {/* Category colours */}
      {showColors && (
        <div
          style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }}
          className={`fixed inset-0 flex items-end z-[70] ${closingSheet === "colors" ? "rb-overlay-out" : "rb-overlay"}`}
          onClick={() => closeSheet("colors", () => { setShowColors(false); setColorEditing(null); })}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            {...colorsDrag.handlers}
            ref={colorsDrag.ref}
            style={{ background: colors.surface, border: `1px solid ${colors.border}`, overscrollBehavior: "contain", ...colorsDrag.style }}
            className={`w-full rounded-t-3xl px-5 pt-2 pb-8 max-h-[85vh] overflow-y-auto ${closingSheet === "colors" ? "rb-sheet-out" : "rb-sheet"}`}
          >
            <SheetHandle colors={colors} />
            <div className="flex items-center justify-between mb-4 gap-2">
              <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium truncate">
                {colorEditing
                  ? (CATEGORIES.find((c) => c.id === colorEditing) || {}).label
                  : t.categoryColors}
              </h2>
              <button
                type="button"
                onClick={() =>
                  colorEditing
                    ? setColorEditing(null)
                    : closeSheet("colors", () => { setShowColors(false); setColorEditing(null); })
                }
                style={{ color: colors.textSecondary }}
              >
                {colorEditing ? <span className="text-sm font-medium">{t.back}</span> : <Icon name="x" size={20} />}
              </button>
            </div>

            {colorEditing ? (
              <>
                <div className="grid grid-cols-6 gap-2.5 mb-4">
                  {CATEGORY_PALETTE.map((hex) => {
                    const current = (CATEGORIES.find((c) => c.id === colorEditing) || {}).color;
                    const norm = (v) => String(v || "").trim().toLowerCase();
                    const active = norm(current) === norm(hex);
                    return (
                      <button
                        key={hex}
                        type="button"
                        onClick={() => {
                          if (current === hex) return;
                          const owner = CATEGORIES.find((c) => c.id !== colorEditing && norm(c.color) === norm(hex));
                          if (owner) {
                            setColorSwap({ target: colorEditing, hex, ownerId: owner.id, ownerLabel: owner.label, previous: current });
                            return;
                          }
                          applyCategoryColor({ [colorEditing]: hex });
                        }}
                        style={{
                          background: hex,
                          border: `2px solid ${active ? colors.textPrimary : "transparent"}`,
                          aspectRatio: "1",
                        }}
                        className="rounded-full w-full"
                        aria-label={hex}
                      />
                    );
                  })}
                </div>
                <button
                  type="button"
                  onClick={() => {
                    const target = CATEGORIES.find((c) => c.id === colorEditing);
                    if (!target) return;
                    const defaultHex = (CATEGORY_META.find((c) => c.id === colorEditing) || {}).color;
                    const norm = (v) => String(v || "").trim().toLowerCase();
                    const owner = CATEGORIES.find((c) => c.id !== colorEditing && norm(c.color) === norm(defaultHex));
                    if (owner) {
                      setColorSwap({ target: colorEditing, hex: defaultHex, ownerId: owner.id, ownerLabel: owner.label, previous: target.color });
                      return;
                    }
                    applyCategoryColor({ [colorEditing]: null });
                  }}
                  style={{ border: `1px solid ${colors.border}`, color: colors.textSecondary }}
                  className="w-full rounded-xl py-2.5 text-sm font-medium"
                >
                  {t.colorReset}
                </button>
              </>
            ) : (
              <>
                <p style={{ color: colors.textFaint }} className="text-xs mb-3 leading-relaxed">{t.categoryColorsHint}</p>
                {Object.keys(settings.categoryColors || {}).length > 0 && (
                  <button
                    type="button"
                    onClick={() => persistSettings({ ...settings, categoryColors: {} })}
                    style={{ border: `1px solid ${colors.border}`, color: colors.textSecondary }}
                    className="w-full rounded-xl py-2.5 text-sm font-medium mb-3"
                  >
                    {t.colorResetAll}
                  </button>
                )}
                <div style={{ background: colors.surface2, border: `1px solid ${colors.border}` }} className="rounded-xl overflow-hidden">
                  {CATEGORIES.map((c, idx) => (
                    <button
                      key={c.id}
                      type="button"
                      onClick={() => setColorEditing(c.id)}
                      style={idx > 0 ? { borderTop: `1px solid ${colors.border}` } : undefined}
                      className="w-full px-3.5 py-3 flex items-center gap-3 text-left"
                    >
                      <span style={{ background: c.color, width: 18, height: 18, borderRadius: 999 }} className="flex-shrink-0" />
                      <span className="flex-1 truncate text-sm">{c.label}</span>
                      {(settings.categoryColors || {})[c.id] && (
                        <span style={{ color: colors.textFaint }} className="text-xs">{t.colorCustom}</span>
                      )}
                    </button>
                  ))}
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {showTrash && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-50 ${closingSheet === "trash" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("trash", () => setShowTrash(false))}>
          <div
            onClick={(e) => e.stopPropagation()}
            {...trashDrag.handlers}
            ref={trashDrag.ref}
            style={{ background: colors.surface, border: `1px solid ${colors.border}`, overscrollBehavior: "contain", ...trashDrag.style }}
            className={`w-full rounded-t-3xl px-5 pt-2 pb-8 max-h-[85vh] overflow-y-auto ${closingSheet === "trash" ? "rb-sheet-out" : "rb-sheet"}`}
          >
            <SheetHandle colors={colors} />
            <div className="flex items-center justify-between mb-4">
              <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium">{t.trash}</h2>
              <button type="button" onClick={() => closeSheet("trash", () => setShowTrash(false))} style={{ color: colors.textSecondary }}>
                <Icon name="x" size={20} />
              </button>
            </div>

            {trash.length === 0 ? (
              <p style={{ color: colors.textSecondary }} className="text-sm text-center py-8">{t.trashEmpty}</p>
            ) : (
              <>
                <p style={{ color: colors.textFaint }} className="text-xs mb-3">{t.trashHint}</p>
                <div className="flex flex-col gap-2 mb-4">
                  {trash.map((s) => {
                    const cat = CATEGORIES.find((c) => c.id === s.category) || CATEGORIES[CATEGORIES.length - 1];
                    const icon = serviceIcon(s.name);
                    return (
                      <div key={s.id} style={{ background: colors.surface2, border: `1px solid ${colors.border}` }} className="rounded-xl p-3">
                        <div className="flex items-center gap-2.5 mb-2">
                          <ServiceLogo icon={icon} domain={serviceDomain(s.name)} category={s.category} letter={s.name.charAt(0).toUpperCase()} serviceName={s.name} color={cat.color} size={26} />
                          <div className="flex-1 min-w-0">
                            <div className="text-sm font-medium truncate">{s.name}</div>
                            <div style={{ color: colors.textFaint }} className="text-xs">
                              {t.deletedOn} {dateFmt(s.deletedAt)}
                            </div>
                          </div>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-sm font-semibold">{money(costOn(s, todayISO), s.currency)}</span>
                        </div>
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => handleRestore(s.id)}
                            style={{ background: ACCENT.terracotta, color: INK }}
                            className="flex-1 rounded-lg py-2 text-xs font-medium"
                          >
                            {t.restore}
                          </button>
                          <button
                            type="button"
                            onClick={() => setConfirmPurge(s)}
                            style={{ color: ACCENT.danger, border: `1px solid ${colors.border}` }}
                            className="flex-1 rounded-lg py-2 text-xs font-medium"
                          >
                            {t.deleteForever}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <button
                  type="button"
                  onClick={() => setConfirmPurge("all")}
                  style={{ color: ACCENT.danger, border: `1px solid ${colors.border}` }}
                  className="w-full rounded-xl py-2.5 text-sm font-medium"
                >
                  {t.emptyTrash}
                </button>
              </>
            )}
          </div>
        </div>
      )}

      {/* Subscription detail sheet */}
      {detailSub && (() => {
        const s = enriched.find((x) => x.id === detailSub.id) || detailSub;
        const cat = CATEGORIES.find((c) => c.id === s.category) || CATEGORIES[CATEGORIES.length - 1];
        const icon = serviceIcon(s.name);
        const brandColor = (icon && BRAND_COLORS[icon]) || SERVICE_COLORS[s.name] || cat.color;
        const priceNow = costOn(s, todayISO);
        const monthly = monthlyEquivalent(priceNow, s.frequency);
        const yearly = monthly * 12;
        // Quanto è costato davvero da sempre: la somma dei pagamenti
        // realmente registrati per questo servizio, non una proiezione dal
        // prezzo attuale — un abbonamento con più prezzi nel tempo non
        // sarebbe raccontato bene moltiplicando quello di oggi per la durata.
        // "Non pagato" non conta, come nei totali dello Storico.
        const everPaid = payments.filter((p) => p.subId === s.id && p.status !== "skipped");
        const allTimeTotal = everPaid.reduce((sum, p) => sum + paymentInBase(p), 0);
        const allTimeSince = everPaid.length > 0
          ? everPaid.reduce((min, p) => (p.date < min ? p.date : min), everPaid[0].date)
          : s.startDate;
        return (
          <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-50 ${closingSheet === "detail" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("detail", () => setDetailSub(null))}>
            <div
              onClick={(e) => e.stopPropagation()}
              {...detailDrag.handlers}
              ref={detailDrag.ref}
              style={{ background: colors.surface, border: `1px solid ${colors.border}`, overscrollBehavior: "contain", ...detailDrag.style }}
              className={`w-full rounded-t-3xl px-5 pt-2 pb-8 max-h-[85vh] overflow-y-auto ${closingSheet === "detail" ? "rb-sheet-out" : "rb-sheet"}`}
            >
              <SheetHandle colors={colors} />
              <div className="flex items-start justify-between mb-4">
                <div className="flex items-center gap-3 min-w-0">
                  <div className="relative flex-shrink-0 w-[52px] h-[52px] flex items-center justify-center">
                    <RingIcon progress={s.progress} ringColor={brandColor} ended={s.isEnded || s.paused} colors={colors} />
                    <div className="absolute inset-0 flex items-center justify-center">
                      <ServiceLogo icon={icon} domain={serviceDomain(s.name)} category={s.category} letter={s.name.charAt(0).toUpperCase()} serviceName={s.name} color={cat.color} size={30} />
                    </div>
                  </div>
                  <div className="min-w-0">
                    <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium truncate">{s.name}</h2>
                    <div style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-sm font-semibold">
                      {money(costOn(s, todayISO), s.currency)}
                      <span style={{ color: colors.textFaint }} className="font-normal text-xs">{t.freqShort[s.frequency] || t.perMonthShort}</span>
                    </div>
                  </div>
                </div>
                <button type="button" onClick={() => closeSheet("detail", () => setDetailSub(null))} style={{ color: colors.textSecondary }} className="flex-shrink-0 p-1">
                  <Icon name="x" size={20} />
                </button>
              </div>

              {(() => {
                const { hist, first, last, unchanged, pct: totalPct } = totalPriceChangePct(s, payments, todayISO);
                if (hist.length === 0) return null;
                const up = totalPct > 0;
                return (
                  <div style={{ background: colors.surface2, border: `1px solid ${colors.border}` }} className="rounded-xl px-3.5 py-3 mb-3">
                    <div className="mb-3">
                      <span style={{ color: colors.textSecondary }} className="text-sm font-medium">{t.priceHistoryTitle}</span>
                      <div className="flex items-baseline gap-1.5 mt-1">
                        {unchanged ? (
                          <span style={{ color: colors.textSecondary }} className="text-base font-bold">
                            {t.priceUnchanged}
                          </span>
                        ) : (
                          <>
                            <span
                              style={{ color: totalPct === 0 ? colors.textSecondary : up ? ACCENT.amber : "#4CAF7D" }}
                              className="text-base font-bold whitespace-nowrap"
                            >
                              {totalPct === 0 ? "" : up ? "⬆ " : "⬇ "}{totalPct > 0 ? "+" : ""}{totalPct}%
                            </span>
                            {first.date && (
                              <span style={{ color: colors.textFaint }} className="text-xs truncate">
                                {t.priceSinceFirst(dateFmt(first.date))}
                              </span>
                            )}
                          </>
                        )}
                      </div>
                    </div>
                    <div className="flex flex-col gap-2">
                      {hist.slice().reverse().map((entry, idx, list) => {
                        // Each row is compared with the price that preceded it.
                        const previous = list[idx + 1];
                        // No percentage across the edge of an offer: the step
                        // from the discount to the ordinary price was agreed in
                        // advance and is labelled instead.
                        const acrossOffer = !!previous && previous.promo !== entry.promo;
                        const pct = previous && previous.cost > 0 && !acrossOffer
                          ? Math.round(((entry.cost - previous.cost) / previous.cost) * 100)
                          : null;
                        return (
                          <div key={`${entry.date}-${idx}`} className="flex items-center justify-between gap-2">
                            <span style={{ color: colors.textSecondary }} className="text-sm truncate">
                              {entry.date ? t.priceFrom(dateFmt(entry.date)) : t.priceCurrent}
                              {entry.promo && <span style={{ color: ACCENT.amber }}> · {t.promoTag}</span>}
                            </span>
                            <span className="flex items-center gap-2 whitespace-nowrap flex-shrink-0">
                              <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-sm font-semibold">
                                {money(entry.cost, entry.currency || s.currency)}
                              </span>
                              {pct !== null && pct !== 0 && (
                                <span style={{ color: pct > 0 ? ACCENT.amber : "#4CAF7D" }} className="text-sm font-bold">
                                  {pct > 0 ? "+" : ""}{pct}%
                                </span>
                              )}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })()}

              <div style={{ background: colors.surface2, border: `1px solid ${colors.border}` }} className="rounded-xl divide-y mb-3" >
                <div className="flex items-center justify-between px-3.5 py-2.5">
                  <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailRenewal}</span>
                  <span style={{ color: (s.isEnded || s.paused) ? colors.textFaint : colors.textPrimary }} className="text-xs font-medium">
                    {(s.isEnded || s.paused) ? `${t.endedOn} ${dateFmt(terminatedSince(s))}` : `${dateFmt(toLocalISO(s.renewal))} · ${s.daysLeft === 0 ? t.todayWord : s.daysLeft === 1 ? t.tomorrowWord : t.inDays(s.daysLeft)}`}
                  </span>
                </div>
                <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                  <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailCategory}</span>
                  <span className="text-xs font-medium flex items-center gap-1.5">
                    <span style={{ background: cat.color, width: 8, height: 8, borderRadius: 999 }} />
                    {cat.label}
                  </span>
                </div>
                <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                  <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailMonthly}</span>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-xs font-medium">{money(monthly, s.currency)}</span>
                </div>
                <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                  <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailYearly}</span>
                  <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-xs font-medium">{money(yearly, s.currency)}</span>
                </div>
                {everPaid.length > 0 && (
                  <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                    <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailAllTime}</span>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace" }} className="text-xs font-medium">
                      {t.detailAllTimeSince(
                        money(allTimeTotal, settings.currency),
                        allTimeSince ? parseLocalDate(allTimeSince).toLocaleDateString(locale, { month: "long", year: "numeric" }) : ""
                      )}
                    </span>
                  </div>
                )}
                {s.sharedTotalCost != null && (
                  <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                    <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailShared}</span>
                    <span className="text-xs font-medium">{t.sharedInfo(money(s.sharedTotalCost, s.currency), s.sharedPeople)}</span>
                  </div>
                )}
                {s.endDate && !s.isEnded && !s.paused && (
                  <div className="flex items-center justify-between px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                    <span style={{ color: colors.textSecondary }} className="text-xs">{t.detailEndDate}</span>
                    <span className="text-xs font-medium">{dateFmt(s.endDate)}</span>
                  </div>
                )}
                {s.note && (
                  <div className="px-3.5 py-2.5" style={{ borderTop: `1px solid ${colors.border}` }}>
                    <div style={{ color: colors.textSecondary }} className="text-xs mb-1">{t.detailNote}</div>
                    <div className="text-xs italic">{s.note}</div>
                  </div>
                )}
              </div>

              {!(s.isEnded || s.paused) && (
                <a
                  href={cancelSearchUrl(s.name, settings.language)}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{ background: colors.surface2, border: `1px solid ${colors.border}`, color: colors.textPrimary }}
                  className="w-full rounded-xl py-2.5 text-sm font-medium flex items-center justify-center gap-2 mb-4"
                >
                  {t.howToCancel}
                  <Icon name="externalLink" size={13} />
                </a>
              )}

              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => closeSheet("detail", () => { setDetailSub(null); openEdit(s); })}
                  style={{ background: colors.surface2, border: `1px solid ${colors.border}`, color: colors.textPrimary }}
                  className="flex-1 rounded-xl py-2.5 text-xs font-medium flex items-center justify-center gap-1.5"
                >
                  <Icon name="pencil" size={14} />
                  {t.edit}
                </button>
                {/* Prima restava nascosto per un isEnded (data di fine):
                    niente per riattivarlo. Ora è sempre presente — un
                    terminato, in pausa o con data che sia, deve poter
                    tornare attivo, richiesto da Erny il 10 settembre. */}
                <button
                  type="button"
                  onClick={() => handleTogglePause(s.id)}
                  style={{ background: colors.surface2, border: `1px solid ${colors.border}`, color: (s.paused || s.isEnded) ? ACCENT.amber : colors.textPrimary }}
                  className="flex-1 rounded-xl py-2.5 text-xs font-medium flex items-center justify-center gap-1.5"
                >
                  {(s.paused || s.isEnded) ? <Icon name="play" size={14} /> : <Icon name="pause" size={14} />}
                  {(s.paused || s.isEnded) ? t.resumeAction : t.pauseAction}
                </button>
                <button
                  type="button"
                  onClick={() => closeSheet("detail", () => { setDetailSub(null); setConfirmDelete(s); })}
                  style={{ background: colors.surface2, border: `1px solid ${colors.border}`, color: ACCENT.danger }}
                  className="flex-1 rounded-xl py-2.5 text-xs font-medium flex items-center justify-center gap-1.5"
                >
                  <Icon name="trash2" size={14} />
                  {t.deleteAction}
                </button>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Confirm delete (move to trash) */}
      {confirmDelete && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[60] ${closingSheet === "cdel" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("cdel", () => setConfirmDelete(null))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "cdel" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.confirmDeleteTitle}</h2>
            <p style={{ color: colors.textSecondary }} className="text-sm mb-5">{t.confirmDeleteBody(confirmDelete.name)}</p>
            <button
              type="button"
              onClick={() => handleDelete(confirmDelete.id)}
              style={{ background: ACCENT.danger, color: "#1A0F0B" }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.confirmDeleteYes}
            </button>
            <button
              type="button"
              onClick={() => closeSheet("cdel", () => setConfirmDelete(null))}
              style={{ color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm"
            >
              {t.confirmDeleteNo}
            </button>
          </div>
        </div>
      )}

      {/* Confirm permanent delete */}
      {colorSwap && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[80] ${closingSheet === "cswap" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("cswap", () => setColorSwap(null))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "cswap" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.colorSwapTitle}</h2>
            <p style={{ color: colors.textSecondary }} className="text-sm mb-3">{t.colorSwapBody(colorSwap.ownerLabel)}</p>

            <div className="flex items-center justify-center gap-3 mb-4">
              <span style={{ background: colorSwap.previous, width: 26, height: 26, borderRadius: 999 }} />
              <span style={{ color: colors.textFaint }} className="text-sm">⇄</span>
              <span style={{ background: colorSwap.hex, width: 26, height: 26, borderRadius: 999 }} />
            </div>

            <button
              type="button"
              onClick={() => {
                applyCategoryColor({ [colorSwap.target]: colorSwap.hex, [colorSwap.ownerId]: colorSwap.previous });
                closeSheet("cswap", () => setColorSwap(null));
              }}
              style={{ background: ACCENT.amber, color: INK }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.colorSwapYes}
            </button>
            <button
              type="button"
              onClick={() => {
                applyCategoryColor({ [colorSwap.target]: colorSwap.hex });
                closeSheet("cswap", () => setColorSwap(null));
              }}
              style={{ border: `1px solid ${colors.border}`, color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm font-medium mb-2"
            >
              {t.colorSwapNo}
            </button>
            <p style={{ color: colors.textFaint }} className="text-xs text-center leading-relaxed">{t.colorSwapNote}</p>
          </div>
        </div>
      )}

      {wipeHistoryPrompt && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[70] ${closingSheet === "wipehist" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("wipehist", () => setWipeHistoryPrompt(null))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "wipehist" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.wipeHistoryTitle}</h2>
            <p style={{ color: colors.textSecondary }} className="text-sm mb-5">
              {t.wipeHistoryBody(wipeHistoryPrompt.name)}
            </p>
            <button
              type="button"
              onClick={async () => {
                await togglePaymentStatus(wipeHistoryPrompt.id);
                setWipeHistoryPrompt(null);
                closeSheet("payment", () => setPaymentAction(null));
              }}
              style={{ background: ACCENT.amber, color: INK }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.wipeHistoryMarkOnly}
            </button>
            <button
              type="button"
              onClick={async () => {
                await wipeServiceHistory(wipeHistoryPrompt.subId);
                setWipeHistoryPrompt(null);
                closeSheet("payment", () => setPaymentAction(null));
              }}
              style={{ background: ACCENT.danger, color: "#1A0F0B" }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.wipeHistoryDeleteAll}
            </button>
            <button
              type="button"
              onClick={() => closeSheet("wipehist", () => setWipeHistoryPrompt(null))}
              style={{ color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm"
            >
              {t.confirmDeleteNo}
            </button>
          </div>
        </div>
      )}

      {confirmPurge && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[60] ${closingSheet === "cpurge" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("cpurge", () => setConfirmPurge(null))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "cpurge" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.confirmPurgeTitle}</h2>
            <p style={{ color: colors.textSecondary }} className="text-sm mb-5">
              {confirmPurge === "all" ? t.confirmPurgeAllBody : t.confirmPurgeBody(confirmPurge.name)}
            </p>
            <button
              type="button"
              onClick={() => (confirmPurge === "all" ? handlePurgeAll() : handlePurge(confirmPurge.id))}
              style={{ background: ACCENT.danger, color: "#1A0F0B" }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.confirmPurgeYes}
            </button>
            <button
              type="button"
              onClick={() => closeSheet("cpurge", () => setConfirmPurge(null))}
              style={{ color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm"
            >
              {t.confirmDeleteNo}
            </button>
          </div>
        </div>
      )}

      {confirmDeleteAll && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-[60] ${closingSheet === "cdelall" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("cdelall", () => setConfirmDeleteAll(false))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "cdelall" ? "rb-dialog-out" : "rb-dialog"}`}>
            <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.deleteAllData}</h2>
            <p style={{ color: colors.textSecondary }} className="text-sm mb-5">{t.deleteAllDataConfirm}</p>
            <button
              type="button"
              onClick={() => { setConfirmDeleteAll(false); handleDeleteAllData(); }}
              style={{ background: ACCENT.danger, color: "#1A0F0B" }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.confirmPurgeYes}
            </button>
            <button
              type="button"
              onClick={() => closeSheet("cdelall", () => setConfirmDeleteAll(false))}
              style={{ color: colors.textSecondary }}
              className="w-full rounded-xl py-2.5 text-sm"
            >
              {t.confirmDeleteNo}
            </button>
          </div>
        </div>
      )}

      {/* Paywall modal */}
      {showPaywall && (
        <div style={{ background: colors.overlay, backdropFilter: "blur(6px)", WebkitBackdropFilter: "blur(6px)" }} className={`fixed inset-0 flex items-end z-50 ${closingSheet === "paywall" ? "rb-overlay-out" : "rb-overlay"}`} onClick={() => closeSheet("paywall", () => setShowPaywall(false))}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: colors.surface, border: `1px solid ${colors.border}` }} className={`w-full rounded-t-3xl p-5 pb-8 ${closingSheet === "paywall" ? "rb-dialog-out" : "rb-dialog"}`}>
            <div className="flex flex-col items-center text-center mb-5 mt-2">
              <div style={{ background: "rgba(227,168,87,0.15)" }} className="w-14 h-14 rounded-full flex items-center justify-center mb-3">
                <Icon name="lock" size={22} color={ACCENT.amber} />
              </div>
              <h2 style={{ fontFamily: "'Fraunces', serif" }} className="text-lg font-medium mb-2">{t.paywallTitle}</h2>
              <p style={{ color: colors.textSecondary }} className="text-sm leading-relaxed">{t.paywallBody(FREE_LIMIT)}</p>
            </div>
            <button
              type="button"
              onClick={() => closeSheet("paywall", () => setShowPaywall(false))}
              style={{ background: ACCENT.amber, color: INK }}
              className="w-full rounded-xl py-3 text-sm font-semibold mb-2.5"
            >
              {t.upgrade}
            </button>
            <button type="button" onClick={() => closeSheet("paywall", () => setShowPaywall(false))} style={{ color: colors.textSecondary }} className="w-full rounded-xl py-2.5 text-sm">
              {t.maybeLater}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><HubboApp /></ErrorBoundary>);
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      // Check for a newer build every time the app is opened or resumed.
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
      reg.addEventListener("updatefound", () => {
        const fresh = reg.installing;
        if (!fresh) return;
        fresh.addEventListener("statechange", () => {
          if (fresh.state === "installed" && navigator.serviceWorker.controller) {
            fresh.postMessage("skipWaiting");
          }
        });
      });
    }).catch(() => {});

    // When the new worker takes over, reload once so the fresh build is shown.
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (reloaded) return;
      reloaded = true;
      window.location.reload();
    });
  });
}
</script>
