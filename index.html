<script>
// Back-button plumbing lives outside React so it is attached before the app
// mounts and can never be torn down by a re-render. React only supplies the
// handler that decides what the current top layer is.
window.__hubboBack = { handler: null, count: 0, lastEvent: "-", depth: 0 };
(function () {
  var GUARD = "#v";
  var TARGET = 4;      // spare history entries kept in reserve
  var depth = 0;       // how many we believe are still on the stack
  var lastAt = 0;

  function pushGuard() {
    try {
      window.history.pushState({ rb: Date.now() }, "", GUARD);
      depth++;
      window.__hubboBack.depth = depth;
    } catch (e) {
      /* history unavailable */
    }
  }

  function topUp() {
    // A single hardware Back can consume more than one entry on some Android
    // builds, so a small buffer is kept rather than a single guard.
    var tries = 0;
    while (depth < TARGET && tries < TARGET + 2) {
      pushGuard();
      tries++;
    }
  }

  function onBack(evt) {
    // One physical Back fires both popstate and hashchange; treat them as one.
    var now = Date.now();
    if (now - lastAt < 350) return;
    lastAt = now;

    depth = Math.max(0, depth - 1);
    window.__hubboBack.count++;
    window.__hubboBack.lastEvent = evt && evt.type ? evt.type : "?";
    window.__hubboBack.depth = depth;

    try {
      if (window.__hubboBack.handler) window.__hubboBack.handler();
    } catch (e) {
      /* ignore */
    }

    // Refill once the browser has finished the navigation.
    setTimeout(topUp, 0);
  }

  topUp();
  window.addEventListener("popstate", onBack);
  window.addEventListener("hashchange", onBack);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") setTimeout(topUp, 0);
  });
})();
</script>

<script>
if (!window.storage) {
  const PREFIX = "hubbo_store_";
  window.storage = {
    async get(key) { const raw = localStorage.getItem(PREFIX + key); if (raw === null) throw new Error("Key not found: " + key); return { key, value: raw, shared: false }; },
    async set(key, value) { localStorage.setItem(PREFIX + key, value); return { key, value, shared: false }; },
    async delete(key) { localStorage.removeItem(PREFIX + key); return { key, deleted: true, shared: false }; },
    async list(prefix) { const p = PREFIX + (prefix || ""); return { keys: Object.keys(localStorage).filter(k => k.startsWith(p)).map(k => k.slice(PREFIX.length)) }; },
  };
}
</script>

// The open ring is the mark of the app, and it appears in three places: the
// wordmark, the add button and the spending ring. They have to be the same
// shape, so the arc is a single number and the point it ends on is worked out
// from it rather than typed in. Two thirds of a turn — 240° — leaves the gap
// at the top left, where the total sits.
const RING_SWEEP = 2 / 3;

// Stesse misure in tutti i punti dove l'anello compare accanto alla
// legenda — anello reso il più grande possibile lasciando comunque spazio
// leggibile alla legenda a destra, richiesto da Erny il 12 settembre.
// Margine del contenitore asimmetrico, non più uguale sui quattro lati:
// il raggio esterno dell'anello a riposo (ro) coincide per costruzione
// esattamente con metà della dimensione del proprio SVG — nessun margine
// di natura. Un primo tentativo (v157) allargava solo il margine e
// lasciava la fetta scelta crescere di 2px verso l'esterno: non bastava,
// segnalato di nuovo da Erny il 12 settembre con un secondo screenshot.
// Corretto alla radice in CategoryRing: la fetta scelta ora si ispessisce
// verso il centro dell'anello, mai più verso il bordo — `ro` non cambia
// mai, per nessuna fetta, quindi non può più esistere un margine troppo
// stretto da qualche parte. Il margine qui sotto resta comunque generoso,
// apposta, come ulteriore rete di sicurezza (copre anche la fascia di
// tocco invisibile, che si allarga di qualche pixel per un bersaglio più
// comodo). Stretto solo a sinistra — sposta l'anello in quella direzione,
// come richiesto, dove l'anello ha comunque la sua apertura e non c'è mai
// una fetta così vicina al bordo. RING_CENTER_X e RING_CENTER_Y sono il
// centro del "buco" in coordinate relative al contenitore, diversi fra
// loro proprio per via del margine asimmetrico — la scritta al centro si
// posiziona rispetto a questi, non più con un offset negativo a mano:
// prima sconfinava a sinistra dell'anello (11 settembre).
const RING_DIAMETER = 160;
const RING_STROKE = 15;
const RING_INSET_LEFT = 2;
const RING_INSET_RIGHT = 12;
const RING_INSET_TOP = 9;
const RING_INSET_BOTTOM = 9;
const RING_BOX_WIDTH = RING_INSET_LEFT + RING_DIAMETER + RING_INSET_RIGHT;
const RING_BOX_HEIGHT = RING_INSET_TOP + RING_DIAMETER + RING_INSET_BOTTOM;
const RING_HOLE_R = (RING_DIAMETER - RING_STROKE) / 2 - RING_STROKE / 2;
const RING_CENTER_X = RING_INSET_LEFT + RING_DIAMETER / 2;
const RING_CENTER_Y = RING_INSET_TOP + RING_DIAMETER / 2;

// Where an arc of RING_SWEEP starting at twelve o'clock finishes, on the circle
// of the given radius. Written out by hand, the previous endpoints missed their
// own circles by half a unit and the coloured arc drifted off the grey one.
function ringSweepEnd(cx, cy, r) {
  const angle = -Math.PI / 2 + 2 * Math.PI * RING_SWEEP;
  return `${(cx + r * Math.cos(angle)).toFixed(2)} ${(cy + r * Math.sin(angle)).toFixed(2)}`;
}

// Indicative fixed rates relative to EUR. In the shipped app these would be
// refreshed from a rates API; offline they keep totals roughly meaningful.
const RATES_TO_EUR = {
  EUR: 1,
  USD: 0.92,
  GBP: 1.17,
  CHF: 1.06,
};

function convertAmount(amount, from, to, liveRates) {
  const table = liveRates || RATES_TO_EUR;
  const f = table[from] || RATES_TO_EUR[from] || 1;
  const tRate = table[to] || RATES_TO_EUR[to] || 1;
  return (amount * f) / tRate;
}

// glance whether an update actually landed on the device.
const APP_VERSION = "v169";

// Il listino sta accanto all'app, non dentro: cambiando quel file le offerte
// cambiano su tutti i telefoni senza rilasciare una nuova versione. È un dato,
// non un file dell'app, quindi va preso dalla rete per primo — la cache
// eterna è esattamente l'errore già pagato con i tassi di cambio.
const OFFERS_URL = "./offerte.json";

// I nomi del listino devono combaciare con quelli del catalogo. Quello che non
// combacia viene ignorato: indovinare accoppiamenti significa attribuire a un
// servizio un piano che non ha.
function normaliseServiceName(name) {
  return String(name || "").trim().toLowerCase();
}

// Un'offerta senza data di scadenza non è "per sempre": è un'offerta che
// nessuno ha datato, e resterebbe a schermo per anni. Senza data non passa.
function offerIsLive(offer, todayISO) {
  return !!(offer && offer.scade && offer.scade >= todayISO);
}

// Sovrapposizioni. Stare nella stessa categoria non basta a fare un doppione:
// Netflix e Disney+ hanno cataloghi diversi ed è normale pagarli entrambi, e il
// catalogo mette la musica e il video sotto la stessa voce "streaming" benché
// non siano lo stesso discorso. Qui stanno solo i gruppi in cui i servizi sono
// alternativi fra loro, cioè quelli in cui tenerne uno per volta è una scelta
// possibile e non una rinuncia. Le liste sono per nome, così si correggono una
// riga alla volta senza toccare le categorie, che servono ad altro.
const SAVINGS_VIDEO = new Set([
  "Netflix", "Disney+", "Amazon Prime Video", "Now", "Sky", "DAZN", "Infinity+",
  "Crunchyroll", "Paramount+", "Apple TV+", "MUBI", "Nebula", "YouTube Premium",
]);
const SAVINGS_MUSIC = new Set([
  "Spotify", "Apple Music", "YouTube Music", "Deezer", "Tidal", "SoundCloud Go+",
]);
// "Sicurezza" tiene insieme antivirus, VPN e una casella di posta: la stessa
// confusione di "streaming". Separati, perché un antivirus e una VPN fanno
// mestieri diversi e tenerli entrambi è normale.
const SAVINGS_ANTIVIRUS = new Set([
  "Norton", "McAfee", "Bitdefender", "Kaspersky", "Avast", "AVG", "Malwarebytes", "ESET",
]);
const SAVINGS_VPN = new Set([
  "NordVPN", "ExpressVPN", "Surfshark", "Proton VPN", "Mullvad VPN",
]);

// Categorie intere in cui i servizi sono sostituibili fra loro.
const SAVINGS_OVERLAP_CATEGORIES = new Set(["gaming", "ai"]);

// Non tutti i gruppi meritano lo stesso consiglio. Due servizi in streaming
// hanno cataloghi diversi e si possono tenere a rotazione; di antivirus ne
// serve uno e basta, e la rotazione lì sarebbe un suggerimento sbagliato.
const SAVINGS_KEEP_ONE = new Set(["antivirus", "vpn"]);

// Fuori da tutto restano i servizi che non sostituiscono niente: Audible sono
// audiolibri, Plex Pass è un server, Apple One è un pacchetto. Metterli accanto
// a Netflix vorrebbe dire suggerire di scegliere fra cose non confrontabili.
function savingsOverlapGroup(sub) {
  if (!sub) return null;
  if (SAVINGS_VIDEO.has(sub.name)) return "video";
  if (SAVINGS_MUSIC.has(sub.name)) return "music";
  if (SAVINGS_ANTIVIRUS.has(sub.name)) return "antivirus";
  if (SAVINGS_VPN.has(sub.name)) return "vpn";
  return SAVINGS_OVERLAP_CATEGORIES.has(sub.category) ? sub.category : null;
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

function parseLocalDate(value) {
  if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value));
  if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const d = new Date(value);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

async function showNotification(title, options) {
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) {
        await reg.showNotification(title, options);
        return true;
      }
    }
  } catch {
    // fall through to the direct constructor
  }
  try {
    // The bare constructor refuses a notification carrying actions, so the
    // fallback drops them: a plain reminder beats no reminder.
    const { actions, ...plain } = options || {};
    new Notification(title, plain);
    return true;
  } catch {
    return false;
  }
}

// Prices are typed on a locale keyboard, where Italian, Spanish, French and
// German users all get a comma as the decimal key. A native number input
// silently rejects it and hands back an empty value, so the amount is kept as
// text and normalised here instead.
function parseAmount(value) {
  if (value === null || value === undefined) return NaN;
  return parseFloat(String(value).replace(",", "."));
}

// The price series shown in the detail sheet.
//
// Explicit price changes are only recorded from v39 onwards, so on their own
// they would leave every existing subscription with an empty section. The
// recorded payments already carry the amount charged on each date, which is a
// better source anyway: it reflects reality, including any manual correction
// made in the history. Both are merged and runs of the same price collapse
// into a single point.
// What the subscription costs on a given day. An introductory offer is a window
// that overrides the ordinary price up to promoUntil, which is the date of the
// first full-price charge. Nothing is rewritten when the window closes: a value
// that had to be flipped on a date would depend on the app being opened that
// day, and would be wrong for anyone who left it shut for a week.
function costOn(sub, iso) {
  if (!sub) return 0;
  if (sub.promoUntil && sub.promoCost != null && iso && iso < sub.promoUntil) return sub.promoCost;
  return sub.cost;
}

// Whether that date fell inside the introductory offer. Only the end date is
// needed: an offer that is over has no price to impose on today, but the months
// it covered still have to be marked so they are not read as the price this
// subscription started from.
function inPromo(sub, iso) {
  return !!(sub && sub.promoUntil && iso && iso < sub.promoUntil);
}

// Il nome scelto dal catalogo può arrivare fino a qui con un numero in più:
// "DAZN 2", assegnato in automatico da nextAvailableName quando si aveva già
// un abbonamento chiamato "DAZN" (vedi la scelta fra tenere il nome
// originale o quello suggerito, nell'avviso di doppione). Un confronto
// esatto contro il catalogo perdeva il collegamento — niente logo, niente
// link alla disdetta, solo l'iniziale come ripiego — segnalato da Erny il
// 12 settembre esattamente su un "DAZN 2". Il confronto qui ignora un
// eventuale numero finale e le maiuscole/minuscole, per ritrovare comunque
// il servizio giusto.
function matchesCatalogName(catalogName, subName) {
  const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+\d+$/, "");
  return norm(catalogName) === norm(subName);
}

function buildPriceSeries(sub, payments, todayISO) {
  const points = [];
  if (Array.isArray(sub.priceHistory)) {
    sub.priceHistory.forEach((p) => {
      if (p && typeof p.cost === "number" && p.date) {
        points.push({ cost: p.cost, currency: p.currency || sub.currency, date: p.date });
      }
    });
  }
  (payments || []).forEach((p) => {
    if (p.subId === sub.id && p.status !== "skipped") {
      points.push({ cost: p.amount, currency: p.currency || sub.currency, date: p.date });
    }
  });
  if (points.length === 0) {
    // Nothing recorded yet: the section still shows today's price, so it is
    // never an empty box. The date is omitted when it isn't known.
    return [{ cost: costOn(sub, todayISO), currency: sub.currency, date: sub.startDate || "", promo: inPromo(sub, todayISO) }];
  }

  // Marked, not filtered: what was paid during the offer is still money spent,
  // and the history has to show it. It simply must not be read as the price
  // this subscription started from.
  points.forEach((p) => {
    p.promo = inPromo(sub, p.date);
  });
  points.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const out = [];
  points.forEach((pt) => {
    const last = out[out.length - 1];
    if (last && last.cost === pt.cost) return;
    if (last && last.date === pt.date) {
      // Same day, different price: the later reading wins.
      out[out.length - 1] = pt;
      return;
    }
    out.push(pt);
  });
  return out;
}

// Quanto è cambiato il prezzo da quando l'abbonamento è iniziato, in
// percentuale — un'unica funzione condivisa fra la riga della lista e la
// scheda di dettaglio, perché prima calcolavano due cose diverse: la lista
// leggeva solo l'ultimo aumento registrato (`sub.lastIncrease`), il
// dettaglio il cambiamento totale dal primo prezzo mai visto
// (`buildPriceSeries`). Con più di un aumento nella vita dell'abbonamento i
// due numeri potevano non coincidere — segnalato da Erny il 10 settembre.
// Il totale da sempre è la versione più completa (usa anche i pagamenti
// realmente registrati, non solo le modifiche fatte a mano), quindi è
// quella che vince ovunque.
function totalPriceChangePct(sub, payments, todayISO) {
  const hist = buildPriceSeries(sub, payments, todayISO);
  // Il prezzo di partenza è il primo che non fa parte di un'offerta:
  // confrontare con l'offerta farebbe sembrare un aumento di centinaia per
  // cento la semplice fine di uno sconto.
  const settled = hist.filter((p) => !p.promo);
  const first = settled[0] || hist[0];
  const last = hist[hist.length - 1];
  const unchanged = settled.length < 2;
  const pct = !unchanged && first && first.cost > 0 ? Math.round(((last.cost - first.cost) / first.cost) * 100) : 0;
  return { hist, first, last, unchanged, pct };
}

function toLocalISO(d) {
  // toISOString() reports UTC, so late evening in UTC+2 would already read as
  // tomorrow. The app always works with the device's own calendar day.
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function daysBetween(a, b) {
  return Math.round((b.setHours(0, 0, 0, 0) - a.setHours(0, 0, 0, 0)) / 86400000);
}

// Renewals follow the calendar, not a fixed number of days: a subscription
// billed on the 31st falls on the 30th in April and on the 28th/29th in
// February, then goes back to the 31st — exactly how real billing works.
// Every cadence the app understands, in one table. Everything else asks the
// table instead of testing for "annual", which is how a monthly-or-yearly
// assumption had spread into ten different places.
//
// Weekly cadences count in days and monthly ones in months, and the difference
// matters: a fortnightly plan must not drift onto a fixed day of the month,
// while a monthly one must stay on its day even across February.
const FREQUENCIES = [
  { id: "weekly", unit: "day", step: 7, perYear: 365 / 7 },
  { id: "biweekly", unit: "day", step: 14, perYear: 365 / 14 },
  { id: "monthly", unit: "month", step: 1, perYear: 12 },
  { id: "quarterly", unit: "month", step: 3, perYear: 4 },
  { id: "semiannual", unit: "month", step: 6, perYear: 2 },
  { id: "annual", unit: "month", step: 12, perYear: 1 },
  { id: "biennial", unit: "month", step: 24, perYear: 0.5 },
];

function freqOf(frequency) {
  return FREQUENCIES.find((f) => f.id === frequency) || FREQUENCIES[2];
}

// One charge expressed as a monthly amount, whatever the cadence. Yearly plans
// used to be divided by twelve inline in four separate spots.
function monthlyEquivalent(amount, frequency) {
  return (amount * freqOf(frequency).perYear) / 12;
}

function midnight(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function addPeriods(anchorDate, frequency, count) {
  const freq = freqOf(frequency);
  if (freq.unit === "day") {
    const d = midnight(anchorDate);
    d.setDate(d.getDate() + freq.step * count);
    return d;
  }
  const anchorDay = anchorDate.getDate();
  const d = new Date(anchorDate.getFullYear(), anchorDate.getMonth(), 1);
  d.setMonth(d.getMonth() + freq.step * count);
  const daysInTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(anchorDay, daysInTarget));
  return d;
}

function periodsBetween(anchorDate, target, frequency) {
  const freq = freqOf(frequency);
  // Rounded down in both directions, so the step it names is always the one at
  // or before the target. The callers move forward from there when they need to.
  if (freq.unit === "day") {
    const days = Math.round((midnight(target) - midnight(anchorDate)) / 86400000);
    return Math.floor(days / freq.step);
  }
  const months = (target.getFullYear() - anchorDate.getFullYear()) * 12 + (target.getMonth() - anchorDate.getMonth());
  return Math.floor(months / freq.step);
}

function nextRenewalInfo(sub, today) {
  const isEnded = sub.endDate ? daysBetween(parseLocalDate(sub.endDate), parseLocalDate(today)) > 0 : false;
  const anchor = parseLocalDate(sub.renewalDate);
  const todayDate = parseLocalDate(today);

  let steps = Math.max(0, periodsBetween(anchor, todayDate, sub.frequency));
  let renewal = addPeriods(anchor, sub.frequency, steps);
  let safety = 0;
  while (daysBetween(parseLocalDate(today), parseLocalDate(renewal)) < 0 && safety < 500) {
    steps += 1;
    renewal = addPeriods(anchor, sub.frequency, steps);
    safety++;
  }

  // One period before the upcoming renewal — may sit before the anchor date,
  // which is what makes the ring fill correctly on the very first cycle.
  const previous = addPeriods(anchor, sub.frequency, steps - 1);
  const daysLeft = daysBetween(parseLocalDate(today), parseLocalDate(renewal));
  const cycleDays = Math.max(1, daysBetween(parseLocalDate(previous), parseLocalDate(renewal)));
  const progress = 1 - daysLeft / cycleDays;
  return { renewal, daysLeft, progress: Math.min(Math.max(progress, 0), 1), cycleDays, isEnded };
}

// Grouping is done by hand rather than through the browser's locale data,
// which on some Android builds ships without it and silently returns
// "1319,54" instead of "1.319,54".
const NUMBER_SEPARATORS = {
  it: { group: ".", decimal: "," },
  en: { group: ",", decimal: "." },
  es: { group: ".", decimal: "," },
  fr: { group: "\u202F", decimal: "," },
  de: { group: ".", decimal: "," },
};

function formatMoney(n, symbol, locale, decimals = 2) {
  const sep = NUMBER_SEPARATORS[String(locale || "en").slice(0, 2)] || NUMBER_SEPARATORS.en;
  const value = Number(n);
  const safe = Number.isFinite(value) ? value : 0;
  const fixed = Math.abs(safe).toFixed(decimals);
  const dot = fixed.indexOf(".");
  const whole = dot === -1 ? fixed : fixed.slice(0, dot);
  const cents = dot === -1 ? "" : fixed.slice(dot + 1);
  const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, sep.group);
  const num = `${safe < 0 ? "-" : ""}${grouped}${cents ? sep.decimal + cents : ""}`;
  return symbol.length > 1 ? `${num} ${symbol}` : `${symbol} ${num}`;
}

function symbolFor(code) {
  const c = CURRENCIES.find((x) => x.code === code);
  return c ? c.symbol : code;
}

// The tour points at the live interface rather than at pictures of it, so no
// position in here is ever written down. Sheets slide, the keyboard shoves the
// viewport up, the phone rotates: every frame the hole is measured from the
// real element, and a step whose element has gone missing degrades to a plain
// centred card rather than a hole cut in the wrong place.
const TOUR_PAD = 8;

const TOUR_STEPS = [
  { id: "welcome", target: null },
  { id: "views", target: "nav" },
  { id: "settings", target: "settings" },
  { id: "add", target: "add", waitFor: "form" },
  { id: "service", target: "formService", waitFor: "service" },
  { id: "cost", target: "formCost", requires: "cost" },
  { id: "when", target: "formWhen" },
  { id: "save", target: "formSave", waitFor: "saved" },
  { id: "ring", target: "totalCard" },
];

const TOUR_FIRST_FORM_STEP = TOUR_STEPS.findIndex((s) => s.id === "add");

function useSpotlightRect(target) {
  const [rect, setRect] = useState(null);
  useEffect(() => {
    if (!target) {
      setRect(null);
      return;
    }
    let scrolled = false;
    const read = () => {
      const el = document.querySelector(`[data-tour="${target}"]`);
      if (!el) return setRect(null);
      // Brought into view the first time it is actually found rather than when
      // the step begins: the closing step starts while the form sheet is still
      // on screen, and a scroll aimed at something covered goes nowhere.
      if (!scrolled) {
        scrolled = true;
        try {
          el.scrollIntoView({ block: "center", behavior: "smooth" });
        } catch {
          el.scrollIntoView();
        }
      }
      const r = el.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      // Collapsed, or scrolled entirely off screen: no hole beats a wrong one.
      if (r.width < 4 || r.height < 4 || r.bottom < 0 || r.top > vh) return setRect(null);
      // Whether the hole is round is asked of the element, not inferred from
      // the hole's proportions: once holes could be trimmed against the screen
      // edge those proportions stopped meaning anything, and the add button —
      // which sits low enough to lose the padding beneath it — came out as a
      // squashed rectangle.
      // Browsers report the radius either in pixels or as the percentage it was
      // written as, and both spellings mean "round" at different numbers.
      const rawRadius = getComputedStyle(el).borderTopLeftRadius || "0";
      const round =
        rawRadius.indexOf("%") >= 0
          ? parseFloat(rawRadius) >= 50
          : (parseFloat(rawRadius) || 0) >= Math.min(r.width, r.height) / 2 - 0.5;
      let next;
      if (round) {
        // Sized from the element and centred on it, and deliberately not
        // trimmed: a circle running a few pixels past the edge still reads as
        // a circle, while a flattened one reads as a mistake.
        const d = Math.max(r.width, r.height) + TOUR_PAD * 2;
        next = {
          top: r.top + r.height / 2 - d / 2,
          left: r.left + r.width / 2 - d / 2,
          width: d,
          height: d,
          round: true,
          vh,
        };
      } else {
        // The padding is trimmed on any side where the element already reaches
        // the edge of the screen. The bottom bar runs the full width and sits
        // on the very bottom, so padding it evenly pushed two of its four sides
        // out of sight and left the ring looking off-centre.
        const left = Math.max(0, r.left - TOUR_PAD);
        const top = Math.max(0, r.top - TOUR_PAD);
        next = {
          top,
          left,
          width: Math.min(vw, r.right + TOUR_PAD) - left,
          height: Math.min(vh, r.bottom + TOUR_PAD) - top,
          round: false,
          vh,
        };
      }
      setRect((prev) =>
        prev &&
        Math.abs(prev.top - next.top) < 0.5 &&
        Math.abs(prev.left - next.left) < 0.5 &&
        Math.abs(prev.width - next.width) < 0.5 &&
        Math.abs(prev.height - next.height) < 0.5 &&
        prev.round === next.round &&
        prev.vh === next.vh
          ? prev
          : next
      );
    };

    read();
    // Sheet and keyboard animations keep moving things for a few hundred
    // milliseconds after a step changes. Re-reading on a timer is steadier
    // than trying to guess when everything has come to rest, and it is one
    // rectangle read rather than a layout pass over the page.
    const timer = setInterval(read, 150);
    const vv = window.visualViewport;
    window.addEventListener("resize", read);
    window.addEventListener("scroll", read, true);
    window.addEventListener("orientationchange", read);
    if (vv) {
      vv.addEventListener("resize", read);
      vv.addEventListener("scroll", read);
    }
    return () => {
      clearInterval(timer);
      window.removeEventListener("resize", read);
      window.removeEventListener("scroll", read, true);
      window.removeEventListener("orientationchange", read);
      if (vv) {
        vv.removeEventListener("resize", read);
        vv.removeEventListener("scroll", read);
      }
    };
  }, [target]);
  return rect;
}

function TourSpotlight({ index, colors, t, blocked, onNext, onEnd }) {
  const step = TOUR_STEPS[index];
  const hole = useSpotlightRect(step.target);
  // Read off the same measurement as the hole, so the card is never placed
  // against a viewport height the hole no longer agrees with.
  const vh = hole ? hole.vh : typeof window !== "undefined" ? window.innerHeight : 0;
  const dim = "rgba(9,7,5,0.82)";

  // The card is pinned by whichever edge faces the hole, never by its own
  // height: that way it can't be placed from a stale measurement of itself,
  // and it lands correctly however long the translated text turns out to be.
  const below = !hole || hole.top + hole.height / 2 < vh / 2;
  const cardPosition = hole
    ? below
      ? { top: hole.top + hole.height + 14 }
      : { bottom: Math.max(14, vh - hole.top + 14) }
    : { top: "50%", transform: "translateY(-50%)" };

  const copy = t.tourSteps[step.id];
  const last = index === TOUR_STEPS.length - 1;
  const waiting = !!step.waitFor;
  const blocker = { position: "absolute", pointerEvents: "auto" };

  return (
    <div className="fixed inset-0 z-[95]" style={{ pointerEvents: "none" }}>
      {hole ? (
        <>
          <div
            style={{
              position: "absolute",
              top: hole.top,
              left: hole.left,
              width: hole.width,
              height: hole.height,
              borderRadius: hole.round ? hole.width / 2 : 18,
              boxShadow: `0 0 0 9999px ${dim}`,
              border: `2px solid ${ACCENT.amber}`,
              pointerEvents: "none",
            }}
          />
          {/* Only the lit element stays tappable. The four panels around it
              swallow stray taps so a step can't be derailed by a mis-hit. */}
          <div style={{ ...blocker, top: 0, left: 0, right: 0, height: Math.max(0, hole.top) }} />
          <div style={{ ...blocker, top: hole.top + hole.height, left: 0, right: 0, bottom: 0 }} />
          <div style={{ ...blocker, top: hole.top, left: 0, width: Math.max(0, hole.left), height: hole.height }} />
          <div style={{ ...blocker, top: hole.top, left: hole.left + hole.width, right: 0, height: hole.height }} />
        </>
      ) : (
        <div style={{ ...blocker, inset: 0, background: dim }} />
      )}

      <div
        style={{
          position: "absolute",
          left: 14,
          right: 14,
          background: colors.surface,
          border: `1px solid ${colors.border}`,
          pointerEvents: "auto",
          ...cardPosition,
        }}
        className="rounded-2xl p-4"
      >
        <h3 style={{ fontFamily: "'Fraunces', serif", color: colors.textPrimary }} className="text-base font-medium mb-1">
          {copy.title}
        </h3>
        <p style={{ color: colors.textSecondary }} className="text-sm leading-relaxed">
          {copy.text}
        </p>
        {blocked && (
          <p style={{ color: ACCENT.amber }} className="text-xs mt-2">
            {t.tourNeedsCost}
          </p>
        )}
        <div className="flex items-center justify-between mt-4">
          <button type="button" onClick={onEnd} style={{ color: colors.textFaint }} className="text-xs">
            {t.tourSkip}
          </button>
          <div className="flex items-center gap-3">
            <span style={{ color: colors.textFaint }} className="text-xs">
              {t.tourStepOf(index + 1, TOUR_STEPS.length)}
            </span>
            {/* A step that asks for a real action has no way forward but that
                action, or the tour would drift out of step with the app. */}
            {waiting ? (
              <span style={{ color: ACCENT.amber }} className="text-xs">{t.tourWaitHint}</span>
            ) : (
              <button
                type="button"
                disabled={blocked}
                onClick={last ? onEnd : onNext}
                style={{
                  background: blocked ? colors.surface2 : ACCENT.amber,
                  color: blocked ? colors.textFaint : INK,
                }}
                className="rounded-lg px-4 py-2 text-xs font-semibold"
              >
                {last ? t.tourDone : t.tourNext}
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const EQUIVALENTS = [
  { id: "coffee", price: { EUR: 1.5, USD: 3.5, GBP: 3, CHF: 4.5 } },
  { id: "beer", price: { EUR: 5, USD: 7, GBP: 5.5, CHF: 7.5 } },
  { id: "pizza", price: { EUR: 9, USD: 16, GBP: 12, CHF: 20 } },
  { id: "dinner", price: { EUR: 35, USD: 45, GBP: 40, CHF: 60 } },
];

// Singular and plural, since every one of the five languages inflects these.
const EQUIVALENT_LABELS = {
  it: { coffee: ["caffè", "caffè"], beer: ["birra", "birre"], pizza: ["pizza", "pizze"], dinner: ["cena fuori", "cene fuori"] },
  en: { coffee: ["coffee", "coffees"], beer: ["beer", "beers"], pizza: ["pizza", "pizzas"], dinner: ["dinner out", "dinners out"] },
  es: { coffee: ["café", "cafés"], beer: ["cerveza", "cervezas"], pizza: ["pizza", "pizzas"], dinner: ["cena fuera", "cenas fuera"] },
  fr: { coffee: ["café", "cafés"], beer: ["bière", "bières"], pizza: ["pizza", "pizzas"], dinner: ["dîner au resto", "dîners au resto"] },
  de: { coffee: ["Kaffee", "Kaffees"], beer: ["Bier", "Biere"], pizza: ["Pizza", "Pizzen"], dinner: ["Abendessen", "Abendessen"] },
};

// Six of something stops being a picture and goes back to being a number, so
// the cheapest reference that lands at five or fewer wins. That keeps coffee —
// the one everybody has priced in their head — covering the budgets people
// actually have, and brings the dearer items in only when the sum demands it.
const EQUIVALENT_MAX = 3;

// Which drawing stands for which reference. Kept apart from EQUIVALENTS so the
// prices stay readable as a table. Rimessa dopo essere stata tolta per
// errore in v151: la colonna del costo al giorno mostrava sempre e solo il
// caffè, anche quando il testo sotto diceva "birra" o "pizza" — segnalato
// da Erny il 12 settembre.
const EQUIVALENT_ICONS = { coffee: "coffee", beer: "beer", pizza: "pizza", dinner: "utensils" };

function dailyEquivalent(daily, currency, language) {
  if (!Number.isFinite(daily) || daily <= 0) return null;
  const labels = EQUIVALENT_LABELS[language] || EQUIVALENT_LABELS.en;
  const priceOf = (item) => item.price[currency] || item.price.EUR;
  const cheapest = EQUIVALENTS[0];

  // Below the price of one coffee the count would round to zero, which says
  // nothing. Turned around it still reads: one coffee every so many days.
  if (daily < priceOf(cheapest)) {
    const days = Math.round(priceOf(cheapest) / daily);
    if (days > 1) return { kind: "everyDays", days, id: cheapest.id, label: labels[cheapest.id][0] };
    return { kind: "perDay", n: 1, id: cheapest.id, label: labels[cheapest.id][0] };
  }

  let chosen = EQUIVALENTS[EQUIVALENTS.length - 1];
  for (const item of EQUIVALENTS) {
    const n = Math.round(daily / priceOf(item));
    if (n >= 1 && n <= EQUIVALENT_MAX) {
      chosen = item;
      break;
    }
  }
  const n = Math.max(1, Math.round(daily / priceOf(chosen)));
  return { kind: "perDay", n, id: chosen.id, label: labels[chosen.id][n === 1 ? 0 : 1] };
}

// True when the subscription was paused across that date. Pause periods are
// recorded as the user toggles the pause switch, so only pauses made from this
// version onwards are known — older history simply reads as active.
function wasPausedOn(sub, date) {
  const periods = sub.pausePeriods;
  if (!Array.isArray(periods) || periods.length === 0) return false;
  return periods.some((p) => {
    if (!p || !p.from) return false;
    const from = parseLocalDate(p.from);
    if (date < from) return false;
    if (!p.to) return true;
    return date <= parseLocalDate(p.to);
  });
}

// La data da mostrare come "terminato il", qualunque sia stato il
// meccanismo: una vera data di fine, oppure — per un abbonamento fermato
// col vecchio meccanismo di pausa, riletto ora come "terminato" — l'inizio
// dell'ultimo periodo di pausa ancora aperto. Erny ha deciso il 10
// settembre che non deve più esserci differenza visibile fra i due: sono
// entrambi, semplicemente, "terminato". Il campo `paused` resta nei dati
// per come è fatto sotto (è ancora la pausa a tenere il conto di quando
// l'abbonamento si è fermato), ma nell'interfaccia sparisce.
function terminatedSince(sub) {
  if (sub.endDate) return sub.endDate;
  if (sub.paused && Array.isArray(sub.pausePeriods)) {
    const open = sub.pausePeriods.filter((p) => p && p.from && !p.to);
    if (open.length > 0) return open[open.length - 1].from;
  }
  return null;
}

// Ogni "ancora" (data di rinnovo + cadenza) che l'abbonamento ha avuto nel
// tempo, dalla più vecchia alla più recente, ciascuna con il giorno da cui
// vale. Un `from` a null vuol dire "da sempre" — o perché è il primissimo
// segmento, o perché l'abbonamento è stato salvato prima che questa
// cronologia esistesse, nel qual caso tutta la sua vita viene letta con
// l'unica ancora che conosciamo, quella attuale.
//
// Riprendere da una pausa, o modificare la data di rinnovo su un abbonamento
// attivo, cambiano entrambi questa ancora: senza questa cronologia, l'unico
// modo di ricostruire lo storico sarebbe applicare l'ancora di oggi a tutta
// la vita dell'abbonamento, riscrivendo anche i mesi già passati su un
// giorno diverso da quello vero. Questa funzione è il punto unico da cui
// pastOccurrences e occurrencesInMonth leggono, così restano sempre coerenti
// fra loro.
function cycleSegments(sub) {
  const history =
    Array.isArray(sub.cycleHistory) && sub.cycleHistory.length > 0
      ? sub.cycleHistory
      : [{ from: null, renewalDate: sub.renewalDate, frequency: sub.frequency }];
  // I campi live restano comunque la verità per il segmento più recente: se
  // per qualche motivo un cambiamento non finisse mai registrato qui, da oggi
  // in poi la fase torna comunque corretta.
  return history.map((seg, i) =>
    i === history.length - 1 ? { from: seg.from, renewalDate: sub.renewalDate, frequency: sub.frequency } : seg
  );
}

// Every billing date that has already happened, oldest first.
//
// Segmentata per lo stesso motivo di cycleSegments: ogni segmento genera solo
// le date che ricadono nel proprio intervallo, usando la propria ancora — mai
// quella di un altro segmento. Senza startDate non c'è nulla di onesto da
// ricostruire, quindi l'abbonamento non contribuisce storico.
function pastOccurrences(sub, today, maxYears = 15) {
  if (!sub || !sub.startDate || !sub.renewalDate) return [];
  const start = parseLocalDate(sub.startDate);
  const floor = new Date(today.getFullYear() - maxYears, today.getMonth(), today.getDate());
  const lowerBound = start > floor ? start : floor;
  const end = sub.endDate ? parseLocalDate(sub.endDate) : null;

  const segments = cycleSegments(sub);
  const out = [];
  outer: for (let si = 0; si < segments.length; si++) {
    const seg = segments[si];
    const anchor = parseLocalDate(seg.renewalDate);
    if (isNaN(anchor.getTime())) continue;
    const segFrom = seg.from ? parseLocalDate(seg.from) : null;
    const nextFrom = si + 1 < segments.length && segments[si + 1].from ? parseLocalDate(segments[si + 1].from) : null;

    // Un segmento copre da dove inizia fino al giorno prima che inizi quello
    // dopo (o oggi, per l'ultimo): mai oltre, altrimenti due segmenti
    // finirebbero per generare la stessa data due volte.
    let segLower = lowerBound;
    if (segFrom && segFrom > segLower) segLower = segFrom;
    let segUpper = today;
    if (nextFrom) {
      const dayBefore = new Date(nextFrom.getFullYear(), nextFrom.getMonth(), nextFrom.getDate() - 1);
      if (dayBefore < segUpper) segUpper = dayBefore;
    }
    if (segLower > segUpper) continue;

    // L'ancora di un segmento non è sempre nel futuro rispetto al proprio
    // intervallo: per l'ultimo segmento sì (è la prossima scadenza), ma per
    // uno passato può essere il primissimo canone mai registrato, a metà
    // dell'intervallo o all'inizio. Si parte dal passo più vicino al limite
    // inferiore e si percorre in avanti, così funziona in entrambi i casi.
    let k = periodsBetween(anchor, segLower, seg.frequency);
    for (let guard = 0; guard < 100000; guard++, k++) {
      const d = addPeriods(anchor, seg.frequency, k);
      if (d > segUpper) break;
      if (d < segLower) continue;
      if (end && d > end) continue;
      if (wasPausedOn(sub, d)) continue;
      out.push(d);
      // Fifteen years of a weekly plan is a little over seven hundred and eighty
      // charges, which the old ceiling of eight hundred would have clipped.
      if (out.length > 1600) break outer;
    }
  }
  return out.sort((a, b) => a - b);
}

// Occurrences falling inside one calendar month.
//
// Stessa logica a segmenti di pastOccurrences: un mese già passato deve
// continuare a mostrare il giorno su cui è caduto davvero, anche dopo che una
// ripresa o una modifica successiva sposta l'abbonamento su un altro giorno
// da quel momento in poi.
function occurrencesInMonth(sub, monthDate) {
  const monthStart = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
  const monthEnd = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
  const overallLower = sub.startDate ? parseLocalDate(sub.startDate) : null;
  if (overallLower && overallLower > monthEnd) return [];

  const segments = cycleSegments(sub);
  const results = [];
  for (let si = 0; si < segments.length; si++) {
    const seg = segments[si];
    const anchor = parseLocalDate(seg.renewalDate);
    if (isNaN(anchor.getTime())) continue;
    const segFrom = seg.from ? parseLocalDate(seg.from) : null;
    const nextFrom = si + 1 < segments.length && segments[si + 1].from ? parseLocalDate(segments[si + 1].from) : null;

    let lower = overallLower || anchor;
    if (segFrom && segFrom > lower) lower = segFrom;
    if (lower > monthEnd) continue;

    let upper = monthEnd;
    if (nextFrom) {
      const dayBefore = new Date(nextFrom.getFullYear(), nextFrom.getMonth(), nextFrom.getDate() - 1);
      if (dayBefore < upper) upper = dayBefore;
    }
    if (upper < monthStart) continue;

    const steps = periodsBetween(anchor, monthStart, seg.frequency);
    const freq = freqOf(seg.frequency);
    // How many charges of this cadence can land inside one month, plus a step
    // either side for month-length clamping. Scanning one step around the start
    // was right while a month could hold only one charge; a weekly plan puts four
    // or five in, and four of them would have gone missing from the calendar.
    const span = freq.unit === "day" ? Math.ceil(31 / freq.step) + 1 : 2;
    for (let k = steps - 1; k <= steps + span; k++) {
      const d = addPeriods(anchor, seg.frequency, k);
      if (d >= monthStart && d <= monthEnd && d >= lower && d <= upper) {
        if (!results.some((r) => r.getTime() === d.getTime())) results.push(d);
      }
    }
  }
  return results.sort((a, b) => a - b);
}

// Checks whether a start date actually falls on the renewal cycle.
//
// A subscription renewing on the 15th cannot have been billed on the 17th, so a
// start date that misses the cycle silently pushes the first recorded payment
// to the next one. Rather than guess, the form points this out and offers the
// nearest date that does line up.
function cycleAlignment(startDateStr, renewalDateStr, frequency) {
  if (!startDateStr || !renewalDateStr) return null;
  const start = parseLocalDate(startDateStr);
  const anchor = parseLocalDate(renewalDateStr);
  if (isNaN(start) || isNaN(anchor)) return null;

  const steps = periodsBetween(anchor, start, frequency);
  let before = null;
  let after = null;
  for (let k = steps - 2; k <= steps + 2; k++) {
    const d = addPeriods(anchor, frequency, k);
    if (d.getTime() === start.getTime()) return null;
    if (d < start && (!before || d > before)) before = d;
    if (d > start && (!after || d < after)) after = d;
  }
  if (!before && !after) return null;
  const suggested =
    !before ? after : !after ? before : start - before <= after - start ? before : after;
  return { first: after, suggested };
}

// Un controllo diverso da cycleAlignment, sopra: quello si accorge se la
// data di inizio non cade sul giorno giusto del ciclo (es. inizio il 17,
// rinnovo il 15). Questo si accorge di un problema che cycleAlignment non
// vede affatto — inizio e rinnovo che cadono perfettamente sullo stesso
// giorno del ciclo, ma con un'occorrenza intera saltata nel mezzo: inizio
// il 15 agosto, rinnovo scritto 15 ottobre, mensile — 15 agosto e 15
// ottobre sono entrambi validi per un ciclo mensile, ma manca il 15
// settembre, che casca comunque prima di oggi essendo nel futuro più
// vicino. Segnalato da Erny il 12 settembre: creando un abbonamento così,
// l'Elenco diceva "tra 33 giorni" (fino al 15 ottobre) invece di "tra 3
// giorni" (fino al 15 settembre, la prima occorrenza vera del ciclo che
// deve ancora succedere) — un'incoerenza con quello che il Calendario
// mostra già correttamente (vedi cycleSegments/pastOccurrences: quelle
// funzioni camminano dall'ancora del rinnovo, quindi "sanno" del 15
// settembre anche se il campo rinnovo dice ottobre). Non blocca il
// salvataggio, come cycleAlignment: ci sono ragioni legittime per un vero
// salto (un mese omaggio, un cambio di piano), quindi avvisa soltanto.
function expectedNextOccurrence(startDateStr, renewalDateStr, frequency, todayISO) {
  if (!startDateStr || !renewalDateStr) return null;
  const start = parseLocalDate(startDateStr);
  const renewal = parseLocalDate(renewalDateStr);
  const today = parseLocalDate(todayISO);
  if (isNaN(start) || isNaN(renewal)) return null;
  const k = periodsBetween(start, today, frequency);
  let candidate = null;
  for (let i = k - 2; i <= k + 2; i++) {
    const d = addPeriods(start, frequency, i);
    if (d >= today && (!candidate || d < candidate)) candidate = d;
  }
  if (!candidate) return null;
  if (candidate.getTime() === renewal.getTime()) return null;
  if (candidate > renewal) return null;
  return candidate;
}

// Applica in sequenza i due controlli di coerenza del ciclo — prima
// l'allineamento del giorno (cycleAlignment), poi un'occorrenza saltata
// (expectedNextOccurrence) — e corregge da sola le date, invece di
// limitarsi a segnalare il problema con un pulsante da toccare. Un
// avviso ignorabile lascia comunque entrare dati sbagliati: è esattamente
// quello che è successo a Erny il 12 settembre. L'ordine non è
// arbitrario: expectedNextOccurrence cammina dalla data di inizio, quindi
// ha bisogno che sia già allineata al giorno giusto del ciclo — altrimenti
// il suo stesso suggerimento non avrebbe senso (starebbe confrontando
// giorni diversi del mese). Risolve anche il problema segnalato insieme a
// questo: prima, il secondo controllo restava del tutto nascosto finché
// non si accettava a mano il primo; ora, se ci sono entrambi i problemi,
// si risolvono uno dopo l'altro nello stesso istante, senza bisogno di
// nessun intervento.
function reconcileCycleDates(startDateStr, renewalDateStr, frequency, todayISO) {
  let startDate = startDateStr;
  let renewalDate = renewalDateStr;
  let startFixed = false;
  let renewalFixed = false;

  const align = cycleAlignment(startDate, renewalDate, frequency);
  if (align && align.suggested) {
    startDate = toLocalISO(align.suggested);
    startFixed = true;
  }
  const expected = expectedNextOccurrence(startDate, renewalDate, frequency, todayISO);
  if (expected) {
    const expectedISO = toLocalISO(expected);
    if (expectedISO !== renewalDate) {
      renewalDate = expectedISO;
      renewalFixed = true;
    }
  }
  if (!startFixed && !renewalFixed) return null;
  return { startDate, renewalDate, startFixed, renewalFixed };
}

function formatDate(dateStr, locale) {
  if (!dateStr) return "";
  const d = parseLocalDate(dateStr);
  return d.toLocaleDateString(locale, { day: "numeric", month: "short", year: "numeric" });
}

// Bottom sheets can be flicked down to close: the hardware Back button is not
// reliably delivered to installed PWAs on every Android build, so the gesture
// gives a dependable way out that doesn't depend on the system.
// Same idea as the vertical sheet drag, for the settings panel that slides in
// from the right: pushing it back out with a swipe should feel like moving the
// panel itself, not like pressing a hidden button.
// A finger running down a long list is never perfectly vertical, and the panel
// it is scrolling is also the panel that closes on a sideways drag. So the
// gesture is left alone until it has travelled far enough to say which way it
// means to go, and from then on it stays on that axis until the finger lifts.
// Without the lock the horizontal crumbs of an ordinary scroll were enough to
// pull the panel across.
const AXIS_LOCK = 10;

// How long the sheet should take to finish leaving, given how fast the finger
// was going when it let go. A hard flick should land in a moment; a slow drag
// released halfway should still coast out at a believable speed. Clamped at
// both ends so it can be neither instant nor sluggish.
const FLING_MIN_MS = 110;
const FLING_MAX_MS = 260;
// The exit easing accelerates rather than holding a constant speed, so the
// sheet covers the remaining distance faster than the raw division suggests.
// Without this factor even a firm flick landed on the ceiling and nothing
// below a very hard throw felt any different from a slow drag.
const FLING_EASE = 1.6;
// Above this, in pixels per millisecond, the gesture counts as a throw and the
// sheet goes regardless of how far it actually travelled.
const FLING_SPEED = 0.5;

function flingExit(remaining, speed) {
  if (!(speed > 0)) return FLING_MAX_MS;
  return Math.max(FLING_MIN_MS, Math.min(FLING_MAX_MS, Math.round(remaining / (speed * FLING_EASE))));
}

// Speed over the last stretch of the gesture rather than its whole length: a
// finger that hesitates and then throws should be read as a throw.
function trackSpeed(start, position, now) {
  const dt = now - (start.lastAt || now);
  if (dt > 0) {
    const instant = Math.abs(position - (start.lastPos || position)) / dt;
    start.speed = start.speed === undefined ? instant : start.speed * 0.4 + instant * 0.6;
  }
  start.lastPos = position;
  start.lastAt = now;
}

function usePanelSwipe(onClose) {
  const [dragX, setDragX] = useState(0);
  const startRef = useRef(null);
  const elRef = useRef(null);

  const onTouchStart = (e) => {
    const touch = e.touches[0];
    startRef.current = { x: touch.clientX, y: touch.clientY, axis: null };
  };

  const onTouchMove = (e) => {
    const start = startRef.current;
    if (!start) return;
    const dx = e.touches[0].clientX - start.x;
    const dy = e.touches[0].clientY - start.y;
    if (start.axis === null) {
      if (Math.abs(dx) < AXIS_LOCK && Math.abs(dy) < AXIS_LOCK) return;
      start.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    }
    if (start.axis !== "x") return;
    trackSpeed(start, e.touches[0].clientX, e.timeStamp || Date.now());
    setDragX(dx > 0 ? dx : 0);
  };

  const onTouchEnd = () => {
    if (!startRef.current) return;
    const speed = startRef.current.speed || 0;
    const shouldClose = dragX > 70 || (speed > FLING_SPEED && dragX > 16);
    startRef.current = null;
    let exitMs;
    if (shouldClose && elRef.current) {
      elRef.current.style.setProperty("--rb-drag-x", `${dragX}px`);
      exitMs = flingExit(Math.max(1, (elRef.current.offsetWidth || 320) - dragX), speed);
    }
    setDragX(0);
    if (shouldClose) onClose(exitMs);
  };

  return {
    ref: elRef,
    handlers: { onTouchStart, onTouchMove, onTouchEnd, onTouchCancel: onTouchEnd },
    style: dragX ? { transform: `translateX(${dragX}px)`, transition: "none" } : undefined,
  };
}

// A sideways flick on a card that lives inside a vertically scrolling page.
// Same axis lock as the sheets: nothing happens until the finger has said which
// way it is going, and then it stays said until the finger lifts.
function useCardSwipe(onSwipe) {
  const startRef = useRef(null);

  const onTouchStart = (e) => {
    const touch = e.touches[0];
    startRef.current = { x: touch.clientX, y: touch.clientY, axis: null };
  };

  const onTouchMove = (e) => {
    const start = startRef.current;
    if (!start || start.axis !== null) return;
    const dx = e.touches[0].clientX - start.x;
    const dy = e.touches[0].clientY - start.y;
    if (Math.abs(dx) < AXIS_LOCK && Math.abs(dy) < AXIS_LOCK) return;
    start.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  };

  const onTouchEnd = (e) => {
    const start = startRef.current;
    startRef.current = null;
    if (!start || start.axis !== "x") return;
    const touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    const dx = touch.clientX - start.x;
    if (Math.abs(dx) > 50) onSwipe(dx < 0 ? "left" : "right");
  };

  // Wrapped the same way the other two gesture hooks wrap theirs, so the call
  // sites all read alike and none of them can spread nothing by accident.
  return { handlers: { onTouchStart, onTouchMove, onTouchEnd, onTouchCancel: () => (startRef.current = null) } };
}

function useSheetDrag(onClose) {
  const [dragY, setDragY] = useState(0);
  const startRef = useRef(null);
  const elRef = useRef(null);

  const onTouchStart = (e) => {
    const el = e.currentTarget;
    // Only start a dismiss drag when the sheet is scrolled to the top.
    if (el.scrollTop > 0) return;
    const touch = e.touches[0];
    startRef.current = { x: touch.clientX, y: touch.clientY, axis: null };
  };

  const onTouchMove = (e) => {
    const start = startRef.current;
    if (!start) return;
    // Se lo scroll è partito davvero nel frattempo, non è più un trascina-
    // per-chiudere: va interrotto subito. Senza questo controllo, un dy
    // positivo capitato per caso durante lo scroll (un piccolo tremolio
    // della mano, non insolito a metà di un gesto) applicava comunque un
    // translateY minimo a tutta la scheda — è quello che faceva sembrare
    // il titolo fisso in alto spostarsi durante lo scroll, pur essendo
    // sticky: non si muoveva lui, si muoveva il genitore a cui è ancorato.
    // Segnalato da Erny l'11 settembre.
    if (e.currentTarget.scrollTop > 0) {
      startRef.current = null;
      if (dragY) setDragY(0);
      return;
    }
    const dx = e.touches[0].clientX - start.x;
    const dy = e.touches[0].clientY - start.y;
    // Same lock the side panel uses, the other way round: a sideways swipe
    // across a sheet shouldn't start pulling it down.
    if (start.axis === null) {
      if (Math.abs(dx) < AXIS_LOCK && Math.abs(dy) < AXIS_LOCK) return;
      start.axis = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
    }
    if (start.axis !== "y") return;
    trackSpeed(start, e.touches[0].clientY, e.timeStamp || Date.now());
    setDragY(dy > 0 ? dy : 0);
  };

  const onTouchEnd = () => {
    if (!startRef.current) return;
    const speed = startRef.current.speed || 0;
    // A short, fast flick is as clear an intention as a long slow drag, and
    // asking for ninety pixels either way made the quick ones feel ignored.
    const shouldClose = dragY > 90 || (speed > FLING_SPEED && dragY > 16);
    startRef.current = null;
    let exitMs;
    if (shouldClose && elRef.current) {
      // Hand off to the CSS close animation from the exact spot the drag
      // left the sheet, so it continues the motion instead of snapping
      // back to fully open for a frame before sliding away.
      elRef.current.style.setProperty("--rb-drag-y", `${dragY}px`);
      exitMs = flingExit(Math.max(1, (elRef.current.offsetHeight || 400) - dragY), speed);
    }
    setDragY(0);
    if (shouldClose) onClose(exitMs);
  };

  return {
    ref: elRef,
    handlers: { onTouchStart, onTouchMove, onTouchEnd, onTouchCancel: onTouchEnd },
    style: dragY
      ? { transform: `translateY(${dragY}px)`, transition: "none" }
      : undefined,
    dragging: dragY > 0,
  };
}

// A label that slides gently back and forth when it is too wide for its slot,
// so long translations stay fully readable instead of being cut with an
// ellipsis. It measures first and only animates when the text really overflows.
function ScrollingLabel({ children, className = "", style }) {
  const wrapRef = useRef(null);
  const textRef = useRef(null);
  const [distance, setDistance] = useState(0);

  useEffect(() => {
    const wrap = wrapRef.current;
    const text = textRef.current;
    if (!wrap || !text) return;
    const overflow = text.scrollWidth - wrap.clientWidth;
    setDistance(overflow > 1 ? overflow : 0);
  }, [children]);

  return (
    <div ref={wrapRef} className={`rb-marquee ${className}`} style={style}>
      <span
        ref={textRef}
        className={distance ? "rb-marquee-run" : ""}
        style={
          distance
            ? {
                "--rb-marquee-dx": `-${distance + 4}px`,
                // Longer overhangs get proportionally longer to stay readable.
                animationDuration: `${Math.max(5, (distance + 4) / 14)}s`,
              }
            : undefined
        }
      >
        {children}
      </span>
    </div>
  );
}

// The renewal ring is the app's signature, so the spend totals wear it too:
// one arc per category, sized by its share. The ring is deliberately open in
// the top-left quarter, which is where the amount sits and breaks out of it.
// An annular sector with slightly rounded corners. Stroke line caps only offer
// fully round or fully square ends, so the band is drawn as a filled shape
// instead: that way the amount of rounding is a number we control.
function annularSectorPath(cx, cy, ri, ro, a0, a1, k) {
  const at = (radius, angle) => [cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)];
  const span = a1 - a0;
  if (span <= 0) return "";
  const corner = Math.min(k, (ro - ri) / 2.2, (span * ri) / 2.2);
  const to = Math.min(corner / ro, span / 2.2);
  const ti = Math.min(corner / ri, span / 2.2);
  const [x1, y1] = at(ro, a0 + to);
  const [x2, y2] = at(ro, a1 - to);
  const [x3, y3] = at(ro - corner, a1);
  const [x4, y4] = at(ri + corner, a1);
  const [x5, y5] = at(ri, a1 - ti);
  const [x6, y6] = at(ri, a0 + ti);
  const [x7, y7] = at(ri + corner, a0);
  const [x8, y8] = at(ro - corner, a0);
  const bigOuter = span - 2 * to > Math.PI ? 1 : 0;
  const bigInner = span - 2 * ti > Math.PI ? 1 : 0;
  return [
    `M ${x1} ${y1}`,
    `A ${ro} ${ro} 0 ${bigOuter} 1 ${x2} ${y2}`,
    `A ${corner} ${corner} 0 0 1 ${x3} ${y3}`,
    `L ${x4} ${y4}`,
    `A ${corner} ${corner} 0 0 1 ${x5} ${y5}`,
    `A ${ri} ${ri} 0 ${bigInner} 0 ${x6} ${y6}`,
    `A ${corner} ${corner} 0 0 1 ${x7} ${y7}`,
    `L ${x8} ${y8}`,
    `A ${corner} ${corner} 0 0 1 ${x1} ${y1}`,
    "Z",
  ].join(" ");
}

function CategoryRing({ segments, total, colors, size = 160, stroke = 15, corner = 3, selected = null, onSelect = null, animateOnceRef = null, onOpened = null, money, t }) {
  const r = (size - stroke) / 2;
  const ri = r - stroke / 2;
  const ro = r + stroke / 2;
  const cx = size / 2;
  const cy = size / 2;
  const sweepAngle = 2 * Math.PI * RING_SWEEP;
  const gapAngle = segments.length > 1 ? 4 / r : 0;
  // Sotto una certa quota una fetta proporzionale diventa più stretta del
  // solo spazio riservato al distacco fra le fette (`gapAngle`): il disegno
  // non ha più margine per tracciarla e sparisce, non per una scelta ma per
  // mancanza di spazio. Una categoria che c'è, anche per un euro, deve
  // restare leggibile: si garantisce ad ogni fetta con importo positivo
  // un arco visibile di almeno un paio di pixel, sottraendo la differenza
  // alle fette più larghe in proporzione a quanto sono larghe, così la somma
  // degli archi resta esattamente uguale all'apertura totale dell'anello.
  const minVisibleArc = 2;
  const minSlice = gapAngle + minVisibleArc / r;
  const rawSlices = segments.map((seg) => (total > 0 ? (seg.total / total) * sweepAngle : 0));
  let slices = rawSlices.slice();
  for (let pass = 0; pass < 4; pass++) {
    let boostSum = 0;
    const boosted = slices.map((a, i) => {
      const needsBoost = segments[i].total > 0 && a < minSlice;
      if (needsBoost) boostSum += minSlice - a;
      return needsBoost;
    });
    if (boostSum === 0) break;
    const freeSum = slices.reduce((sum, a, i) => (boosted[i] ? sum : sum + a), 0);
    // Non c'è più niente da cui prendere spazio (troppe categorie piccole
    // insieme): meglio fermarsi qui che far sovrapporre gli archi.
    if (freeSum <= boostSum) break;
    slices = slices.map((a, i) => (boosted[i] ? minSlice : a - boostSum * (a / freeSum)));
  }
  // Gli angoli finali di ogni fetta, calcolati una volta sola qui — sia il
  // disegno a riposo sia quello durante l'animazione partono da questi
  // stessi numeri, l'animazione si limita a scalarli.
  let cursor = 0;
  const finalArcs = segments.map((seg, i) => {
    const slice = slices[i];
    const gapStart = i === 0 ? 0 : gapAngle / 2;
    const gapEnd = i === segments.length - 1 ? 0 : gapAngle / 2;
    const a0 = cursor + gapStart;
    const a1 = cursor + slice - gapEnd;
    cursor += slice;
    return { seg, a0, a1 };
  });

  // Se questa scheda deve animarsi la prima volta che si vede, decide qui,
  // una volta sola per montaggio — non a ogni render (si romperebbe di
  // nuovo come nell'11 settembre) e non una volta sola per sessione di
  // HubboApp (l'anello smonta e rimonta ogni volta che si cambia scheda,
  // mentre HubboApp resta montato tutta la sessione: decidere lì voleva
  // dire "anima sempre", non "anima una volta sola" — segnalato da Erny il
  // 12 settembre). `animateOnceRef` vive nel genitore proprio per
  // sopravvivere a questi smontaggi: la prima volta che un'istanza
  // dell'anello lo trova falso, anima e lo alza; ogni istanza successiva lo
  // trova già alzato e non anima più, per tutta la sessione.
  const [shouldAnimate] = useState(() => {
    if (!animateOnceRef || animateOnceRef.current) return false;
    animateOnceRef.current = true;
    return true;
  });
  const [progress, setProgress] = useState(shouldAnimate ? 0 : 1);
  useEffect(() => {
    if (!shouldAnimate) {
      if (onOpened) onOpened();
      return;
    }
    let raf;
    const duration = 700;
    const start = performance.now();
    const tick = (now) => {
      const elapsed = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - elapsed, 3);
      setProgress(eased);
      if (elapsed < 1) {
        raf = requestAnimationFrame(tick);
      } else if (onOpened) {
        onOpened();
      }
    };
    raf = requestAnimationFrame(tick);
    return () => { if (raf) cancelAnimationFrame(raf); };
  }, [shouldAnimate]);

  const interactive = !!onSelect;
  const toggle = (id) => { if (onSelect) onSelect(selected === id ? null : id); };

  return (
    <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }} role="img" aria-label={t ? t.ringAriaLabel(money ? money(total) : total) : undefined}>
      <path d={annularSectorPath(cx, cy, ri, ro, 0, sweepAngle, corner)} fill={colors.surface2} />
      {total > 0 &&
        finalArcs.map(({ seg, a0: a0f, a1: a1f }) => {
          const a0 = a0f * progress;
          const a1 = a1f * progress;
          if (a1 <= a0) return null;
          const isSelected = selected === seg.id;
          const dimmed = selected != null && !isSelected;
          // La fetta scelta si ispessisce leggermente verso il centro
          // dell'anello, non più verso l'esterno: `ro` resta sempre lo
          // stesso, identico al disegno a riposo, per qualunque fetta —
          // la crescita verso l'esterno (+2px) continuava a invadere lo
          // sfondo della legenda anche dopo aver allargato il margine in
          // v157, segnalato di nuovo da Erny il 12 settembre. Crescendo
          // verso il buco invece che verso il bordo, non può più esistere
          // un margine troppo stretto da qualche parte: il bordo esterno
          // dell'anello non si muove mai. Le altre fette si affievoliscono
          // un poco — nessuna delle due esagerata, punto 4 del documento:
          // "non esagerare".
          const segRi = isSelected ? Math.max(0, ri - 2) : ri;
          return (
            <g
              key={seg.id}
              role={interactive ? "button" : undefined}
              tabIndex={interactive ? 0 : undefined}
              aria-label={interactive ? (t ? t.ringSegmentAriaLabel(seg.label, money ? money(seg.total) : seg.total) : seg.label) : undefined}
              aria-pressed={interactive ? isSelected : undefined}
              onClick={interactive ? () => toggle(seg.id) : undefined}
              onKeyDown={
                interactive
                  ? (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(seg.id); } }
                  : undefined
              }
              style={interactive ? { cursor: "pointer", outline: "none" } : undefined}
            >
              <path
                d={annularSectorPath(cx, cy, segRi, ro, a0, a1, corner)}
                fill={seg.color}
                opacity={dimmed ? 0.4 : 1}
                style={{ transition: "opacity 0.2s ease" }}
              />
              {/* Fascia invisibile più larga sopra il segmento vero, solo per
                  ingrandire l'area toccabile — un anello sottile da 13px non
                  è un bersaglio comodo su un telefono. Punto 10 del
                  documento: "non obbligare l'utente a toccare perfettamente
                  il pixel del segmento". Ridotta da +10 a +6 verso l'esterno:
                  anche da invisibile arrivava oltre il margine del
                  contenitore, rischiando di rubare tocchi destinati alla
                  legenda. */}
              {interactive && (
                <path
                  d={annularSectorPath(cx, cy, Math.max(0, ri - 10), ro + 6, a0, a1, corner)}
                  fill="transparent"
                />
              )}
            </g>
          );
        })}
      {/* Tacca centrale per tornare alla vista generale, punto 7 del
          documento — un cerchio invisibile sul "buco" dell'anello, tappabile
          solo quando c'è davvero qualcosa da deselezionare. */}
      {interactive && selected != null && (
        <circle
          cx={cx}
          cy={cy}
          r={ri}
          fill="transparent"
          role="button"
          tabIndex={0}
          aria-label={t ? t.ringClearSelection : undefined}
          onClick={() => onSelect(null)}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(null); } }}
          style={{ cursor: "pointer", outline: "none" }}
        />
      )}
    </svg>
  );
}

// Reads the ring for you: without it the colours mean nothing. Every category
// making up the total is listed — hiding any of them would leave an unexplained
// arc in the ring, which is exactly what the legend exists to prevent.
// Category colours are chosen to sit on the dark ground. On the light one the
// lighter hues come out weaker than the grey label beside them, which puts the
// number — the thing being read — below the word introducing it. Darkening the
// same hue keeps the colour recognisable and gives the figure its weight back.
// Solo per l'Elenco: mette in scena la comparsa della cifra al centro
// dell'anello con un piccolo effetto molla, subito dopo che l'apertura
// dell'anello è finita — non prima, e non ogni volta che si torna
// sull'Elenco, solo alla primissima animazione della sessione. Richiesto
// da Erny il 12 settembre. `animateOnceRef` resta di proprietà di
// CategoryRing (decide se animare e alza il segnalino, come già faceva);
// questo componente si limita a "sbirciare" lo stesso ref una volta sola,
// al proprio montaggio, senza mai alzarlo lui — dato che CategoryRing
// (figlio) alza il segnalino durante il PROPRIO montaggio, che avviene
// sempre dopo che il genitore ha già finito il proprio, questo componente
// vede sempre lo stato del segnalino "prima" che CategoryRing lo tocchi:
// falso alla primissima volta, vero da lì in poi — esattamente lo stesso
// valore che CategoryRing sta per decidere per sé, letto nello stesso
// istante, mai in conflitto.
// Il riquadro che contiene la cifra al centro dell'anello — usato in
// tutte e quattro le schede, non solo l'Elenco. Prima TotalFigure e
// SelectedCategoryFigure si posizionavano da soli con `position:
// absolute` calcolato contro RING_CENTER_X/Y; qui in ListRingArea questo
// creava un problema preciso: l'involucro che nasconde il testo prima
// che l'anello finisca di animarsi (`opacity`, poi la classe dello zoom
// a molla) non aveva lui stesso una dimensione propria — dentro c'era
// solo un figlio posizionato in modo assoluto, che i normali calcoli di
// impaginazione non "vedono" per stabilire quanto è grande un contenitore.
// Un div senza dimensione propria si riduce a un punto, in cima al
// contenitore — e lo zoom CSS parte dal centro della PROPRIA cornice, non
// da dove il testo appare visivamente. Risultato: lo zoom partiva
// dall'angolo in alto a sinistra dell'anello, non dal centro — segnalato
// da Erny il 12 settembre. Corretto dando a QUESTO riquadro, non ai suoi
// figli, la posizione e la dimensione vere del buco dell'anello: ora è
// lui stesso, correttamente centrato, a fare da origine per qualunque
// trasformazione CSS applicata sopra.
function RingCenterBox({ children, className = "", style = {} }) {
  return (
    <div
      style={{
        position: "absolute",
        left: RING_CENTER_X - RING_HOLE_R,
        top: RING_CENTER_Y - RING_HOLE_R,
        width: RING_HOLE_R * 2,
        height: RING_HOLE_R * 2,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        pointerEvents: "none",
        ...style,
      }}
      className={className}
    >
      {children}
    </div>
  );
}

// Solo per l'Elenco: mette in scena la comparsa della cifra al centro
// dell'anello con un piccolo effetto molla, subito dopo che l'apertura
// dell'anello è finita — non prima, e non ogni volta che si torna
// sull'Elenco, solo alla primissima animazione della sessione. Richiesto
// da Erny il 12 settembre. `animateOnceRef` resta di proprietà di
// CategoryRing (decide se animare e alza il segnalino, come già faceva);
// questo componente si limita a "sbirciare" lo stesso ref una volta sola,
// al proprio montaggio, senza mai alzarlo lui — dato che CategoryRing
// (figlio) alza il segnalino durante il PROPRIO montaggio, che avviene
// sempre dopo che il genitore ha già finito il proprio, questo componente
// vede sempre lo stato del segnalino "prima" che CategoryRing lo tocchi:
// falso alla primissima volta, vero da lì in poi — esattamente lo stesso
// valore che CategoryRing sta per decidere per sé, letto nello stesso
// istante, mai in conflitto.
function ListRingArea({ children, animateOnceRef, ringProps }) {
  const [shouldAnimateHere] = useState(() => !animateOnceRef.current);
  const [textReady, setTextReady] = useState(() => !shouldAnimateHere);
  return (
    <>
      <RingCenterBox
        style={{ opacity: textReady ? 1 : 0 }}
        className={shouldAnimateHere && textReady ? "rb-ring-figure-in" : ""}
      >
        {children}
      </RingCenterBox>
      <div style={{ position: "absolute", left: RING_INSET_LEFT, top: RING_INSET_TOP }}>
        <CategoryRing {...ringProps} animateOnceRef={animateOnceRef} onOpened={() => setTextReady(true)} />
      </div>
    </>
  );
}

function shadeForLight(hex, amount) {
  const value = String(hex).replace("#", "");
  if (value.length !== 6) return hex;
  const mix = (from) => Math.round(parseInt(from, 16) * (1 - amount));
  return `#${[value.slice(0, 2), value.slice(2, 4), value.slice(4, 6)].map((p) => mix(p).toString(16).padStart(2, "0")).join("")}`;
}

// The headline amount that sits in the ring's opening. One drawing, used by the
// list and by the calendar, because two copies of it had already drifted apart.
//
// Centred on the ring rather than pinned to a fixed height, so the smaller sizes
// used for longer figures do not ride up towards the top of the opening.
function TotalFigure({ value, lead, colors, moneyParts, animKey, animClass }) {
  const parts = moneyParts(value);
  // La dimensione più grande il cui testo, su una riga sola, resta
  // interamente dentro il cerchio del buco — non più una soglia scritta a
  // mano contro le misure di un anello di una taglia specifica: si
  // ricalcola da RING_HOLE_R, quindi resta corretta anche se l'anello
  // cambia ancora dimensione in futuro. A un'altezza di riga pari alla
  // dimensione del carattere (leading-none), la riga più larga possibile a
  // quell'altezza dentro un cerchio di raggio r è 2·√(r² − (altezza/2)²) —
  // teorema di Pitagora sulla corda a quella distanza dal centro. Un
  // margine di sicurezza di 6px oltre la larghezza del testo, non di più:
  // deve restare dentro, non minuscolo. Corregge lo sconfinamento a
  // sinistra segnalato da Erny il 12 settembre.
  const size = [32, 29, 25, 23, 21, 18, 16, 14].find((candidate) => {
    const halfH = candidate / 2;
    const availSq = RING_HOLE_R * RING_HOLE_R - halfH * halfH;
    if (availSq <= 0) return false;
    const availWidth = 2 * Math.sqrt(availSq);
    const width = parts.symbol.length * Math.round(candidate * 0.72) * 0.6 + 2 + parts.number.length * candidate * 0.6;
    return width <= availWidth - 6;
  }) || 14;
  const mark = <span style={{ color: colors.textPrimary, fontSize: Math.round(size * 0.72) }}>{parts.symbol}</span>;

  return (
    <div
      key={animKey}
      style={{
        whiteSpace: "nowrap",
        fontFamily: "'JetBrains Mono', monospace",
        fontWeight: 700,
        fontSize: size,
        gap: 2,
      }}
      className={`leading-none flex items-baseline ${animClass || ""}`}
    >
      {parts.symbolFirst && mark}
      {/* Ink on the left, the leading category's colour on the right: the
          figure hands over to the ring it belongs to. backgroundImage and not
          the background shorthand — the shorthand resets background-clip, and
          a theme change rewrites only the value that changed, leaving the
          gradient painted over the invisible text. */}
      <span
        style={{
          backgroundImage: `linear-gradient(90deg, ${colors.textPrimary} 0%, ${lead} 100%)`,
          WebkitBackgroundClip: "text",
          backgroundClip: "text",
          color: "transparent",
        }}
      >
        {parts.number}
      </span>
      {!parts.symbolFirst && mark}
    </div>
  );
}

// Quello che compare al centro dell'anello quando una fetta è scelta, al
// posto del totale — stessa "casella" di TotalFigure, centrata nello stesso
// buco. Due righe, non più tre: il nome della categoria è stato tolto,
// sta già scritto affianco nella legenda — non aveva senso ripeterlo
// dentro l'anello, richiesto da Erny il 12 settembre. L'importo prende il
// colore della categoria al posto del nome che non c'è più: resta un
// legame visivo con la fetta toccata, anche senza la scritta. La quota si
// calcola qui, non altrove: mai un numero scritto a mano, punto 5 del
// documento di Erny sull'anello (11 settembre) — "non inserire valori
// hardcoded".
function SelectedCategoryFigure({ seg, total, colors, moneyParts, light, t }) {
  const parts = moneyParts(seg.total);
  const pct = total > 0 ? Math.round((seg.total / total) * 100) : 0;
  const dotColor = light ? shadeForLight(seg.color, 0.32) : seg.color;
  const captionSize = 11;
  // Stessa idea geometrica di TotalFigure (corda del cerchio all'altezza
  // della riga), ma con due righe da far stare invece di una: il budget di
  // larghezza si calcola alla riga più lontana dal centro, quella più
  // stretta delle due.
  const size = [26, 24, 22, 20, 18, 16, 14].find((candidate) => {
    const lineH = candidate;
    const gap = 3;
    const captionLineH = captionSize * 1.3;
    const halfH = (lineH + gap + captionLineH) / 2;
    const availSq = RING_HOLE_R * RING_HOLE_R - halfH * halfH;
    if (availSq <= 0) return false;
    const availWidth = 2 * Math.sqrt(availSq);
    const width = parts.symbol.length * Math.round(candidate * 0.72) * 0.6 + 2 + parts.number.length * candidate * 0.6;
    return width <= availWidth - 6;
  }) || 14;
  const mark = <span style={{ color: dotColor, fontSize: Math.round(size * 0.72) }}>{parts.symbol}</span>;

  return (
    <div className="flex flex-col items-center">
      <div style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 700, fontSize: size, color: dotColor }} className="leading-none flex items-baseline">
        {parts.symbolFirst && mark}
        <span>{parts.number}</span>
        {!parts.symbolFirst && mark}
      </div>
      <div style={{ color: colors.textFaint, fontSize: captionSize }} className="leading-tight mt-1">
        {t.ringPctOfSpend(pct)}
      </div>
    </div>
  );
}

function CategoryLegend({ segments, total, colors, money, light, selected = null, onSelect = null }) {
  if (!segments || segments.length === 0 || total <= 0) return null;
  const interactive = !!onSelect;
  return (
    <div className="flex-1 min-w-0 flex flex-col gap-1">
      {segments.map((seg) => {
        const isSelected = selected === seg.id;
        const dimmed = selected != null && !isSelected;
        const Row = interactive ? "button" : "div";
        return (
          <Row
            key={seg.id}
            type={interactive ? "button" : undefined}
            onClick={interactive ? () => onSelect(isSelected ? null : seg.id) : undefined}
            aria-pressed={interactive ? isSelected : undefined}
            style={{ opacity: dimmed ? 0.5 : 1, transition: "opacity 0.2s ease", background: "transparent", textAlign: "left" }}
            className="flex items-center gap-2 min-w-0 -mx-1 px-1 py-0.5 rounded-lg"
          >
            <span style={{ background: seg.color, width: 9, height: 9, borderRadius: 999 }} className="flex-shrink-0" />
            <span style={{ color: colors.textSecondary }} className="text-xs truncate flex-1">{seg.label}</span>
            {/* The amount rather than the share: a percentage has to be turned
                back into money before it means anything. */}
            {/* The amount takes the category's colour: the dot and the figure
                then say the same thing twice, which is what lets the eye jump
                from a slice of the ring straight to its number. */}
            <span style={{ color: light ? shadeForLight(seg.color, 0.32) : seg.color, fontFamily: "'JetBrains Mono', monospace" }} className="text-xs font-semibold flex-shrink-0">
              {money(seg.total)}
            </span>
          </Row>
        );
      })}
    </div>
  );
}

function SheetHandle({ colors }) {

function Wordmark({ colors, size = 21 }) {

        // A circle resting exactly on the baseline reads as floating above it,
        // which is why round letters are drawn with an overshoot. The ring also
        // carries empty space inside its own box, so the drop has to cover both
        // before any overshoot is left over.
        style={{ margin: `0 ${size * 0.045}px`, transform: `translateY(${size * 0.105}px)` }}
      >
        <circle cx="20" cy="20" r="15" fill="none" stroke={colors.border} strokeWidth="6" />
        <path d={`M 20 5 A 15 15 0 1 1 ${ringSweepEnd(20, 20, 15)}`} fill="none" stroke={ACCENT.amber} strokeWidth="6" strokeLinecap="round" />
        <circle cx="20" cy="20" r="4.5" fill={ACCENT.amber} />
